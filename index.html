<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CCA-F 合格ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Claude Certified Architect – Foundations（CCAR-F）対策の学習アプリ。教科書・練習問題・模擬試験。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: 方眼ノートの紙面＋左サイドバー（モバイルは下部タブ）。読み物は65字幅、試験は集中モードで全幅。 */
:root{
  --paper:#F5F7FB; --grid:rgba(43,89,195,.055); --surface:#FFFFFF; --surface-2:#EEF2F9;
  --ink:#172039; --ink-2:#4B5574; --ink-3:#5A6481; --line:#DCE2EE; --on-sem:#FFFFFF;
  --pen:#2B59C3; --pen-ink:#FFFFFF; --pen-soft:#E3EAFB;
  --hl:#FFE45C; --hl-ink:#172039;
  --ok:#11744C; --ok-soft:#DDF3E9; --ng:#B3322A; --ng-soft:#FBE3E1; --warn:#8A6100; --warn-soft:#FBF0D3;
  --d1:#E0603F; --d2:#14907F; --d3:#6E52E8; --d4:#C98B05; --d5:#CC3F73;
  --d1-soft:#FCE8E2; --d2-soft:#DDF3EF; --d3-soft:#ECE8FD; --d4-soft:#FBF1D8; --d5-soft:#FAE3EC;
  --shadow:0 1px 2px rgba(23,32,57,.06),0 4px 14px rgba(23,32,57,.06);
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11141D; --grid:rgba(122,155,255,.05); --surface:#191E2B; --surface-2:#222939;
  --ink:#E7EBF5; --ink-2:#AEB6CE; --ink-3:#8D96B2; --line:#2D3548; --on-sem:#0E1424;
  --pen:#86A5FF; --pen-ink:#0E1424; --pen-soft:#22305A;
  --hl:rgba(255,222,77,.85); --hl-ink:#111522;
  --ok:#4CC793; --ok-soft:#173528; --ng:#FF7A6E; --ng-soft:#3A1E1D; --warn:#E7B544; --warn-soft:#352B12;
  --d1:#FF8A6A; --d2:#3FC7B3; --d3:#A28CFF; --d4:#EDB43C; --d5:#F57BA5;
  --d1-soft:#3A221C; --d2-soft:#14322E; --d3-soft:#272143; --d4-soft:#352A10; --d5-soft:#3A1D29;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11141D; --grid:rgba(122,155,255,.05); --surface:#191E2B; --surface-2:#222939;
  --ink:#E7EBF5; --ink-2:#AEB6CE; --ink-3:#8D96B2; --line:#2D3548; --on-sem:#0E1424;
  --pen:#86A5FF; --pen-ink:#0E1424; --pen-soft:#22305A;
  --hl:rgba(255,222,77,.85); --hl-ink:#111522;
  --ok:#4CC793; --ok-soft:#173528; --ng:#FF7A6E; --ng-soft:#3A1E1D; --warn:#E7B544; --warn-soft:#352B12;
  --d1:#FF8A6A; --d2:#3FC7B3; --d3:#A28CFF; --d4:#EDB43C; --d5:#F57BA5;
  --d1-soft:#3A221C; --d2-soft:#14322E; --d3-soft:#272143; --d4-soft:#352A10; --d5-soft:#3A1D29;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15.5px; line-height:1.8;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:var(--pen)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);padding:.05em .4em;border-radius:6px;word-break:break-word}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;padding:0 .1em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--pen);color:var(--pen-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;transform:rotate(-4deg);box-shadow:3px 3px 0 var(--hl)}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.2}
.brand small{color:var(--ink-3);font-size:11.5px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:700;font-size:14.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--pen-soft);color:var(--pen)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:10px;line-height:1.6}
.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.read{max-width:760px}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--ink-3);text-decoration:none;padding:6px 0;border-radius:10px}
  .tabbar a.on{color:var(--pen);background:var(--pen-soft)}
  .tabbar svg{width:22px;height:22px}
  body{font-size:15px}
}
body.focus .side,body.focus .tabbar{display:none}
body.focus .app{grid-template-columns:minmax(0,1fr)}
body.focus .main{padding-block:0 40px}
/* generic */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-h h1{font-size:clamp(24px,3.6vw,32px);font-weight:800}
.page-h p{margin:4px 0 0;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:11px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.3;min-height:44px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pen);color:var(--pen-ink);border-color:var(--pen);box-shadow:0 3px 0 color-mix(in srgb,var(--pen) 55%,#000)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--pen) 55%,#000)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 40%,var(--line))}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.muted{color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);margin:.6em 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ng{background:var(--ng-soft);color:var(--ng);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.pen{background:var(--pen-soft);color:var(--pen);border-color:transparent}
.sticker{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:12px;padding:3px 10px 3px 8px;border-radius:7px;color:#fff;transform:rotate(-2deg);white-space:nowrap}
.sticker.d1{background:var(--d1)}.sticker.d2{background:var(--d2)}.sticker.d3{background:var(--d3)}.sticker.d4{background:var(--d4)}.sticker.d5{background:var(--d5)}.sticker.d0{background:var(--ink-2)}
.sticker.d1,.sticker.d2,.sticker.d4{color:#111522}
:root[data-theme="dark"] .sticker{color:#111522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sticker{color:#111522}}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pen)}
.tnum{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:36px 16px;color:var(--ink-3)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-main{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.hero-main h1{font-size:clamp(25px,3.8vw,36px);font-weight:800;margin:.25em 0 .35em}
.hero-main p{color:var(--ink-2);margin:0 0 18px;max-width:34em}
.hero-main .tape{position:absolute;top:14px;right:-30px;transform:rotate(35deg);background:var(--hl);color:var(--hl-ink);font-family:var(--f-display);font-weight:800;font-size:12px;padding:4px 40px;letter-spacing:.06em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.facts>div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.facts span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.facts b{font-family:var(--f-display);font-size:22px;line-height:1.3}
.facts small{font-size:11px;color:var(--ink-3);line-height:1.4}
@media (max-width:620px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:700}
.next{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.next .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--pen-soft);flex:none}
.dom-row{display:grid;grid-template-columns:172px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13.5px}
.dom-row .lbl{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.dom-row .lbl i{width:10px;height:10px;border-radius:3px;flex:none}
@media (max-width:520px){.dom-row{grid-template-columns:128px minmax(0,1fr) 42px;font-size:12px}}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;border:2px solid var(--pen);color:var(--pen);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:13px}
.steps li.done::before{content:"✓";background:var(--pen);color:var(--pen-ink)}
/* learn index */
.dom-card{border-top:5px solid var(--dc,var(--pen));display:flex;flex-direction:column;gap:12px}
.dom-card h2{font-size:18px}
.dom-card p{margin:0;color:var(--ink-2);font-size:14px}
.lesson-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lesson-list a{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-radius:9px;text-decoration:none;color:var(--ink);border-bottom:1px dashed var(--line)}
.lesson-list li:last-child a{border-bottom:0}
.lesson-list a:hover{background:var(--surface-2)}
.lesson-list .num{font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--dc,var(--pen))}
.lesson-list .t{font-weight:700;font-size:14.5px;line-height:1.5}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--on-sem)}
/* lesson */
.lesson-head{display:flex;flex-direction:column;gap:10px}
.lesson-head h1{font-size:clamp(25px,4vw,34px);font-weight:800}
.lesson-head .en{font-size:13px;color:var(--ink-3);font-style:italic;line-height:1.5}
.tldr{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;position:relative;box-shadow:5px 5px 0 var(--hl)}
.tldr b.lab{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;display:block;margin-bottom:2px}
.tldr p{margin:0;font-weight:700}
.analogy{background:var(--warn-soft);border-radius:4px 4px 16px 4px;padding:16px 18px;position:relative;transform:rotate(-.4deg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.analogy b.lab{font-family:var(--f-display);color:var(--warn);font-size:13.5px;display:block;margin-bottom:2px}
.analogy p{margin:0}
.analogy-inline{background:var(--warn-soft);padding:10px 14px;border-radius:10px;margin:.6em 0;font-size:14.5px}
.sec h2{font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--dc,var(--pen))}
.sec{line-height:1.9}
.sec p{margin:.5em 0}
.sec ul,.sec ol{padding-left:1.4em;margin:.4em 0}
.sec li{margin:.25em 0}
ol.flow{list-style:none;padding:0;counter-reset:f;display:grid;gap:8px}
ol.flow li{counter-increment:f;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 44px;margin:0}
ol.flow li::before{content:counter(f);position:absolute;left:14px;top:7px;font-family:var(--f-display);font-weight:800;color:var(--dc,var(--pen));font-size:18px}
pre.ex{font-family:var(--f-mono);font-size:13px;line-height:1.65;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:.6em 0}
.tbl-wrap{overflow-x:auto;margin:.6em 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.6}
.tbl th{background:var(--surface-2);font-weight:700;font-size:13px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{min-width:6.5em}
.traps{display:grid;gap:10px}
.trap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.trap>div{padding:10px 14px;font-size:14px;line-height:1.65;display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.trap .bad{background:var(--ng-soft)}
.trap .bad::before{content:"✗";color:var(--ng);font-weight:800}
.trap .good::before{content:"○";color:var(--ok);font-weight:800}
@media (max-width:620px){.trap{grid-template-columns:minmax(0,1fr)}}
.remember{display:flex;gap:12px;align-items:center;background:var(--pen);color:var(--pen-ink);border-radius:var(--r);padding:16px 18px;font-weight:700;font-family:var(--f-display);font-size:17px;line-height:1.5}
.remember small{display:block;font-size:11.5px;letter-spacing:.1em;opacity:.8;font-family:var(--f-body)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys a{text-decoration:none}
.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson-nav a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.lesson-nav a small{color:var(--ink-3);font-size:12px}
.lesson-nav a b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-nav a.nx{text-align:right}
.scn-list{display:grid;gap:12px}
.scn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.scn .ic{font-size:26px;line-height:1}
.scn h3{font-size:15.5px}
.scn p{margin:.3em 0 0;font-size:14px;color:var(--ink-2);line-height:1.75}
/* practice */
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--pen)}
.mode .ic{font-size:26px}
.mode b{font-family:var(--f-display);font-size:16px}
.mode span{font-size:13px;color:var(--ink-2);line-height:1.6}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:38px}
.pick button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.task-acc{display:flex;flex-direction:column;gap:4px}
.task-row{display:grid;grid-template-columns:44px minmax(0,1fr) 70px auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.task-row .num{font-family:var(--f-mono);font-weight:700;font-size:12.5px}
.task-row .t{font-size:14px;font-weight:700;line-height:1.45;min-width:0}
@media (max-width:620px){.task-row{grid-template-columns:40px minmax(0,1fr) auto}.task-row .bar{display:none}}
/* question */

const Q_D1 = [
{"id":"d1-01","t":"1.1","s":1,"q":"サポートエージェントのループ処理で、Claude の返答に「ご対応が完了しました」という文言が含まれていたらループを終了する実装になっています。ところが、文言が含まれているのにツール呼び出しが残っていて処理が中断するケースが発生しています。最も適切な修正はどれですか？","o":["\"end_turn\" ならループを終了し、\"tool_use\" ならツールを実行して続ける","終了を示す文言のバリエーションを洗い出して辞書を作り、正規表現で厳密に一致したときだけループを終了する","中断を防ぐため、ループを最大5回まで必ず回してから終了するようにし、途中では止めない上限を設ける","返答にテキストが含まれていれば完了とみなし、残っているツール呼び出しは実行せずに無視して終了する"],"a":[0],"e":"ループの継続・終了は stop_reason で判定するのが基本です。自然言語の文言で終了を判定するのは公式ガイドが名指しするアンチパターンです。","w":["正解。\"tool_use\" なら継続、\"end_turn\" なら終了が正しい制御フローです。","文言の判定をいくら精密にしても、自然言語に頼る点は変わりません。","回数上限は安全装置であって、主な停止条件にするのはアンチパターンです。","テキストとツール呼び出しは同時に返ることがあり、テキストの有無は完了の指標になりません。"]},
{"id":"d1-02","t":"1.1","s":4,"q":"開発者支援エージェントが、同じ Grep ツールを同じ引数で何度も繰り返し呼び出してしまいます。ログを見ると、ツールは毎回正しく実行されています。最も可能性の高い原因はどれですか？","o":["ツールの実行結果が会話履歴に追加されず、次のリクエストに含まれていない","Grep ツールの説明文が短すぎて、何度も呼ぶ必要があると誤解されている","tool_choice が \"auto\" になっていて、同じツールが選ばれ続けている","システムプロンプトが長すぎて、直前の指示を忘れてしまっている"],"a":[0],"e":"ツールの結果を会話履歴に追加して次のリクエストで渡すことで、Claude は新しい情報を踏まえて次の行動を判断できます。結果が渡らなければ、Claude は同じ情報を取りに行こうとします。","w":["正解。結果が履歴にないと、Claude からは「まだ結果を得ていない」状態に見えます。","説明文の問題ならツールの選び間違いが起きますが、同じ呼び出しの繰り返しの直接原因ではありません。","\"auto\" は通常の設定で、繰り返し呼び出しの原因ではありません。","長さは今回の症状と直接関係しません。"]},
{"id":"d1-03","t":"1.1","s":3,"q":"調査エージェントのループ設計について、チームから「無限ループが怖いので、15回で打ち切ることを主な終了条件にしよう」という提案がありました。どう評価しますか？","o":["終了判定は stop_reason で行い、回数上限は暴走時の安全装置として補助的に使う","提案どおり15回を主な終了条件にし、stop_reason は参考程度に記録だけしておく","stop_reason があれば十分なので、回数上限は不要として完全に削除する","Claude に毎回「まだ続けますか？」と自己申告させ、その返事で終了を判断する"],"a":[0],"e":"任意の回数上限を「主な」停止メカニズムにするのはアンチパターンです。正しくは stop_reason で判定し、上限はあくまで保険です。","w":["正解。主役は stop_reason、上限は保険という役割分担です。","複雑な調査が15回で途中打ち切りになるなど、品質が不安定になります。","安全装置としての上限まで消す必要はありません。","自然言語での自己申告に頼る判定は、文言で判定するのと同じ問題を抱えます。"]},
{"id":"d1-04","t":"1.1","s":1,"q":"エージェントループの実装として正しいものを2つ選んでください。","o":["\"tool_use\" ならツールを実行し、結果を履歴に追加して再送する","\"end_turn\" ならループを終えて、最終応答をユーザーに返す","返答のテキストに「完了」が含まれるかを毎回チェックして終了を判断する","ツールの結果は要約してシステムプロンプトに書き換え、会話履歴には残さない","ツールの実行順序をあらかじめ固定し、Claude の判断は使わない"],"a":[0,1],"e":"エージェントループは「送信 → stop_reason を確認 → ツール実行 → 結果を履歴に追加 → 再送信」の繰り返しです。","w":["正解。ツール結果を履歴に加えて次の判断材料にします。","正解。\"end_turn\" が完了の合図です。","自然言語での終了判定はアンチパターンです。","結果を会話履歴に追加することで、Claude が次の行動を推論できます。","固定の順序はエージェント（モデル主導の判断）の強みを捨てています。"]},
{"id":"d1-05","t":"1.1","s":4,"q":"エージェント設計の説明で「モデル主導の意思決定」に当てはまるものはどれですか？","o":["Claude がそれまでの文脈から、次にどのツールを呼ぶかを判断する","あらかじめ作った決定木に沿って、条件ごとに次のツールが呼ばれる","決められた順番で、毎回すべてのツールを1回ずつ必ず呼び出す","ユーザーが画面で毎回どのツールを使うかを選び、実行を指示する"],"a":[0],"e":"公式ガイドは、Claude が文脈に基づいて次のツールを推論する「モデル主導」と、事前に設定した決定木やツール順序を区別しています。","w":["正解。これがモデル主導の意思決定です。","決定木は事前構成の仕組みで、モデル主導ではありません。","固定のツール順序もモデル主導ではありません。","ユーザー主導であり、エージェントの自律判断ではありません。"]},
{"id":"d1-06","t":"1.2","s":3,"q":"「リモートワークが都市経済に与える影響」を調査させたところ、レポートが不動産価格の話しか扱っていません。各サブエージェントのログはすべて正常終了で、コーディネーターは「オフィス賃料」「住宅価格」「商業地の空室率」の3つにタスクを分けていました。根本原因はどれですか？","o":["コーディネーターのタスク分解が狭く、交通・小売・税収などの領域が割り当てられていない","検索サブエージェントの検索クエリが不十分で、他の分野の記事を拾えていない","統合サブエージェントが、受け取った結果の不足を指摘する指示を持っていない","文書分析サブエージェントの関連度フィルタが厳しすぎ、他分野の資料を除外している"],"a":[0],"e":"サブエージェントは割り当てどおりに正しく動いています。問題は「何を割り当てたか」、つまりコーディネーターの分解の狭さです。","w":["正解。分解が狭すぎると、下流が完璧でも範囲が偏ります。","検索係は与えられたサブトピックを正しく調べています。","統合係の改善は補助にはなりますが、根本原因ではありません。","分析係は割り当てられた範囲で正常に動いています。"]},
{"id":"d1-07","t":"1.2","s":3,"q":"調査システムで、検索サブエージェントが分析サブエージェントへ直接結果を送る構成にしたところ、どこでエラーが起きたか追跡できなくなりました。推奨される構成はどれですか？","o":["すべてのサブエージェント間の通信をコーディネーター経由にする（ハブ＆スポーク）","サブエージェント同士の直接通信を増やし、各自のログ出力を詳しくして追跡する","すべての処理を1つの大きなエージェントにまとめ、エラーの発生源を1か所にする","各サブエージェントが自分のエラーを独自の形式で記録し、あとで突き合わせる"],"a":[0],"e":"コーディネーターを経由させると、観測性・一貫したエラー処理・情報の流れの制御が得られます。","w":["正解。ハブ＆スポークが推奨パターンです。","直接通信を増やすほど流れが追いにくくなります。","専門化の利点を失い、コンテキストも肥大化します。","形式がバラバラだと一貫したエラー処理ができません。"]},
{"id":"d1-08","t":"1.2","s":3,"q":"「今日の東京の天気」のような単純な質問でも、コーディネーターが検索・分析・統合・レポートの全サブエージェントを順番に呼び出しており、遅くてコストも高くなっています。最も適切な改善はどれですか？","o":["コーディネーターが質問の要件を分析し、必要なサブエージェントだけを動的に選んで呼ぶようにする","全サブエージェントを常に並列で呼び出すようにして、順番待ちによる待ち時間を短くする","単純な質問はコーディネーターの入口で検知して受け付けず、一般の検索エンジンを使うよう案内する","最後に呼ばれるレポート作成サブエージェントを削除して、パイプラインを1段短くする"],"a":[0],"e":"公式ガイドは、毎回フルパイプラインを通すのではなく、クエリの複雑さに応じて呼ぶサブエージェントを動的に選ぶ設計を推奨しています。","w":["正解。必要な分だけ呼ぶのが良いコーディネーターです。","並列化しても不要な呼び出しのコストは残ります。","機能を削るのは改善ではありません。","複雑な調査ではレポート係が必要です。"]},
{"id":"d1-09","t":"1.2","s":3,"q":"複数の検索サブエージェントが同じ記事を何度も取得してしまい、ムダが発生しています。コーディネーター側でできる最も効果的な対策はどれですか？","o":["各サブエージェントに異なるサブトピックや情報源の種類を割り当て、担当範囲を分ける","サブエージェントの数を1つに減らし、同じ記事を二重に取得しないようにする","検索結果をすべて統合係に渡し、統合係に重複した記事を削除させてからまとめる","検索クエリを毎回ランダムに変えて、同じ記事に当たる確率を下げる"],"a":[0],"e":"調査範囲をサブエージェントごとに分割（サブトピック・情報源の種類など）すると、重複を最小化できます。","w":["正解。担当範囲の分割が公式の推奨です。","並列調査の利点がなくなります。","後から消すより、最初から重複させない方が効率的です。","ランダムでは網羅性も効率も保証されません。"]},
{"id":"d1-10","t":"1.2","s":3,"q":"レポートの網羅性を高めるためのコーディネーターの動作として、最も適切なものはどれですか？","o":["統合結果の不足を評価し、的を絞ったクエリで再委任して統合し直す","最初の統合結果をそのまま最終レポートとして出力し、処理時間とコストを抑える","不足が見つかったら、レポートの末尾に「この点は情報不足」と注記して処理を終える","統合サブエージェントにも検索ツールを持たせ、不足があれば自分で追加検索させる"],"a":[0],"e":"公式ガイドの「反復改善ループ」です。コーディネーターが不足を評価し、ターゲットを絞って再委任し、カバレッジが十分になるまで繰り返します。","w":["正解。反復改善ループの説明そのものです。","不足の確認をしていません。","改善の努力をせずに終わっています（注記は最終手段）。","統合係に検索をさせると役割外のツール使用になります（2.3）。"]},
{"id":"d1-11","t":"1.3","s":3,"q":"新しく作ったコーディネーターが、サブエージェントを一切起動できません。AgentDefinition は正しく設定されています。最初に確認すべきことはどれですか？","o":["コーディネーターの allowedTools に \"Task\" が含まれているか","サブエージェントのシステムプロンプトが長すぎて、読み込みに失敗していないか","tool_choice が \"any\" になっていて、Task 以外が選ばれていないか","プロジェクトに .mcp.json が存在し、サブエージェントが登録されているか"],"a":[0],"e":"サブエージェントは Task ツールで起動します。コーディネーターの allowedTools に \"Task\" が含まれていなければ呼び出せません。","w":["正解。\"Task\" の許可が前提条件です。","プロンプトの長さは起動の可否と無関係です。","tool_choice の設定ではサブエージェントの起動可否は決まりません。","MCP設定はサブエージェント起動の前提ではありません。"]},
{"id":"d1-12","t":"1.3","s":3,"q":"統合サブエージェントが「まだ十分な情報がありません」と返し続けます。コーディネーターは検索と分析の結果をすでに会話内で受け取っています。原因と対策として最も適切なものはどれですか？","o":["サブエージェントは親の会話を引き継がないため、検索・分析の結果をプロンプトに含めて渡す","統合サブエージェントのシステムプロンプトに「親の会話を参照して、検索・分析結果を使うこと」と指示する","統合サブエージェントに検索ツールを与え、足りない情報を自分で集めてからまとめさせる","統合サブエージェントの温度設定を上げて、手元の情報からでも積極的に文章を書かせる"],"a":[0],"e":"サブエージェントは隔離されたコンテキストで動き、親の履歴やメモリを自動では共有しません。必要な情報は明示的にプロンプトへ含めます。","w":["正解。親の会話は自動では見えないので、前段の結果を丸ごとプロンプトに入れて渡します。","そもそも参照できないので、指示しても効果はありません。","役割外のツールを与えると誤用の原因になります。","情報不足の問題は設定値では解決しません。"]},
{"id":"d1-13","t":"1.3","s":3,"q":"3つの検索サブエージェントを並列に動かしたいのに、実際には1つずつ順番に実行されています。コーディネーターは毎ターン1つの Task 呼び出しを出しています。どう直しますか？","o":["コーディネーターの1回の応答の中で、複数の Task ツール呼び出しを同時に出させる","サブエージェントごとに別のコーディネーターを用意して、それぞれ同時に動かす","Task の代わりに Bash で3つのプロセスを並列に起動させ、結果を集める","各サブエージェントのタイムアウトを短くして、順番待ちの時間を減らす"],"a":[0],"e":"並列のサブエージェントは、1回のコーディネーター応答で複数の Task 呼び出しを出すことで起動します。ターンを分けると逐次になります。","w":["正解。単一応答での複数 Task 呼び出しが正解です。","構成を複雑にするだけで、並列化の正しい方法ではありません。","SDKのサブエージェント機構を迂回しており不適切です。","タイムアウトは並列性と無関係です。"]},
{"id":"d1-14","t":"1.3","s":3,"q":"最終レポートで、どの主張がどの文献に基づくのか分からなくなっています。サブエージェント間で情報を受け渡す方法として最も適切なものはどれですか？","o":["本文と出典メタデータを分けた構造化データで渡す","読みやすさのため、すべてを1つの長い文章にまとめて渡す","本文だけを渡し、出典は最後にまとめて一覧にして添える","出典はコーディネーターだけが保持し、本文だけを次に渡す"],"a":[0],"e":"構造化データで内容とメタデータを分離すると、エージェント間で出典（帰属）を保てます。","w":["正解。主張ごとに出典がひも付いた構造を保ちます。","文章にまとめると、どの主張がどの出典か分からなくなります。","一覧だけでは主張との対応が失われます。","統合係が出典を参照できず、対応付けが崩れます。"]},
{"id":"d1-15","t":"1.3","s":3,"q":"コーディネーターのプロンプトに「1. 検索を3回行う 2. 上位5件を要約する 3. …」と細かい手順を書いたところ、想定外の状況でサブエージェントが柔軟に対応できなくなりました。推奨される書き方はどれですか？","o":["目的と品質基準を伝え、進め方はサブエージェントに任せる","手順をさらに細かくし、想定される例外ケースもすべて列挙する","手順をすべて削除し、サブエージェントには目的も何も伝えない","同じ手順をサブエージェントのシステムプロンプトにもコピーする"],"a":[0],"e":"公式ガイドは、段階的な手順よりも「調査目標と品質基準」を指定するコーディネータープロンプトを推奨しています。サブエージェントの適応力を活かすためです。","w":["正解。目的と基準で導くのが推奨です。","すべての例外を列挙するのは不可能で、柔軟性はさらに落ちます。","目的も基準もないと品質がばらつきます。","場所を移しても手順依存の問題は変わりません。"]},
{"id":"d1-16","t":"1.4","s":1,"q":"本番ログで、エージェントがまれに get_customer を呼ばずに、顧客が名乗った名前だけで process_refund を実行していることが分かりました。誤った返金につながる重大な問題です。最も効果的な対策はどれですか？","o":["検証済みの顧客IDが得られるまで process_refund をプログラムでブロックする","システムプロンプトの冒頭に「返金前に必ず get_customer で本人確認すること」と太字で強調して書く","get_customer を先に呼んでから返金するFew-shot例を10個追加し、正しい順序を繰り返し見せる","返金処理はそのまま実行させ、処理の後で get_customer を呼んで本人確認と照合を行う"],"a":[0],"e":"金銭的な影響のある順序の保証には、プロンプトでなくプログラムによる強制（決定的）が必要です。プロンプトや例は確率的で、失敗率がゼロになりません。","w":["正解。前提ゲートで決定的に順序を守らせます。","プロンプトの指示は確率的で、まれな失敗が残ります。","Few-shot例も確率的な改善にとどまります。","事後の確認では誤った返金を防げません。"]},
{"id":"d1-17","t":"1.4","s":1,"q":"エージェントが人間の担当者へエスカレーションする際、担当者からは「何の件か分からない」と苦情が出ています。担当者は会話の全文を見られません。最も適切な改善はどれですか？","o":["顧客ID・原因・返金額・推奨対応をまとめた要約を渡す","担当者が経緯を確認できるよう、会話ログ全文へのリンクを渡す","優先度が伝わるよう「至急対応してください」と添えて引き継ぐ","苦情を避けるため、エスカレーションの頻度そのものを減らす"],"a":[0],"e":"会話の記録にアクセスできない担当者向けに、構造化されたハンドオフ要約（顧客ID、根本原因、金額、推奨対応）をまとめるのが公式の推奨です。","w":["正解。担当者がすぐ動ける情報をまとめます。","担当者は記録にアクセスできない前提です。また全文を読ませるのは非効率です。","緊急度だけでは何をすべきか分かりません。","根本的な問題（情報不足）を解決していません。"]},
{"id":"d1-18","t":"1.4","s":1,"q":"顧客が「先月の請求が二重になっているし、届いた商品も壊れていた」と1つのメッセージで2つの問題を伝えてきました。エージェントの処理として最も適切なものはどれですか？","o":["請求と商品破損の2件に分けてそれぞれ調べ、最後にひとつの回答にまとめる","最初に書かれた請求の問題だけを処理し、商品の件は改めて連絡してもらう","2つの問題が絡むと複雑なので、両方まとめてすぐに人間の担当者へエスカレーションする","処理の混乱を避けるため、顧客にまずどちらか1つの問題を選んでもらってから対応する"],"a":[0],"e":"複数の懸念を含む依頼は、個別の項目に分解して調査し、統一された解決策にまとめるのが推奨パターンです。","w":["正解。分解 → 調査 → 統合の流れです。","初回解決率が下がり、顧客体験も悪化します。","対応可能な問題まで引き継ぐと、初回解決率の目標から遠ざかります。","顧客に負担をかけるだけです。"]},
{"id":"d1-19","t":"1.4","s":1,"q":"次のうち、プロンプトによる指示ではなくプログラムによる強制（フック・前提ゲート）を選ぶべきケースを2つ選んでください。","o":["本人確認が完了するまで、口座情報の変更を行わせない","一定額を超える返金を自動実行させない","顧客への返答を丁寧な口調にする","回答の最後に満足度アンケートの案内を添える","回答をなるべく簡潔にまとめる"],"a":[0,1],"e":"決定的な遵守が必要な業務ルール（本人確認、金額上限など）はプログラムで強制します。口調や体裁のようなベストエフォートの方針はプロンプトで十分です。","w":["正解。セキュリティ上の前提条件は確実に守らせる必要があります。","正解。金銭的なルールは確実性が必要です。","口調はプロンプトでの案内で十分です。","体裁の方針はプロンプトで扱えます。","簡潔さはプロンプトでの案内が適切です。"]},
{"id":"d1-20","t":"1.4","s":1,"q":"あるメンバーが「システムプロンプトを十分に工夫すれば、本人確認の手順は100%守られる」と主張しています。公式ガイドの考え方に沿った反論はどれですか？","o":["プロンプトは確率的で失敗率はゼロにならず、確実さが要るならプログラムで強制すべき","プロンプトは長くするほど守られなくなるので、本人確認の指示を短く簡潔にすべき","本人確認の手順を示すFew-shot例を十分に加えれば、100%守られるようになる","本人確認は顧客の自己申告で十分なので、プロンプトの工夫だけで問題ない"],"a":[0],"e":"公式ガイドは、決定的な遵守が必要な場面でプロンプト指示だけでは「ゼロでない失敗率」が残ると明記しています。","w":["正解。確率的 vs 決定的の区別がポイントです。","長さの問題ではなく、確率的であること自体が問題です。","Few-shot例も確率的な改善です。","セキュリティ上不適切です。"]},
{"id":"d1-21","t":"1.5","s":1,"q":"注文システムのツールはUnixタイムスタンプ、配送システムのツールはISO 8601形式、さらに別のツールは数値のステータスコードを返すため、エージェントが日付や状態を取り違えます。最も適切な解決策はどれですか？","o":["PostToolUse フックで結果の形式をそろえてから渡す","システムプロンプトで各ツールの日付・ステータス形式の読み方を詳しく説明する","すべてのバックエンドシステムを改修して、返す形式をそろえる","データ形式ごとに別々のエージェントを用意し、それぞれに解釈させる"],"a":[0],"e":"PostToolUse フックはツール結果をモデルが処理する前に変換でき、異なる形式の正規化に最適です。","w":["正解。モデルが読む前に確実に整形できます。","プロンプトでの説明は確率的で、取り違えが残ります。","大きな改修が必要で、最初の対策として釣り合いません。","構成を不必要に複雑にします。"]},
{"id":"d1-22","t":"1.5","s":1,"q":"返金ポリシーで「500ドルを超える返金は人間の承認が必要」と定められています。エージェントがこのルールを破らないようにする最適な方法はどれですか？","o":["process_refund の呼び出しをフックで横取りし、500ドル超はブロックして人へ回す","システムプロンプトに「500ドルを超える返金は絶対に実行しないこと」と太字で明記する","返金はそのまま実行させ、毎日の監査で500ドル超の返金を洗い出して担当者が確認する","エージェントから process_refund ツールを外し、すべての返金を人間の担当者が処理する"],"a":[0],"e":"ツール呼び出しを横取りするフックで、ポリシー違反を確実にブロックし、代替ワークフロー（人へのエスカレーション）に誘導するのが公式の推奨です。","w":["正解。ブロック＋代替ルートへの誘導がポイントです。","プロンプトは確率的な遵守にとどまります。","事後監査では違反そのものを防げません。","500ドル以下の返金まで自動化できなくなり、初回解決率が下がります。"]},
{"id":"d1-23","t":"1.5","s":4,"q":"Agent SDK のフックについての説明として正しいものを2つ選んでください。","o":["PostToolUse フックは、ツールの結果をモデルが処理する前に変換できる","ツール呼び出しを横取りするフックで、ポリシーに違反するアクションをブロックできる","フックはモデルの確率的な判断に依存するため、確実性はプロンプトと同程度である","フックはシステムプロンプトの一部として記述する","フックを使うとツールの説明文が不要になる"],"a":[0,1],"e":"フックはプログラムとして動くため決定的な保証を与えます。結果の変換（PostToolUse）と、呼び出しの横取り（ブロック・リダイレクト）の2パターンが重要です。","w":["正解。データ正規化などに使います。","正解。コンプライアンスの強制に使います。","フックはプログラムなので決定的です。","フックはプロンプトではなくコードです。","ツール選択には引き続き説明文が重要です。"]},
{"id":"d1-24","t":"1.5","s":1,"q":"次のうち、フックではなくプロンプトでの指示が適している要件はどれですか？","o":["お客様の気持ちに寄り添った言葉づかいをする","500ドル超の返金を禁止する","本人確認前の注文検索を禁止する","ツール結果の日付をISO 8601に統一する"],"a":[0],"e":"言葉づかいのような「ベストエフォート」の方針はプロンプトで扱います。確実な遵守やデータ変換が必要なものはフックが適しています。","w":["正解。口調はプロンプトでの案内が向いています。","金額ルールは確実性が必要なのでフックです。","順序の強制は前提ゲート／フックです。","データの正規化は PostToolUse フックです。"]},
{"id":"d1-25","t":"1.6","s":4,"q":"「このレガシーコードベースに包括的なテストを追加して」という依頼を受けました。最も適切な進め方はどれですか？","o":["構造を把握して重要な領域を特定し、優先順位つきの計画を発見に応じて調整する","漏れがないよう、ファイル名のアルファベット順にすべてのファイルへテストを書いていく","最初に全ファイルのテスト計画を細かく固定し、途中で何が分かってもそのとおりに進める","コード量が多いほど重要と考え、一番大きなファイルから順にテストを書いていく"],"a":[0],"e":"ゴールが開かれた作業は「動的分解」が向いています。構造の把握 → 重要領域の特定 → 優先順位つき計画 → 発見に応じた調整、が公式の例です。","w":["正解。適応的な調査計画です。","重要度を考慮しておらず非効率です。","途中で見つかる依存関係に対応できません。","大きさと重要度は一致しません。"]},
{"id":"d1-26","t":"1.6","s":5,"q":"毎回「セキュリティ」「パフォーマンス」「命名規則」の3観点で決まった手順のレビューを行います。適したタスク分解のパターンはどれですか？","o":["プロンプトチェイニング（固定の順序で段階的に処理する）","動的分解（途中の発見に応じてサブタスクを生成する）","1回のプロンプトですべてを同時に処理する","人間がその都度手順を決める"],"a":[0],"e":"予測可能な多観点レビューはプロンプトチェイニング、ゴールの見えない調査は動的分解、と使い分けます。","w":["正解。流れが決まっているならチェイニングです。","動的分解は開かれた調査向きです。","注意が分散し、観点ごとの質が下がりやすくなります。","自動化の意味が薄れます。"]},
{"id":"d1-27","t":"1.6","s":5,"q":"20ファイルに及ぶプルリクエストを1回で丸ごとレビューさせたところ、ファイルによって指摘の深さがバラバラで、同じパターンを片方では問題視し、もう片方では見逃しました。どう再構成しますか？","o":["ファイルごとにローカルな問題を分析するパスと、ファイル横断のデータの流れを見る統合パスに分ける","より大きなコンテキストウィンドウのモデルに切り替え、全ファイルを1回でレビューする","同じレビューを3回行い、2回以上出た指摘だけを採用して、ばらつきと見落としを抑える","開発者にPRを3〜4ファイルずつに分割させ、小さいPRだけをレビューする"],"a":[0],"e":"注意の希釈が根本原因です。ファイル単位のパスで一貫した深さを確保し、統合パスでファイル間の問題を捉えます。","w":["正解。分割パス＋統合パスが推奨です。","コンテキストが大きくても注意の質の問題は解決しません。","多数決は時々しか検出されない本物のバグを消してしまいます。","開発者に負担を移すだけで、システムは改善しません。"]},
{"id":"d1-28","t":"1.6","s":3,"q":"「新興市場で急成長している業界を調べて」のように、調べてみないと何が出てくるか分からない調査タスクに適した分解方法はどれですか？","o":["途中で分かったことに応じて次のサブタスクを生成する動的分解","最初に決めた5ステップを必ず順番に実行するプロンプトチェイニング","すべての業界を均等に調べる網羅的な固定パイプライン","1回の大きなプロンプトで完結させる"],"a":[0],"e":"オープンエンドな調査では、各ステップの発見に基づいてサブタスクを作る適応的な計画が有効です。","w":["正解。発見に応じて計画を変えます。","固定パイプラインは予測できる作業向けです。","重要度の違いを無視し、非効率です。","注意が分散し、深掘りができません。"]},
{"id":"d1-29","t":"1.7","s":4,"q":"昨日の調査セッションを続けたいのですが、その後チームが対象コードの大部分をリファクタリングしました。信頼性とムダの少なさの両方から見て、最も適切な進め方はどれですか？","o":["昨日の主要な発見をまとめた構造化サマリーを注入して、新しいセッションを始める","昨日のセッションをそのまま --resume で再開し、何も伝えずに続ける","昨日のツール結果を信頼して、その上に作業を積み上げる","すべてを忘れてゼロから探索をやり直す"],"a":[0],"e":"前回のツール結果が古くなっている（stale）場合、要約を注入して新規に始める方が、古い結果を抱えたまま再開するより信頼できます。","w":["正解。古い結果を持ち込まず、知見だけを引き継ぎます。","古いツール結果に基づいて誤った判断をする恐れがあります。","コードが変わっているので結果は当てになりません。","新しく始める点は正解と同じですが、昨日得た知見（設計上の発見など）まですべて捨ててしまうため、ムダが大きくなります。"]},
{"id":"d1-30","t":"1.7","s":4,"q":"共通のコードベース分析をもとに、「段階的リファクタリング」と「一括書き換え」の2つのアプローチを並行して検討したいです。最も適した方法はどれですか？","o":["fork_session で共有の分析から2つの分岐を作る","同じセッション内で2つの案を交互に議論させる","2つの新しいセッションで、それぞれ分析からやり直す","--resume で同じセッションを2回開いて、別々に進める"],"a":[0],"e":"fork_session は共通の分析ベースラインから独立した分岐を作り、異なるアプローチを並行して探るための仕組みです。","w":["正解。分岐が互いに干渉しません。","2案の文脈が混ざり、比較がしにくくなります。","共通の分析をやり直すのはムダです。","同じセッションを再開するだけで分岐にはなりません。"]},
{"id":"d1-31","t":"1.7","s":2,"q":"名前付きセッション「auth-investigation」で認証まわりを調べていました。翌日、2つのファイルだけ修正してから調査を再開します。最も効率的な方法はどれですか？","o":["--resume auth-investigation で再開し、修正した2ファイルを具体的に伝えて、そこだけ再分析してもらう","--resume auth-investigation で再開し、変更の影響を見落とさないようコードベース全体を再探索させる","前回の文脈が混ざらないよう、新しいセッションを始めて認証まわりを最初から調査し直す","--resume auth-investigation で再開し、修正内容は伝えずにそのまま調査の続きを進める"],"a":[0],"e":"以前の文脈がほぼ有効なら再開が適切です。その際、変更されたファイルを伝えて対象を絞った再分析を依頼するのが効率的です。","w":["正解。再開＋変更点の通知が最適です。","全体の再探索は不要なコストです。","ほぼ有効な文脈を捨てるのはムダです。","変更を知らないと古い前提で回答してしまいます。"]},
{"id":"d1-32","t":"1.7","s":2,"q":"セッション管理についての説明として正しいものはどれですか？","o":["文脈がほぼ有効なら再開、結果が古ければ要約を注入して新規開始する","再開は文脈を引き継げるので、常に新規開始より信頼性が高い","fork_session は、以前のセッションの内容を上書きして作り直す","--resume は名前を指定できず、直前のセッションしか再開できない"],"a":[0],"e":"再開と新規開始の使い分けは「前回の文脈がまだ有効か」で決めます。--resume は名前付きセッションを指定して再開できます。","w":["正解。公式の判断基準です。","古いツール結果があると再開の方が危険なこともあります。","fork_session は独立した分岐を作ります。","名前を指定して特定のセッションを再開できます。"]}
];

// ===== 問題バンク（オリジナル。公式 Exam Guide v1.0 の出題目標に準拠）=====
const Q_D2 = [
{"id":"d2-01","t":"2.1","s":1,"q":"「注文 #A-5521 はいつ届きますか？」という問い合わせに対し、エージェントが lookup_order ではなく get_customer を呼ぶことが多いです。両ツールの説明はそれぞれ「顧客情報を取得します」「注文情報を取得します」の1行だけです。最初に取るべき対策はどれですか？","o":["各ツールの説明に、受け付ける入力形式・例となる質問・エッジケース・似たツールとの使い分けを書き足す","入力から注文番号らしきキーワードを検出し、事前にツールを選ぶルーティング層を作る","2つのツールを1つの lookup_entity ツールに統合し、内部で問い合わせ先を判定する","注文の問い合わせを lookup_order に回すFew-shot例を8個システムプロンプトに追加する"],"a":[0],"e":"ツールの説明は、LLMがツールを選ぶ主要な手がかりです。説明が最小限だと似たツールを区別できません。低コストで根本原因に効く「最初の一手」です。","w":["正解。根本原因（説明不足）に直接効きます。","LLMの言語理解を迂回する過剰な設計です。","有効な設計判断になり得ますが、「最初の一手」としては手間が大きすぎます。","トークンが増えるうえ、根本原因（説明不足）を直していません。"]},
{"id":"d2-02","t":"2.1","s":3,"q":"調査システムに analyze_content と analyze_document という、説明がほぼ同じ2つのツールがあり、Web検索結果の処理が誤って文書分析ツールに回されます。最も適切な対処はどれですか？","o":["analyze_content を extract_web_results のような名前に変え、説明もWeb専用に直す","両方のツールを削除し、Web結果も文書も扱える汎用の analyze ツールを1つだけ作り直す","analyze_document の方をツール一覧の先頭に並べ、優先的に選ばれるように順番を調整する","説明文はそのままにして、システムプロンプトに「Webの結果なら analyze_content を使う」と1行加える"],"a":[0],"e":"機能が重なるツールは、名前の変更と説明の更新で重なりを解消します。公式ガイドに同様の例があります。","w":["正解。名前と説明で役割を明確に分けます。","汎用化すると、かえって入出力の約束があいまいになります。","並び順はツール選択の根本的な解決になりません。","説明文が重なったままでは根本解決になりません。"]},
{"id":"d2-03","t":"2.1","s":3,"q":"文書分析サブエージェントの analyze_document ツールが、データ抽出・要約・事実確認のすべてを1つで担っており、出力形式が毎回バラバラです。推奨される改善はどれですか？","o":["extract_data_points / summarize_content / verify_claim_against_source に分割し、入出力を定める","analyze_document の説明をさらに短く簡潔にし、モデルが迷わず選べるようにする","出力の形をそろえるのはあきらめ、すべて自由形式の文章で返させて後続で読み取る","analyze_document に mode（extract / summarize / verify）パラメータを追加し、説明文は今のまま変えない"],"a":[0],"e":"汎用ツールを、入出力の約束が明確な目的別ツールに分割するのが公式の推奨です。","w":["正解。目的別に分けると選択も出力も安定します。","説明を短くすると選択の精度が下がります。","後続処理で扱いにくくなります。","説明を変えずにモードを増やすと、使い分けが伝わりません。"]},
{"id":"d2-04","t":"2.1","s":1,"q":"ツールの説明文はよく書けているのに、「アカウントで注文した商品はいつ届きますか？」のように「アカウント」という言葉を含む問い合わせでは、lookup_order ではなく get_customer が必ず呼ばれます。システムプロンプトには「『アカウント』という言葉が出たら get_customer を使うこと」と書かれています。何が起きていると考えられますか？","o":["システムプロンプトのキーワード指示がツール説明より優先され、誤った結び付きが生まれている","ツールの数が少なすぎて、get_customer しか選択肢に見えていない","tool_choice が \"any\" になっていて、get_customer が強制されている","ツールの説明文が長すぎて、モデルに最後まで読まれていない"],"a":[0],"e":"システムプロンプトのキーワード依存の指示は、よく書かれたツール説明を上書きしてしまうことがあります。ツール選択の問題では、システムプロンプトも見直します。","w":["正解。キーワード依存の指示が原因です。","ツールの数は今回の症状と関係ありません。","\"any\" はツールを使うことを強制するだけで、特定のツールに偏る原因ではありません。","説明文が詳しいこと自体は推奨される状態です。"]},
{"id":"d2-05","t":"2.1","s":4,"q":"ツールの説明文に含めるべき内容として、公式ガイドが挙げているものを2つ選んでください。","o":["受け付ける入力の形式と、例となる質問","似たツールと比べて、いつこのツールを使うべきかという境界","ツールを実装したエンジニアの名前","ツールの開発にかかった工数","ツールのソースコード全文"],"a":[0,1],"e":"入力形式・例となる質問・エッジケース・境界（似たツールとの使い分け）・出力を書くことで、ツール選択の信頼性が上がります。","w":["正解。","正解。","ツール選択には関係ありません。","ツール選択には関係ありません。","説明文には不要で、トークンのムダです。"]},
{"id":"d2-06","t":"2.2","s":1,"q":"process_refund ツールが、どんな失敗でも \"Operation failed\" とだけ返します。その結果、エージェントは返品期限切れのケースでも何度もリトライしてしまいます。最も適切な改善はどれですか？","o":["errorCategory・isRetryable・人が読める説明を含む構造化エラーを返す","エラーの内容はそのままにして、ムダな試行を減らすためにリトライ回数の上限を1回に下げる","エージェントが混乱しないよう、エラー時は空の成功レスポンスを返して処理を先へ進めさせる","\"Operation failed\" という英語のメッセージを、顧客に伝わりやすい日本語の文章に置き換える"],"a":[0],"e":"一様なエラー応答では、エージェントが適切な回復判断をできません。構造化メタデータを返すことで、ムダなリトライを防げます。","w":["正解。再試行の可否と種類が伝わります。","回数を減らしても、返品期限切れのような再試行が無意味なエラーで1回はムダにリトライし、原因も分からないままです。一時的なエラーからの回復の余地も狭まります。","失敗を成功として隠すのは最悪のアンチパターンです。","言語を変えても情報量は増えません。"]},
{"id":"d2-07","t":"2.2","s":1,"q":"「購入から30日を超えているため返品不可」という業務ルール違反をツールが検出しました。エージェントが顧客に適切に説明できるようにするには、どんなエラーを返すべきですか？","o":["isError を立て、retriable: false と顧客向けの説明を含める","タイムアウトとして返し、時間をおいてエージェントにリトライさせる","顧客を待たせないよう、エラーにはせず、返品処理が完了したと返しておく","原因が正確に伝わるよう、技術的なスタックトレースだけを返す"],"a":[0],"e":"ビジネスルール違反には、再試行不可のフラグと顧客向けの説明を含めることで、エージェントが適切にコミュニケーションできます。","w":["正解。","ムダなリトライを招き、誤った説明につながります。","虚偽の成功は重大な問題を引き起こします。","顧客に伝えられる情報になっていません。"]},
{"id":"d2-08","t":"2.2","s":3,"q":"文献検索ツールが「該当0件」を返したとき、それがタイムアウトによるものか、本当に該当がなかったのか、エージェントには区別できません。どう改善すべきですか？","o":["アクセス失敗と、該当なしの有効な空の結果を区別して返す","形式をそろえるため、どちらの場合も同じく空の配列だけを返す","取りこぼしを防ぐため、0件のときは必ずリトライさせる","処理を止めないよう、0件の場合はダミーデータを返しておく"],"a":[0],"e":"アクセス失敗はリトライの判断が必要、有効な空の結果は成功です。両者を区別して返すことが重要です。","w":["正解。","区別できず、誤った判断を招きます。","本当に0件の場合、リトライはムダです。","捏造データは信頼性を損ないます。"]},
{"id":"d2-09","t":"2.2","s":3,"q":"検索サブエージェントでネットワークの一時的なタイムアウトが発生しました。エラー処理の設計として最も適切なものはどれですか？","o":["まず内部で回復を試み、解決できないときだけ試行内容と部分結果を添えてコーディネーターへ伝える","不完全な結果を避けるため、タイムアウトが起きたら即座にワークフロー全体を停止する","すべてのエラーを即座にコーディネーターへ転送し、サブエージェントは何もしない","エラーはログに記録だけして、サブエージェントは空の結果を返して処理を続ける"],"a":[0],"e":"一時的な失敗はサブエージェント内でローカルに回復し、解決できないものだけを部分結果と試行内容とともに上位へ伝えます。","w":["正解。","単一の失敗で全体を止めるのはアンチパターンです。","コーディネーターの負荷が増え、簡単に回復できるものまで上げてしまいます。","失敗の握りつぶしはアンチパターンです。"]},
{"id":"d2-10","t":"2.2","s":1,"q":"MCPツールのエラー分類として、再試行する価値が「ある」ものはどれですか？","o":["外部サービスの一時的な停止（transient）","返品期限切れなどのポリシー違反（business）","アクセス権限がない（permission）","すでにキャンセル済みの注文への返金要求（business）"],"a":[0],"e":"一時的なエラー（タイムアウト、サービス停止）は時間をおけば成功する可能性があります。業務ルール違反や権限エラーは、同じ条件で再試行しても結果は変わりません。","w":["正解。","同じ条件では何度試しても違反のままです。","権限が変わらない限り成功しません。","状態が変わらない限り成功しません。"]},
{"id":"d2-11","t":"2.3","s":3,"q":"統合サブエージェントに18個のツールを与えたところ、ツールの選択ミスが増え、さらに勝手にWeb検索まで始めるようになりました。最も適切な改善はどれですか？","o":["統合係のツールを役割に必要なものだけに絞り、Web検索を外す","ツールの説明文を短くして、選びやすくする","tool_choice を \"any\" にして選択を安定させる","ツールをさらに増やして、選択肢の幅を広げる"],"a":[0],"e":"ツールが多すぎると判断が複雑になり選択の信頼性が下がります（18個より4〜5個）。専門外のツールは誤用されやすいので、役割に必要なものだけにします。","w":["正解。","説明を短くすると、選択はさらに不安定になります。","ツール使用を強制するだけで、選択ミスや誤用は減りません。","逆効果です。"]},
{"id":"d2-12","t":"2.3","s":3,"q":"統合サブエージェントは作業中に頻繁に事実確認が必要です。その85%は日付や名前などの簡単な確認、15%は深い調査が必要です。現在は毎回コーディネーター経由で検索係を呼ぶため、遅延が大きくなっています。最も効果的な方法はどれですか？","o":["簡単な確認用の verify_fact だけを与え、複雑な確認は従来どおりコーディネーター経由にする","統合係に検索係と同じWeb検索ツールをすべて与え、どんな確認も自分で直接できるようにする","確認事項をすべて溜めておき、統合の最後にまとめてコーディネーターへ返して一括で確認する","検索係に、統合係が確認しそうな情報をあらかじめ多めに集めさせ、最初の結果と一緒に渡しておく"],"a":[0],"e":"頻度の高い単純なケースだけに範囲を絞った越境ツールを与え、複雑なケースは既存の調整パターンを保つ。最小権限の原則に沿った解決策です。","w":["正解。","権限の与えすぎで、役割分担が崩れます。","後の統合ステップが先の確認結果に依存する場合、ブロッキングが発生します。","何が必要になるかを確実に予測することはできません。"]},
{"id":"d2-13","t":"2.3","s":6,"q":"抽出パイプラインで、どの文書タイプか分からない入力に対し、請求書用・契約書用・領収書用の3つの抽出ツールのどれかを必ず使わせたいです。Claude がテキストで返答してしまうことを防ぐ設定はどれですか？","o":["tool_choice: \"any\"","tool_choice: \"auto\"","tool_choice: {\"type\": \"tool\", \"name\": \"extract_invoice\"}","ツールを1つだけ渡す"],"a":[0],"e":"\"any\" はツールの呼び出しを保証しつつ、どのツールを使うかはモデルに選ばせます。文書タイプが不明な場合に最適です。","w":["正解。","\"auto\" ではテキストで答える可能性があります。","請求書以外の文書でも請求書用ツールが強制されてしまいます。","文書タイプに応じた使い分けができなくなります。"]},
{"id":"d2-14","t":"2.3","s":6,"q":"データの補完（エンリッチメント）ツールを使う前に、必ず extract_metadata を最初に実行させたいです。どの設定が適切ですか？","o":["最初は tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"} で強制し、残りは次のターンで処理する","tool_choice: \"auto\" のまま、システムプロンプトで「必ず最初に extract_metadata を呼ぶこと」と順番をお願いする","tool_choice: \"any\" を指定し、何らかのツールが必ず呼ばれる状態にしてから、残りの処理を続けさせる","extract_metadata 以外のツールをすべて削除し、メタデータ抽出しかできない構成にしてから処理を始める"],"a":[0],"e":"特定のツールを強制選択すると、そのツールが最初に必ず呼ばれます。その後のステップはフォローアップのターンで処理します。","w":["正解。","\"auto\" とお願いでは順序が保証されません。","どのツールが呼ばれるかはモデル次第です。","後続のエンリッチメントができなくなります。"]},
{"id":"d2-15","t":"2.3","s":3,"q":"文書を読み込むサブエージェントが汎用の fetch_url ツールを使って、関係のないサイトまで取得してしまいます。推奨される改善はどれですか？","o":["文書URLかを検証する load_document のような制約付きツールに置き換える","fetch_url の説明文に「調査と関係ないサイトは取得しないこと」と書き足す","fetch_url はそのまま残し、1回の調査での取得件数に上限を設ける","サブエージェントのシステムプロンプトを長くして、方針を詳しく伝える"],"a":[0],"e":"汎用ツールを制約付きの代替ツールに置き換えるのが公式の推奨です。例として fetch_url → 文書URLを検証する load_document が挙げられています。","w":["正解。","お願いは確率的で、汎用ツールのままでは誤用の余地が残ります。","件数を制限しても、関係のないサイトの取得は防げません。","根本的な解決になりません。"]},
{"id":"d2-16","t":"2.4","s":4,"q":"チーム全員で使う GitHub 連携のMCPサーバーを設定します。アクセストークンをリポジトリにコミットせずに共有したいです。最も適切な方法はどれですか？","o":["プロジェクトの .mcp.json に設定し、トークンは ${GITHUB_TOKEN} で参照する","各自の ~/.claude.json に、それぞれが自分でトークンを直接書いて設定する",".mcp.json にトークンを直接書いてコミットし、代わりにリポジトリを非公開にして守る","設定の場所を1つにまとめるため、トークンをプロジェクトの CLAUDE.md に書く"],"a":[0],"e":"共有のMCPサーバーはプロジェクトスコープの .mcp.json に置き、認証情報は環境変数展開で扱うのが公式の推奨です。","w":["正解。","チームで共有されず、設定が人によってバラバラになります。","秘密情報をコミットするのは危険です。","CLAUDE.md はプロジェクトの指示用で、秘密情報の置き場所ではありません。"]},
{"id":"d2-17","t":"2.4","s":4,"q":"自分だけで試している実験的なMCPサーバーがあります。チームメイトの環境には影響させたくありません。どこに設定しますか？","o":["ユーザースコープの ~/.claude.json","プロジェクトの .mcp.json","プロジェクトルートの CLAUDE.md","リポジトリの .claude/commands/"],"a":[0],"e":"個人用・実験用のMCPサーバーはユーザースコープの ~/.claude.json に設定します。","w":["正解。","バージョン管理でチームに共有されてしまいます。","CLAUDE.md はMCPサーバーの設定場所ではありません。","スラッシュコマンドの置き場所です。"]},
{"id":"d2-18","t":"2.4","s":4,"q":"社内の課題管理用MCPツールを用意したのに、エージェントは組み込みの Grep でファイルを検索してばかりで、MCPツールを使いません。最も効果的な対策はどれですか？","o":["MCPツールの説明に、できることと返す内容を詳しく書く","Grep ツールを無効化して、MCPツールしか選べないようにする","MCPサーバーを再起動して、ツールを読み込み直させる","システムプロンプトで「なるべくMCPツールを使って」とお願いする"],"a":[0],"e":"MCPツールの能力と出力を詳しく説明すると、エージェントが組み込みツールを優先してしまう問題を防げます。","w":["正解。","Grep が本当に適した場面まで使えなくなります。","再起動では説明不足は解決しません。","あいまいなお願いより、説明文の改善が根本対策です。"]},
{"id":"d2-19","t":"2.4","s":4,"q":"チームで Jira と連携したいと考えています。公式ガイドの考え方に沿った進め方はどれですか？","o":["まず既存のコミュニティMCPサーバーを検討し、自作は固有の用途に限る","セキュリティを優先し、Jira 連携のMCPサーバーは必ず一から自作する","MCPは使わず、Jira のAPIを Bash で直接呼ぶスクリプトを書く","Jira の課題の内容を毎日コピーして、CLAUDE.md に貼り付けておく"],"a":[0],"e":"標準的な連携には既存のコミュニティMCPサーバーを選び、カスタム実装はチーム固有のワークフローのためにとっておくのが推奨です。","w":["正解。","標準的な連携を自作するのは手間がかかります。","MCPの利点（ツールとしての発見・説明）を活かせません。","情報がすぐ古くなり、コンテキストも浪費します。"]},
{"id":"d2-20","t":"2.4","s":4,"q":"エージェントがデータベースのテーブル構成を知るために、毎回何度も探索的なツール呼び出しをしています。この探索を減らすのに有効な方法はどれですか？","o":["DBスキーマなどを MCPリソースとして公開する","探索用のツールを増やして、効率よく調べさせる","ツールの呼び出し回数に上限を設けて抑える","システムプロンプトに「探索は最小限に」と書く"],"a":[0],"e":"MCPリソースはコンテンツカタログ（課題の概要、ドキュメント階層、DBスキーマなど）を公開し、探索的なツール呼び出しなしに「何があるか」を見せられます。","w":["正解。","探索がさらに増える可能性があります。","必要な探索まで止めてしまいます。","情報がないまま推測させることになります。"]},
{"id":"d2-21","t":"2.4","s":4,"q":"プロジェクトの .mcp.json にMCPサーバーAを、個人の ~/.claude.json にMCPサーバーBを設定しました。ツールの利用についての説明として正しいものはどれですか？","o":["すべての設定済みサーバーのツールが接続時に発見され、AとBのツールを同時に使える","プロジェクト側の設定が優先され、Bのツールは使えない","同時には使えないため、作業のたびにどちらか一方のサーバーを選んで切り替える必要がある","Bのツールは Claude Code を再インストールしないと使えない"],"a":[0],"e":"設定されたすべてのMCPサーバーのツールは接続時に発見され、エージェントから同時に利用できます。","w":["正解。","両方が同時に利用可能です。","切り替えは不要です。","そのような要件はありません。"]},
{"id":"d2-22","t":"2.5","s":4,"q":"コードベースの中から processPayment 関数を呼び出しているすべての箇所を見つけたいです。最も適したツールはどれですか？","o":["Grep","Glob","Write","Edit"],"a":[0],"e":"ファイルの中身をパターンで検索するのは Grep です（関数の呼び出し元、エラーメッセージ、import文など）。","w":["正解。","Glob はファイル名・パスのパターン検索です。","Write はファイルの書き込みです。","Edit は既存ファイルの部分修正です。"]},
{"id":"d2-23","t":"2.5","s":4,"q":"リポジトリ全体から、テストファイル（名前が .test.tsx で終わるもの）をすべて一覧にしたいです。最も適したツールはどれですか？","o":["Glob（**/*.test.tsx）","Grep で \"test\" という文字列を検索","Read ですべてのファイルを開く","Bash で全ファイルの中身を表示"],"a":[0],"e":"ファイル名や拡張子のパターンでファイルを探すのは Glob です。","w":["正解。","中身の検索なので、テストファイル以外も大量にヒットします。","非効率でコンテキストを浪費します。","非効率でコンテキストを浪費します。"]},
{"id":"d2-24","t":"2.5","s":4,"q":"設定ファイルのうち、database セクションにある \"timeout: 30\" だけを \"timeout: 60\" に変えたいのですが、同じ文字列がファイル内に3か所あり、Edit が一意な目印を見つけられず失敗しました。公式ガイドで推奨されている確実な代替手段はどれですか？","o":["Read で読み込み、修正した全体を Write で書く","Glob で同じ設定を持つ別のファイルを探して確認する","成功するまで Edit を同じ引数で何度も試す","Grep で3か所の場所を確認して終わりにする"],"a":[0],"e":"Edit はユニークな文字列を目印にするため、一致が複数あると失敗します。その場合は Read＋Write が確実な代替手段です。","w":["正解。","目的のファイルの修正になりません。","何度試しても一意でない点は変わりません。","検索しただけでは修正できません。"]},
{"id":"d2-25","t":"2.5","s":4,"q":"見知らぬ大規模コードベースで、注文処理の流れを理解したいです。最も効率的な進め方はどれですか？","o":["Grep で入口を見つけ、Read で import をたどって追う","全体像をつかむため、まずすべてのファイルを Read で読み込む","Glob でファイル名を一覧にし、名前から処理の流れを推測する","先に Write で調査メモのひな形を作ってから考え始める"],"a":[0],"e":"Grep でエントリーポイントを見つけ、Read で import をたどって流れを追う、という段階的な理解が推奨されます。最初から全部読むのは非効率です。","w":["正解。","コンテキストを大量に消費し、劣化も招きます。","名前だけでは処理の流れは分かりません。","情報を集める前にメモを作っても意味がありません。"]},
{"id":"d2-26","t":"2.5","s":4,"q":"formatDate 関数が utils/index.ts で別名を付けて再エクスポートされており、Grep で \"formatDate\" を検索しても一部の呼び出し元が見つかりません。どう調べるべきですか？","o":["エクスポートされている名前をすべて特定し、それぞれで全体を検索する","Glob で formatDate という名前のファイルを探して、そこから使用箇所を推測する","Grep で見つかった呼び出し元だけで十分と判断し、調査を終える","漏れがないよう、リポジトリのすべてのファイルを Read で読み込む"],"a":[0],"e":"ラッパーモジュール越しに関数の使われ方を追うときは、エクスポートされた名前をすべて洗い出し、それぞれの名前で検索します。","w":["正解。","ファイル名検索では呼び出し元は見つかりません。","別名での呼び出しを見逃します。","非効率で、コンテキストを浪費します。"]}
];

{"id":"d3-01","t":"3.1","s":2,"q":"先週チームに加わったメンバーだけ、Claude Code がチームのコーディング規約に従いません。他のメンバーは問題なく動いています。最も可能性の高い原因はどれですか？","o":["規約が既存メンバーの ~/.claude/CLAUDE.md（ユーザー階層）に書かれている","新メンバーの Claude Code のバージョンが新しすぎて、規約の書式を読めていない","新メンバーがプランモードを使っておらず、規約を確認する手順が省かれている","規約がディレクトリ階層の CLAUDE.md に書かれていて、新メンバーには届いていない"],"a":[0],"e":"~/.claude/CLAUDE.md の内容はそのユーザーにだけ適用され、バージョン管理でチームに共有されません。典型的な階層の問題です。","w":["正解。","バージョンは今回の症状の直接の原因として考えにくいです。","プランモードは規約の読み込みと関係ありません。","ディレクトリ階層ならリポジトリで共有されるため、新メンバーにも適用されます。"]},
{"id":"d3-02","t":"3.1","s":2,"q":"モノレポの各パッケージで、関係する規約だけを読み込ませたいです。パッケージAはAPI規約とテスト規約、パッケージBはUI規約だけが必要です。推奨される方法はどれですか？","o":["各パッケージの CLAUDE.md で @import を使い、必要な規約だけ取り込む","迷わないよう、すべての規約をルートの CLAUDE.md に1つにまとめる","各開発者の ~/.claude/CLAUDE.md に必要な規約を書いてもらう","作業のたびに、必要な規約をプロンプトに貼り付けて渡す"],"a":[0],"e":"@import 構文で外部ファイルを参照すると、CLAUDE.md をモジュール化し、パッケージごとに関係する規約だけを取り込めます。","w":["正解。","無関係な規約まで読み込まれ、コンテキストを浪費します。","チームで共有されません。","手作業でミスが起きやすく、非効率です。"]},
{"id":"d3-03","t":"3.1","s":2,"q":"ルートの CLAUDE.md が1,500行を超え、メンテナンスが大変になっています。テスト・API・デプロイの規約が混在しています。推奨される整理方法はどれですか？","o":[".claude/rules/ に testing.md などテーマ別のファイルとして分割する","重要度の低い項目から削っていき、CLAUDE.md の内容を半分程度に減らす","リポジトリを軽くするため、内容をすべて ~/.claude/CLAUDE.md に移して管理する","1つのファイルのまま、テスト・API・デプロイごとに見出しを増やして整理する"],"a":[0],"e":".claude/rules/ ディレクトリでテーマ別のルールファイルに整理するのが、巨大な CLAUDE.md の代替として推奨されています。","w":["正解。","必要な規約まで失われる可能性があります。","チームに共有されなくなります。","見出しは整っても、1,500行を超える1つのファイルのままなので、メンテナンスの大変さは解消しません。"]},
{"id":"d3-04","t":"3.1","s":2,"q":"同じリポジトリなのに、セッションによって Claude Code の振る舞いが違います。どのメモリファイルが読み込まれているかを確認したいです。どうしますか？","o":["/memory で読み込まれているファイルを確認する","/compact コマンドで会話を圧縮する","Claude Code を再インストールする","プランモードに入って、設定ファイルの中身を調べる"],"a":[0],"e":"/memory コマンドで、どのメモリファイルが読み込まれているかを確認し、セッション間の振る舞いの違いを診断できます。","w":["正解。","/compact はコンテキストの圧縮用です。","原因を特定せずに再インストールしても解決しない可能性があります。","プランモードは設定の確認手段ではありません。"]},
{"id":"d3-05","t":"3.1","s":2,"q":"CLAUDE.md の階層について、正しい説明を2つ選んでください。","o":["~/.claude/CLAUDE.md はユーザー階層で、その人にだけ適用される","プロジェクト階層は .claude/CLAUDE.md またはルートの CLAUDE.md に置く","~/.claude/CLAUDE.md はバージョン管理でチームに自動共有される","サブディレクトリに CLAUDE.md を置くことはできない","CLAUDE.md はスキルと同じく、呼び出したときだけ読み込まれる"],"a":[0,1],"e":"階層はユーザー（~/.claude/CLAUDE.md）・プロジェクト（.claude/CLAUDE.md またはルート）・ディレクトリ（サブディレクトリの CLAUDE.md）の3つです。","w":["正解。","正解。","ユーザー階層は共有されません。","ディレクトリ階層として置けます。","CLAUDE.md は呼び出さなくても自動で読み込まれる規約です。スキルのように手動で呼び出すものではありません。"]},
{"id":"d3-06","t":"3.2","s":2,"q":"チームのセキュリティチェックリストを実行する /security-check コマンドを作ります。リポジトリを clone した全員が使えるようにするには、どこに置きますか？","o":["リポジトリ内の .claude/commands/","各開発者の ~/.claude/commands/","プロジェクトの CLAUDE.md",".claude/config.json の commands 配列"],"a":[0],"e":"プロジェクトスコープのスラッシュコマンドは .claude/commands/ に置き、バージョン管理で全員に共有されます。","w":["正解。","個人用で、共有されません。","CLAUDE.md は指示や文脈用で、コマンド定義の場所ではありません。","そのような設定の仕組みはありません。"]},
{"id":"d3-07","t":"3.2","s":2,"q":"コードベース全体を分析するスキルを実行すると、大量の出力でメインの会話が埋め尽くされ、その後の作業に支障が出ます。どう設定すべきですか？","o":["SKILL.md のフロントマターに context: fork を設定して隔離実行する","SKILL.md のフロントマターに argument-hint を設定し、分析対象を絞らせる","スキルの内容を CLAUDE.md に統合し、いつでも参照できるようにする","スキルの手順に「出力はできるだけ少なくすること」と書き加えてお願いする"],"a":[0],"e":"context: fork はスキルを隔離されたサブエージェントの文脈で実行し、スキルの出力がメインの会話を汚染するのを防ぎます。","w":["正解。","引数の案内用で、出力の隔離とは無関係です。","常に読み込まれ、コンテキストがさらに圧迫されます。","根本的な隔離にはなりません。"]},
{"id":"d3-08","t":"3.2","s":2,"q":"ドキュメント生成スキルが、誤ってファイルを削除するコマンドを実行してしまう危険があります。スキル実行中に使えるツールを制限するには、どのフロントマターを使いますか？","o":["allowed-tools","context: fork","argument-hint","paths"],"a":[0],"e":"allowed-tools はスキル実行中のツールアクセスを制限し、破壊的な操作を防ぎます。","w":["正解。","文脈の隔離用で、ツールの制限ではありません。","引数の案内用です。","公式ガイドでは、paths は .claude/rules/ のパス指定ルールで使う項目として説明されています。ツールの制限ではありません。"]},
{"id":"d3-09","t":"3.2","s":2,"q":"/migrate スキルは対象のテーブル名が必須ですが、引数なしで呼び出されることがよくあります。必要なパラメータの入力を促すには、どのフロントマターを使いますか？","o":["argument-hint","allowed-tools","context: fork","paths"],"a":[0],"e":"argument-hint は、引数なしでスキルが呼ばれたときに必要なパラメータを開発者に促します。","w":["正解。","ツールの制限用です。","文脈の隔離用です。","公式ガイドでは、paths は .claude/rules/ のルールを条件付きで読み込むための項目です。引数の案内ではありません。"]},
{"id":"d3-10","t":"3.2","s":2,"q":"チームの共有スキル /review を、自分好みの観点で使いたくなりました。チームメイトに影響を与えない方法はどれですか？","o":["~/.claude/skills/ に別の名前で個人用のバリエーションを作る",".claude/skills/ の /review を直接書き換えてコミットする","チームの .claude/commands/ に同じ名前の /review コマンドを追加してコミットする","CLAUDE.md に自分用の観点を追記してコミットする"],"a":[0],"e":"個人用のカスタマイズは、~/.claude/skills/ に異なる名前で個人版を作ると、チームメイトに影響しません。","w":["正解。","チーム全員の動作が変わってしまいます。","リポジトリに入るので、チーム全員の /review の動きが変わってしまいます。","チーム全員に読み込まれてしまいます。"]},
{"id":"d3-11","t":"3.2","s":2,"q":"「エラーハンドリングは必ず独自の AppError クラスを使う」というルールと、「月1回のリリースノート作成手順」があります。それぞれの置き場所として最も適切な組み合わせはどれですか？","o":["エラーハンドリングのルールは CLAUDE.md、リリースノート作成手順はスキル","両方とも CLAUDE.md","両方ともスキル","エラーハンドリングのルールはスキル、リリースノート作成手順は CLAUDE.md"],"a":[0],"e":"CLAUDE.md は常に読み込まれる普遍的な規約、スキルは必要なときに呼び出す特定作業の手順、と使い分けます。","w":["正解。","月1回の手順が常に読み込まれ、コンテキストのムダになります。","常に守るべきルールが、呼び出さない限り適用されません。","役割が逆です。"]},
{"id":"d3-12","t":"3.3","s":2,"q":"テストファイル（Button.test.tsx など）が、それぞれのコンポーネントの隣にリポジトリ全体に散らばっています。すべてのテストに同じ規約を自動適用したいです。最も保守しやすい方法はどれですか？","o":[".claude/rules/ に paths: [\"**/*.test.tsx\"] のルールを作る","テストファイルがある各ディレクトリに、同じ内容の CLAUDE.md を置く","ルートの CLAUDE.md に「テストのときはこの規約」と見出しを付けて書く","テスト規約のスキルを作り、テストを書くたびに開発者がそのスキルを呼び出す"],"a":[0],"e":"glob パターンのパス指定ルールなら、ディレクトリに関係なく種類でファイルを指定でき、散らばったテストファイルに最適です。","w":["正解。","ディレクトリに縛られ、保守が大変です。","推測に頼るため信頼性が低く、無関係な場面でも読み込まれます。","手動で呼び出す必要があり、「自動適用」になりません。"]},
{"id":"d3-13","t":"3.3","s":2,"q":"Terraform の規約は terraform/ 配下のファイルを編集するときだけ読み込ませたいです。正しい設定はどれですか？","o":[".claude/rules/terraform.md の YAML フロントマターに paths: [\"terraform/**/*\"] を書く","ルートの CLAUDE.md の先頭に Terraform 規約を書き、「terraform/ を編集するときだけ守ること」と注記する","Terraform を担当するメンバーの ~/.claude/CLAUDE.md に、それぞれ Terraform 規約を書いてもらう",".claude/commands/terraform.md を作り、Terraform を編集するときにコマンドとして呼び出す"],"a":[0],"e":".claude/rules/ のファイルに YAML フロントマターの paths でglobを指定すると、一致するファイルを編集するときだけルールが読み込まれます。","w":["正解。","常に読み込まれてしまいます。","個人用で、しかも常に読み込まれます。","スラッシュコマンドは手動で呼び出すもので、terraform/ を編集するときに自動で読み込まれる仕組みではありません。"]},
{"id":"d3-14","t":"3.3","s":2,"q":"パス指定ルールを使う利点として正しいものを2つ選んでください。","o":["一致するファイルを編集するときだけ読み込まれ、無関係なコンテキストとトークン消費を減らせる","複数のディレクトリにまたがる規約を、ファイルの種類で指定できる","ルールが常にすべてのセッションで読み込まれるようになる","ルールが個人だけに適用され、チームに影響しない","スキルのように手動で呼び出せる"],"a":[0,1],"e":"パス指定ルールは条件付きで読み込まれるため、トークンを節約でき、globで場所に関係なく種類で指定できます。","w":["正解。","正解。","常時ではなく条件付きで読み込まれます。",".claude/rules/ はプロジェクトで共有されます。","自動で適用されるもので、手動呼び出しではありません。"]},
{"id":"d3-15","t":"3.4","s":2,"q":"使用中のHTTPクライアントライブラリを別のものに移行する作業で、影響は50ファイル以上に及びます。最も適切な進め方はどれですか？","o":["プランモードで計画を立て、その計画に沿って直接実行で実装する","最初から直接実行で1ファイルずつ書き換え、問題が出たら考える","直接実行で、50以上のファイルをすべて一度に置換させる","リスクを避けるため、移行は手作業だけで少しずつ行う"],"a":[0],"e":"公式ガイドの例（45ファイル以上に影響するライブラリ移行）のように、大規模な変更はプランモード向きです。計画をプランモードで立て、実装を直接実行で行う組み合わせが推奨されています。","w":["正解。","依存関係が後から判明し、手戻りの危険があります。","検証なしの一括変更は危険です。","Claude Code の活用を放棄しています。"]},
{"id":"d3-16","t":"3.4","s":2,"q":"スタックトレースから原因が明確な、1ファイル内のnull参照バグを修正します。適切なモードはどれですか？","o":["直接実行","プランモード","Explore サブエージェントで全体を調査してからプランモード","fork_session で2案を比較する"],"a":[0],"e":"範囲が明確な、よく理解された変更（スタックトレースが明確な単一ファイルのバグ修正など）は直接実行が適切です。","w":["正解。","単純な修正には過剰です。","過剰です。","比較すべき複数案がありません。"]},
{"id":"d3-17","t":"3.4","s":2,"q":"既存システムに通知機能を追加します。メールキューを使う方式とWebhookを使う方式があり、必要なインフラが異なります。どう進めるべきですか？","o":["プランモードで調べ、両方式を比較してから方針を決める","直接実行で、とりあえずメールキュー方式から実装を始める","直接実行で、両方の方式を同時に実装してから比べる","Claude に任せて、どちらかの方式を自動で選んで実装させる"],"a":[0],"e":"インフラ要件が異なる連携方式の選択のように、複数の妥当なアプローチや設計判断がある作業はプランモード向きです。","w":["正解。","後で方針転換すると手戻りが大きくなります。","ムダが多く、判断の先送りです。","設計判断なしの実装は手戻りのもとです。"]},
{"id":"d3-18","t":"3.4","s":4,"q":"複数フェーズにわたる大きな作業の途中で、調査の出力が多すぎてメインのコンテキストが尽きそうです。どう対処しますか？","o":["調査を Explore サブエージェントに任せ、要約だけ受け取る","調査結果を失わないよう、すべてメインの会話に貼り付け続ける","コンテキストを節約するため、調査を省略してすぐ実装に移る","プランモードと直接実行を切り替えて、作業を続ける"],"a":[0],"e":"Explore サブエージェントは冗長な調査出力を隔離し、要約を返すことでメイン会話のコンテキストを守ります。","w":["正解。","コンテキストがさらに枯渇します。","根拠のない実装は手戻りのもとです。","モードを切り替えても、調査出力の量は減りません。"]},
{"id":"d3-19","t":"3.5","s":2,"q":"日付文字列を統一形式に変換する関数を書かせています。言葉で詳しく説明しても、毎回解釈が微妙に違う結果になります。最も効果的な方法はどれですか？","o":["入力と期待する出力の具体例を2〜3個示す","説明文をさらに長く、詳しく書き直す","「正確に」「注意深く」と強調して伝える","うまくいくまで、毎回別のセッションで試す"],"a":[0],"e":"自然言語の説明が一貫して解釈されないとき、具体的な入出力例が期待する変換を伝える最も効果的な方法です。","w":["正解。","長くしても解釈のブレは残ります。","あいまいな強調は効果が薄いです。","解釈のブレは解決しません。"]},
{"id":"d3-20","t":"3.5","s":2,"q":"不慣れなキャッシュ層を設計します。考慮漏れがないか心配です。実装前に取るべきアプローチとして最も適切なものはどれですか？","o":["インタビューパターンで質問させ、論点を洗い出してから実装する","考えるより試す方が早いので、すぐに実装させて問題が出てから直す","一般的なキャッシュの実装例を探してきて、そのままコピーして使う","まず実装させ、実装が終わってからテストを書いて論点を確認する"],"a":[0],"e":"インタビューパターンは、実装前に Claude に質問させて、開発者が想定していなかった論点を浮かび上がらせる手法です。","w":["正解。","手戻りのリスクが高くなります。","要件に合わない可能性があります。","実装後に論点に気づいても手戻りが大きくなります。設問は実装前に考慮漏れを防ぐ方法を問うています。"]},
{"id":"d3-21","t":"3.5","s":2,"q":"データ移行スクリプトが null 値を含む行で失敗します。修正を依頼するときに最も効果的な伝え方はどれですか？","o":["null を含む入力例と期待する出力をテストケースで示す","「null の扱いを改善して」とだけ伝える","スクリプトを一から書き直して、null に強い作りにさせる","エラーログは見せずに、もう一度実行させる"],"a":[0],"e":"エッジケース（移行スクリプトの null 値など）の修正には、具体的な入力例と期待出力を示すテストケースが効果的です。","w":["正解。","何が正しいかが伝わりません。","過剰です。","情報がなければ修正できません。"]},
{"id":"d3-22","t":"3.5","s":2,"q":"認証処理に2つの不具合があり、一方を直すともう一方の挙動が変わることが分かっています。どう依頼すべきですか？","o":["両方を1つの詳しいメッセージでまとめて伝える","1つずつ別々のメッセージで修正を依頼する","影響の大きい方の不具合だけを直してもらう","不具合ごとに別々のセッションで修正する"],"a":[0],"e":"修正が相互作用する複数の問題は1つの詳しいメッセージでまとめて扱い、独立した問題は順番に直します。","w":["正解。","片方を直すと、もう片方が壊れる可能性があります。","残りの問題が放置されます。","相互作用が考慮されません。"]},
{"id":"d3-23","t":"3.5","s":2,"q":"新しい料金計算モジュールを作ります。期待する動作・エッジケース・性能要件が決まっています。テスト駆動の反復として最も適切な進め方はどれですか？","o":["先にテストを書き、失敗結果を共有しながら改善する","実装を先に完成させ、最後にテストを1つだけ書く","テストは書かず、出力を目視で確認して直す","性能要件だけをテストし、他は目視で確認する"],"a":[0],"e":"テスト駆動の反復では、期待動作・エッジケース・性能要件をカバーするテストを先に書き、テストの失敗を共有して段階的に改善します。","w":["正解。","反復改善の材料になりません。","客観的な基準がありません。","期待動作やエッジケースが漏れます。"]},
{"id":"d3-24","t":"3.6","s":5,"q":"パイプラインで claude \"このPRの問題点を指摘して\" を実行すると、ジョブが止まったまま終わりません。ログには入力待ちと出ています。正しい対処はどれですか？","o":["-p フラグを付けて非対話モードで実行する（claude -p \"...\"）","環境変数 CLAUDE_HEADLESS=true を設定してから実行する","標準入力を /dev/null からリダイレクトして実行する","--batch フラグを付けて、バッチとして実行する"],"a":[0],"e":"-p（--print）フラグは Claude Code を非対話モードで実行する公式の方法です。プロンプトを処理して結果を出力し、入力を待たずに終了します。","w":["正解。","そのような環境変数の仕組みはありません。","Unixの回避策で、Claude Code の正しい使い方ではありません。","そのようなフラグはありません。"]},
{"id":"d3-25","t":"3.6","s":5,"q":"CIでのレビュー結果を、PRのインラインコメントとして自動投稿したいです。機械で確実に処理できる出力を得るにはどうしますか？","o":["--output-format json と --json-schema で出力させる","出力をMarkdownの表にさせて、正規表現で解析する","人が読みやすい自由形式の文章で出力させて投稿する","レビュー結果の画面をスクリーンショットで保存して、PRに添付する"],"a":[0],"e":"--output-format json と --json-schema を組み合わせると、機械で解析できる構造化された結果が得られます。","w":["正解。","形式が崩れたときに解析が壊れやすくなります。","機械処理に向きません。","機械処理できません。"]},
{"id":"d3-26","t":"3.6","s":5,"q":"新しいコミットが追加されるたびにレビューを再実行すると、すでに指摘済みの内容が重複してコメントされます。既存コメントでのやり取りは残したまま重複をなくすには、どう改善しますか？","o":["前回の指摘を渡し、新規と未対応の問題だけを報告させる","毎回コメントをすべて削除してから、全指摘を投稿し直す","重複を避けるため、2回目以降のレビューを行わない","同じ指摘にならないよう、レビューの観点を毎回変える"],"a":[0],"e":"再レビュー時に以前の指摘を文脈に含め、新規または未対応の問題だけを報告させると、重複コメントを防げます。","w":["正解。","重複は消えますが、既存コメントでのやり取りや対応状況の履歴が失われ、通知も増えます。","新しいコミットの問題を見逃します。","一貫性がなくなります。"]},
{"id":"d3-27","t":"3.6","s":5,"q":"CIでのテスト自動生成で、すでにテストスイートにあるケースと重複したテストや、価値の低いテストが多く提案されます。改善策として正しいものを2つ選んでください。","o":["既存のテストファイルを文脈に含め、すでにカバーされているシナリオを把握させる","CLAUDE.md にテスト基準、価値あるテストの条件、利用できるフィクスチャを書いておく","生成するテストの数を増やす","テスト生成を同じ会話で何度も繰り返す","テスト生成を Message Batches API でプレマージチェックとして実行する"],"a":[0,1],"e":"既存テストを文脈に含めると重複が減り、CLAUDE.md にテスト基準やフィクスチャを書くと質が上がります。","w":["正解。","正解。","量を増やしても質は上がりません。","重複は減りません。","バッチは待てない処理（プレマージ）には不向きで、重複の解決にもなりません。"]},
{"id":"d3-28","t":"3.6","s":5,"q":"CIで、コードを生成したのと同じ Claude セッションに、そのままレビューもさせています。見落としが多いのはなぜですか？","o":["生成時の推論が残り、自分の判断を疑いにくいから。独立したインスタンスの方が効果的","セッションが長くなると、自動的にレビュー機能が無効になる","CIでのレビューは、必ず Message Batches API で行う必要がある","CLAUDE.md がCIでは読み込まれず、レビュー基準が伝わらない"],"a":[0],"e":"コードを生成した同じセッションは、自分の変更をレビューする効果が下がります。独立したレビューインスタンスを使いましょう。","w":["正解。","そのような仕組みはありません。","そのような要件はありません。","CLAUDE.md はCIで呼ばれた Claude Code にも文脈を提供する仕組みです。"]}
];
