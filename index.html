const Q_D4 = [
{"id":"d4-01","t":"4.1","s":5,"q":"自動レビューで「コメントが正確か確認して」と指示したところ、ささいな言い回しまで大量に指摘され、開発者が困っています。最も効果的な指示の改善はどれですか？","o":["「コメントの説明が実際の動作と矛盾する場合だけ指摘する」と基準を示す","「確信度の高い指摘だけを報告すること」とプロンプトに追記する","「慎重に、控えめに指摘すること」とプロンプトに追記する","重要なものだけが残るよう、指摘の件数を最大5件までに制限する"],"a":[0],"e":"あいまいな指示より、具体的な基準の方が精度を上げます。「慎重に」「確信度の高いものだけ」のような一般的な指示は、精度改善に効きにくいとされています。","w":["正解。","確信度ベースのフィルタリングは、具体的なカテゴリ基準ほど効果がありません。","一般的な指示は精度を上げません。","重要な指摘が切り捨てられる可能性があります。"]},
{"id":"d4-02","t":"4.1","s":5,"q":"レビューで「スタイル」カテゴリの誤検知が非常に多く、開発者がセキュリティの指摘まで無視し始めました。短期的に取るべき対策として最も適切なものはどれですか？","o":["誤検知の多いスタイルを一時的に止め、その間にプロンプトを改善する","信頼を取り戻すまで、すべてのカテゴリの指摘をいったん止める","開発者に、自動レビューの指摘はすべて確認するよう指導し直す","見落とされないよう、スタイルの指摘を「重大」に格上げして目立たせる"],"a":[0],"e":"誤検知の多いカテゴリは、正確なカテゴリへの信頼まで損ないます。一時的に無効化して信頼を取り戻し、並行してプロンプトを改善するのが推奨です。","w":["正解。","有用なセキュリティの指摘まで失われます。","システムの問題を人に押し付けています。","誤検知がさらに目立ち、信頼が悪化します。"]},
{"id":"d4-03","t":"4.1","s":5,"q":"重大度（Critical / Major / Minor）の分類が、レビューのたびにばらつきます。分類を安定させる最も効果的な方法はどれですか？","o":["各重大度の基準を、具体的なコード例とともに明示的に定義する","プロンプトに「重大度は慎重に、よく考えて判断して」と指示する","重大度の数を5段階に増やして、より細かく分けられるようにする","出力後に、重大度だけを別のプロンプトでもう一度付け直させる"],"a":[0],"e":"各重大度レベルに具体的なコード例をつけた明確な基準を定義すると、一貫した分類ができます。","w":["正解。","あいまいな指示では分類は安定しません。","段階を増やしても、各段階の基準があいまいなら分類は安定しません。","基準があいまいなままでは、付け直してもばらつきは残ります。"]},
{"id":"d4-04","t":"4.1","s":5,"q":"CIのレビュープロンプトに含める基準として、公式ガイドの考え方に最も合っているものはどれですか？","o":["バグとセキュリティは報告し、軽微なスタイルはスキップすると書く","見つけたものはすべて報告し、取捨選択は開発者に任せると書く","モデル自身が自信を持てる指摘だけを報告するよう書く","漏れがないよう、ファイルごとに報告件数のノルマを決めて書く"],"a":[0],"e":"何を報告し、何をスキップするかを定義する具体的なレビュー基準を書くことが推奨されています。","w":["正解。","誤検知が増えて信頼が損なわれます。","確信度ベースのフィルタは精度改善に効きにくいです。","無理な指摘を生み、誤検知を増やします。"]},
{"id":"d4-05","t":"4.2","s":5,"q":"レビュー結果の書式が毎回違い、「場所・問題・重大度・修正案」がそろっていないことがあります。詳しい書式の説明はすでにプロンプトにあります。最も効果的な追加策はどれですか？","o":["望ましい書式のお手本を2〜4個プロンプトに含める","書式の説明をさらに詳しく、箇条書きで書き直す","出力されたあとで、人手で書式を整えて投稿する","そろいやすいよう、書式の項目を2つに減らす"],"a":[0],"e":"詳しい指示だけでは出力が一貫しないとき、Few-shot例が一貫した書式を実現する最も効果的な手法です。","w":["正解。","すでに詳しい説明があっても一貫していない状況です。","自動化の意味がなくなります。","必要な情報が失われます。"]},
{"id":"d4-06","t":"4.2","s":1,"q":"「返品したいけど、届いた商品が説明と違う気もする」のように、どのツールを使うべきか迷うあいまいな依頼で、エージェントの判断が不安定です。Few-shot例を作るときに最も重要なポイントはどれですか？","o":["あいまいなケースを2〜4個選び、その行動を選んだ理由まで示す","判断がぶれないよう、明確で簡単なケースの例を20個並べる","例には結論（使うツール名）だけを示し、理由は書かない","本物らしくなるよう、実際の顧客名と注文番号を例に使う"],"a":[0],"e":"あいまいなシナリオに絞った2〜4個の例で、なぜその行動を選んだのかの理由を示すと、新しいパターンにも判断を一般化できます。","w":["正解。","簡単なケースばかりでは、あいまいなケースの判断が身につきません。","理由がないと一般化しにくくなります。","個人情報の扱いの面で不適切で、学習効果にも関係ありません。"]},
{"id":"d4-07","t":"4.2","s":6,"q":"研究論文から引用情報を抽出していますが、本文中に引用がある論文と、末尾に参考文献リストがある論文で抽出精度に差があり、必須項目が空になることがあります。最も効果的な改善はどれですか？","o":["異なる文書構造から正しく抽出するFew-shot例を追加する","空欄を防ぐため、引用情報の必須項目をさらに増やす","精度を保つため、文書構造が違う論文は処理対象から外す","出力を安定させるため、温度パラメータを下げて再実行する"],"a":[0],"e":"さまざまな文書構造への対応や、必須項目が空になる問題には、異なる形式から正しく抽出するFew-shot例の追加が有効です。","w":["正解。","空の項目の問題は解決しません。","対象を減らすのは改善ではありません。","文書構造の違いへの対応にはなりません。"]},
{"id":"d4-08","t":"4.2","s":5,"q":"レビューが、問題のない一般的なコードパターンまで指摘してしまいます。Few-shot例で誤検知を減らすときの最も効果的な例の作り方はどれですか？","o":["許容できるパターンと本当の問題を見分ける例を示す","問題のあるコードの例だけを大量に示し、見分け方を覚えさせる","許容できるパターンをすべて列挙したリストを作って渡す","誤検知を防ぐため、指摘を一切しない例を示す"],"a":[0],"e":"許容できるパターンと本当の問題を区別する例を示すと、誤検知を減らしつつ、未知のパターンへの一般化も可能になります。","w":["正解。","問題の例だけでは、許容できるパターンとの境界が学べません。","すべてを列挙するのは不可能で、一般化もできません。","本当の問題まで見逃すようになります。"]},
{"id":"d4-09","t":"4.2","s":6,"q":"Few-shot プロンプトの効果として、公式ガイドが挙げているものを2つ選んでください。","o":["あらかじめ示したケースだけでなく、新しいパターンにも判断を一般化できる","抽出タスクで、くだけた表記やさまざまな文書構造による幻覚を減らせる","出力の形式がそろうので、JSONの文法エラーを完全になくすことができる","例で手本を示すことで、特定のツールの実行を毎回決定的に強制できる","例を多く入れるほど、コンテキストウィンドウの上限を引き上げられる"],"a":[0,1],"e":"Few-shot例は一般化を助け、抽出の幻覚を減らします。文法エラーの排除は tool use＋JSONスキーマ、ツール呼び出しの強制は tool_choice やフックの役割です。","w":["正解。","正解。","文法エラーの排除は tool use と JSONスキーマの役割です。","Few-shot例は確率的な誘導です。特定ツールの呼び出しは tool_choice、手順の決定的な強制はフックなどプログラム側の仕組みの役割です。","上限は変わりません。"]},
{"id":"d4-10","t":"4.3","s":6,"q":"抽出結果のJSONがときどき壊れていて（閉じカッコ抜けなど）、後続システムでパースエラーが起きます。最も信頼できる対策はどれですか？","o":["JSONスキーマ付きの抽出ツールを定義し、tool use で受け取る","プロンプトで「必ず正しいJSONだけで答えて」と強調して書く","壊れたJSONを正規表現で検出して、自動で修復してから渡す","JSONより崩れにくいよう、CSV形式で出力させるように変える"],"a":[0],"e":"JSONスキーマ付きの tool use は、スキーマに準拠した構造化出力を得る最も信頼できる方法で、JSONの文法エラーをなくせます。","w":["正解。","お願いは確率的です。","壊れ方によっては修復できず、もろい仕組みです。","形式を変えても文法崩れの問題は残ります。"]},
{"id":"d4-11","t":"4.3","s":6,"q":"請求書からの抽出で、元の文書に「発注番号」が書かれていない場合でも、モデルがもっともらしい番号を作り出してしまいます。スキーマで発注番号は必須項目になっています。最も適切な修正はどれですか？","o":["発注番号を nullable にし、なければ null を返させる","発注番号の形式（桁数や文字種）を正規表現で厳しく制約する","「発注番号がなくても、絶対に捏造しないこと」とプロンプトに強く書く","発注番号がない請求書は不正なデータとみなし、エラーとして処理を止める"],"a":[0],"e":"元文書にないかもしれない情報を必須にすると、要件を満たすために値を捏造する原因になります。nullable にするのが正解です。","w":["正解。","形式が正しい偽の値が作られるだけです。","必須の制約が残る限り、捏造の圧力は残ります。","正当な請求書まで処理できなくなります。"]},
{"id":"d4-12","t":"4.3","s":6,"q":"tool use と厳密なJSONスキーマで抽出したところ、形式は完璧なのに「明細の合計金額」と「請求総額」が一致しないケースが見つかりました。この現象の説明として正しいものはどれですか？","o":["スキーマは文法エラーを防ぐが、意味的なエラーは防げない","スキーマの設定が誤っており、実は文法エラーが起きている","tool use を使うと、計算ミスが起きやすくなる","モデルの温度設定が高すぎることだけが原因である"],"a":[0],"e":"厳密なJSONスキーマは文法エラーをなくしますが、意味的エラー（明細の合計が総額と合わない、値が別の項目に入るなど）は防げません。別途、意味的な検証が必要です。","w":["正解。","形式は完璧なので、文法エラーではありません。","そのような根拠はありません。","温度だけが原因ではありません。厳密なスキーマでも、意味的なエラーは別の検証で見つける必要があります。"]},
{"id":"d4-13","t":"4.3","s":6,"q":"文書を「請求書」「契約書」の2つから選ぶ enum 項目で、想定外の種類の文書や、どちらとも判断しにくい文書が来るとうまく分類できません。推奨されるスキーマ設計はどれですか？","o":["enum に \"other\"＋詳細の項目と、判断できない場合の \"unclear\" を用意する","想定外の文書にも対応できるよう、enum の選択肢を思いつく限りすべて追加する","enum をやめて、文書の種類はすべて自由記述の文字列で書かせることにする","件数が最も多いので、判断できない文書はすべて \"請求書\" に分類させる"],"a":[0],"e":"拡張可能なカテゴリには \"other\"＋詳細文字列のパターン、あいまいなケースには \"unclear\" のenum値を用意します。","w":["正解。","すべてを予測するのは不可能です。","後続システムで扱いにくくなります。","誤分類を強制することになります。"]},
{"id":"d4-14","t":"4.3","s":6,"q":"元の文書によって日付が「2026/11/08」「Nov 8, 2026」「令和8年11月8日」などバラバラです。スキーマは厳密ですが、日付項目の値が統一されません。追加すべき対策はどれですか？","o":["スキーマに加えて、日付の正規化ルールをプロンプトに含める","形式がそろわない日付の項目は、スキーマから削除する","処理の前に、元文書の日付形式を人手で統一しておく","元の書き方を残すため、日付は自由形式のまま受け取る"],"a":[0],"e":"元データの書式が一定でない場合、厳密なスキーマと一緒に書式の正規化ルールをプロンプトに含めるのが推奨されています。","w":["正解。","必要な情報が失われます。","自動化の意味がなくなります。","後続システムで扱いにくくなります。"]},
{"id":"d4-15","t":"4.4","s":6,"q":"Pydantic での検証が「total が line_items の合計と一致しない」というエラーで失敗しました。再依頼の方法として最も効果的なものはどれですか？","o":["元の文書・失敗した抽出・具体的なエラーを添えて再依頼する","同じプロンプトのまま、もう一度だけ実行し直す","小さな差なので、検証エラーを無視して保存する","別のモデルに切り替えて、最初から抽出し直す"],"a":[0],"e":"リトライ時に元の文書・失敗した抽出・具体的な検証エラーを含めると、モデルが自己修正できます。","w":["正解。","何が間違っていたかが伝わらず、同じ結果になりやすいです。","誤ったデータが下流に流れます。","エラーの情報を活かしていません。"]},
{"id":"d4-16","t":"4.4","s":6,"q":"契約書から「契約更新時の価格」を抽出しようとしていますが、何度リトライしても値が取れません。調べてみると、その価格は別紙の料金表（今回は渡していない文書）にしか書かれていませんでした。適切な判断はどれですか？","o":["文書に情報がないのでリトライは効かない。null とし、必要なら別紙を入手する","いずれ取れるはずなので、リトライ回数を10回に増やして繰り返す","プロンプトに「更新時の価格を必ず見つけて」と強く書いて再依頼する","空欄を避けるため、一般的な相場から更新時の価格を推定して入れておく"],"a":[0],"e":"リトライは、必要な情報が元文書にそもそも存在しない場合には効果がありません（形式や構造の誤りとは違います）。","w":["正解。","存在しない情報は何度試しても出てきません。","捏造を促すだけです。","捏造データは信頼性を損ないます。"]},
{"id":"d4-17","t":"4.4","s":6,"q":"請求書の抽出で、モデル自身に矛盾を検出させたいです。スキーマ設計として最も効果的なものはどれですか？","o":["calculated_total と stated_total を並べて抽出し、conflict_detected を付ける","文書に記載された stated_total だけを抽出し、明細の合計と合わなくても記載どおりの金額を常に正とする","明細から計算した calculated_total だけを抽出し、記載の総額と違っても計算した結果のほうを常に正とする","矛盾の原因になるので、合計金額の項目はそもそも抽出しないことにして、明細の行だけを後続のシステムにそのまま渡す"],"a":[0],"e":"calculated_total と stated_total を並べて抽出し、conflict_detected で元データの矛盾を示させると、自己修正・検証のフローを設計できます。","w":["正解。","比較対象がないので矛盾を検出できません。","比較対象がないので矛盾を検出できません。","重要な情報が失われます。"]},
{"id":"d4-18","t":"4.4","s":5,"q":"CIレビューの指摘のうち、開発者に「対応不要」として却下されるものが多いです。どのような指摘が却下されやすいのかを体系的に分析したいです。どうしますか？","o":["指摘に detected_pattern 項目を加え、きっかけのコードの型を記録する","同じ指摘が繰り返し出ないよう、却下された指摘はその都度すべてデータから削除しておく","開発者に却下の理由を自由記述で書いてもらい、あとで担当者がまとめて読み返すようにする","却下を減らすため、出す指摘の件数そのものを毎回半分くらいまで機械的に絞り込むようにする"],"a":[0],"e":"detected_pattern 項目で指摘のきっかけとなったコードの型を記録すると、却下パターン（誤検知）を体系的に分析できます。","w":["正解。","分析の材料が失われます。","構造化されていないため集計・分析が難しくなります。","原因を特定せずに減らしても改善になりません。"]},
{"id":"d4-19","t":"4.4","s":6,"q":"リトライで解決する見込みが高いケースを2つ選んでください。","o":["日付の形式が指定と違っていた","値が誤った項目に入っていた（検証で具体的に指摘できる誤り）","必要な情報が、渡していない別の文書にしか書かれていない","元文書に該当する情報がそもそも存在しない","元文書のスキャン画像が真っ白だった"],"a":[0,1],"e":"形式の不一致や、値の入れ違いのように検証で具体的に指摘できる誤りは、エラー内容を添えたリトライで直る可能性があります。必要な情報が元の文書にない場合は、リトライしても解決しません。","w":["正解。","正解。項目の取り違えのような意味的なエラーも、具体的な検証エラーを添えて再依頼すれば直る見込みがあります。","情報が手元にないので、リトライでは解決しません。","情報が存在しないので解決しません。","情報が存在しないので解決しません。"]},
{"id":"d4-20","t":"4.5","s":5,"q":"コスト削減のため、上司が「プレマージチェック」と「夜間の技術的負債レポート」の両方を Message Batches API に切り替えようと提案しました。どう評価しますか？","o":["技術的負債レポートだけをバッチにし、プレマージチェックは同期APIのままにする","両方をバッチにし、完了したかどうかをポーリングで確認する","結果の順番が保証されないので、どちらもバッチにしない","両方をバッチにし、時間がかかりすぎたら同期APIにフォールバックする"],"a":[0],"e":"バッチは50%のコスト削減ですが、最大24時間かかりレイテンシの保証がありません。開発者が待つブロッキングな処理には不向きで、翌朝読むレポートには最適です。","w":["正解。","開発者がマージを待つ処理で「たいてい早く終わる」に頼るのは不適切です。","custom_id で対応付けできるので、順番は問題になりません。","不必要に複雑です。処理ごとに適切なAPIを選ぶのがシンプルな正解です。"]},
{"id":"d4-21","t":"4.5","s":6,"q":"10,000件の文書をバッチ処理したところ、200件が失敗しました（うち一部はコンテキストの上限を超える長さでした）。最も効率的な対処はどれですか？","o":["custom_id で失敗分を特定し、それだけを（必要なら分割して）再送する","結果をそろえるため、10,000件すべてをもう一度送信する","2%程度なので、失敗した200件はあきらめて処理を終える","確実に終わるよう、すべての文書を同期APIで1件ずつ処理し直す"],"a":[0],"e":"custom_id で失敗分だけを特定し、必要な修正（コンテキスト上限を超えた文書の分割など）を加えて再送するのが推奨です。","w":["正解。","成功した9,800件の処理がムダになります。","データが欠損します。","コストが大幅に増えます。"]},
{"id":"d4-22","t":"4.5","s":6,"q":"Message Batches API についての説明として、正しくないものはどれですか？","o":["1リクエストの中で、ツールを実行しながら複数ターンやり取りできる","通常の同期APIと比べて、50%のコスト削減になる","処理には最大24時間かかり、レイテンシの保証はない","custom_id で、各リクエストとその結果を対応付ける"],"a":[0],"e":"バッチAPIは、1リクエスト内での複数ターンのツール呼び出し（途中でツールを実行して結果を返すこと）をサポートしていません。","w":["正解（これが誤った説明）。","正しい説明です。","正しい説明です。","正しい説明です。"]},
{"id":"d4-23","t":"4.5","s":6,"q":"50万件の文書を初めてバッチ処理します。再送のコストを最小限にするために、事前にやっておくべきことはどれですか？","o":["少数のサンプルでプロンプトを改善してから大量処理する","まずは50万件を一度に送り、失敗が出たら考える","失敗を避けるため、全件を同期APIで処理する","プロンプトをできるだけ短くすることに集中する"],"a":[0],"e":"大量処理の前にサンプルでプロンプトを調整すると、初回の成功率が上がり、繰り返しの再送コストを減らせます。","w":["正解。","失敗が大量に出ると、再送のコストが大きくなります。","コストが2倍になります。","品質の検証なしに短くしても成功率は上がりません。"]},
{"id":"d4-24","t":"4.5","s":6,"q":"「データ受領から30時間以内に結果を返す」というSLAがあります。バッチ処理は最大24時間かかります。SLAを守るためのバッチ送信の考え方として最も適切なものはどれですか？","o":["待ち＋最大24時間が30時間に収まるよう、4時間ごとに送信する","24時間に1回、その日の分をまとめて送信する","12時間ごとに、それまでにたまった分を送信する","データが1,000件たまったら、その都度送信する"],"a":[0],"e":"最大24時間の処理時間に、送信までの待ち時間を加えても30時間を超えないよう送信間隔を決めます。4時間ごとなら最大28時間で収まります（公式ガイドにも4時間の例があります）。","w":["正解。","最大48時間近くかかり、SLAを守れません。","最大36時間かかり、SLAを守れません。","データの到着が遅いと、待ち時間に上限がなくなります。"]},
{"id":"d4-25","t":"4.6","s":5,"q":"生成したコードの品質を上げるため、同じセッションで「あなたが書いたコードを批判的にレビューして」と指示していますが、ほとんど問題が見つかりません。最も効果的な改善はどれですか？","o":["生成時の推論の文脈を持たない、独立した2つ目の Claude インスタンスにレビューさせる","拡張思考（extended thinking）を有効にして、同じセッションでレビューさせる","「もっと厳しく」と指示を強める","同じセッションでレビューを3回繰り返す"],"a":[0],"e":"同じセッションのモデルは生成時の推論を保持しているため、自分の判断を疑いにくいです。独立したインスタンスの方が、セルフレビューの指示や拡張思考より効果的です。","w":["正解。","公式ガイドは、独立インスタンスの方が拡張思考より効果的としています。","根本的な問題（同じ文脈）は変わりません。","同じバイアスが繰り返されるだけです。"]},
{"id":"d4-26","t":"4.6","s":5,"q":"大規模なPRのレビューを複数のパスに分ける設計として、最も適切なものはどれですか？","o":["ファイルごとのパスと、ファイル横断の統合パスに分ける","前半のファイルと後半のファイルに分けて、2つのパスでレビューする","同じ全体レビューを複数回行い、結果を多数決で決める","時間を節約するため、重要そうなファイルだけをレビューする"],"a":[0],"e":"マルチパスレビューは、ファイル単位のローカル分析と、ファイル横断の統合パスに分けることで、注意の希釈と矛盾した指摘を防ぎます。","w":["正解。","ファイル間の問題を見るパスがありません。","多数決は時々しか検出されない本物のバグを消してしまいます。","見落としが増えます。"]},
{"id":"d4-27","t":"4.6","s":5,"q":"レビュー結果のうち、どれを人が重点的に確認すべきか振り分けたいです。公式ガイドに沿った方法はどれですか？","o":["各指摘の確信度を自己申告させ、それでレビューの振り分けを調整する","公平になるよう、すべての指摘を同じ優先度で人に回して確認する","説明が長い指摘ほど重要と考え、文字数の多いものから回す","負担を減らすため、指摘をランダムに半分だけ人に回す"],"a":[0],"e":"各指摘に確信度を添えて自己申告させる検証パスを走らせ、校正されたレビューの振り分けに使う方法が挙げられています。","w":["正解。","限られたレビュアーの時間を効率的に使えません。","文字数と重要度は関係ありません。","重要な指摘が漏れる可能性があります。"]}
];

// ===== 問題バンク（オリジナル。公式 Exam Guide v1.0 の出題目標に準拠）=====
const Q_D5 = [
{"id":"d5-01","t":"5.1","s":1,"q":"長いサポート会話で、古い履歴を要約して圧縮しています。すると「4,980円の返金を11月15日までに」という顧客の要望が、要約後は「返金を希望」になってしまいました。最も適切な対策はどれですか？","o":["金額・日付・注文番号を「ケースファクト」として、要約とは別に毎回プロンプトに含める","情報が失われないよう要約をやめ、何十往復になっても会話をすべてそのまま保持し続ける","要約の文字数の上限を増やし、より長く詳しい要約を作らせて細部を残すようにする","要望の取り違えを防ぐため、顧客に毎回の返信のたびに要望を言い直してもらう"],"a":[0],"e":"段階的な要約は、数値・日付・顧客の期待をあいまいにしてしまいます。重要な事実は要約の外の永続的なブロックに保持します。","w":["正解。","コンテキストの上限を圧迫し、長い会話では続けられません。","要約を長くしても、具体的な数値が失われるリスクは残ります。","顧客体験を損ないます。"]},
{"id":"d5-02","t":"5.1","s":1,"q":"lookup_order は1回の呼び出しで40以上の項目を返しますが、返品対応で必要なのは5項目程度です。会話が進むとコンテキストがすぐ埋まります。最も適切な対策はどれですか？","o":["ツールの出力がコンテキストに蓄積される前に、返品に関係する項目だけに絞り込む","lookup_order の呼び出しを禁止する","会話の途中で毎回すべての履歴を削除する","コンテキストウィンドウのより大きなモデルに切り替えて、ツールの出力はすべてそのまま会話に残す"],"a":[0],"e":"ツールの結果は関連性に比べて不釣り合いにトークンを消費します。蓄積する前に関連する項目だけに絞り込むのが推奨です。","w":["正解。","必要な情報が得られなくなります。","会話の一貫性が失われます。","根本的なムダは残ります。"]},
{"id":"d5-03","t":"5.1","s":3,"q":"統合サブエージェントに20件の調査結果をまとめて渡すと、中盤の10件目あたりの重要な発見がレポートから抜け落ちます。最も効果的な対策はどれですか？","o":["要約を先頭に置き、詳細は見出しで整理する","重要な発見を入力の真ん中に集めて置く","調査結果を1件ずつ渡し、毎回レポートを書き直させる","見落としを防ぐため、調査結果を5件に減らす"],"a":[0],"e":"「Lost in the middle」効果により、長い入力の最初と最後は確実に処理されますが、中盤は見落とされがちです。要約を先頭に置き、見出しで整理すると位置の影響を緩和できます。","w":["正解。","中盤こそ見落とされやすい位置です。","非効率で、全体の整合性も取りにくくなります。","有用な情報が失われます。"]},
{"id":"d5-04","t":"5.1","s":3,"q":"レポート作成サブエージェントのコンテキスト予算が小さく、上流のエージェントから送られる長い文章と推論過程で埋まってしまいます。最も適切な改善はどれですか？","o":["上流には、要点・引用・関連度などの構造化データを返させる","コンテキストが足りないレポート作成サブエージェントを削除する","上流のエージェントの出力を、予算に収まる長さで途中から切り捨てる","レポート作成サブエージェントに「長い入力は読み飛ばして」と指示する"],"a":[0],"e":"下流のエージェントのコンテキスト予算が限られている場合、上流のエージェントに構造化データ（主要な事実・引用・関連度スコア）を返させるのが推奨です。","w":["正解。","機能が失われます。","重要な情報が失われる可能性があります。","必要な情報まで無視されます。"]},
{"id":"d5-05","t":"5.1","s":1,"q":"1回の会話で、顧客が3件の注文についてそれぞれ別の問題を相談しています。会話が長くなると、注文IDと金額の組み合わせを取り違えることがあります。最も適切な対策はどれですか？","o":["注文ID・金額・状態を、会話とは別の層に構造化して保持する","取り違えを防ぐため、3件の相談を別々の会話に分けてもらう","コンテキストを空けるため、会話全体を要約して短くする","取り違えないよう、注文IDを返信のたびに顧客に確認する"],"a":[0],"e":"複数の課題がある会話では、構造化された課題データ（注文ID、金額、ステータス）を別のコンテキスト層に保持するのが推奨です。","w":["正解。","顧客に負担がかかり、初回解決率も下がります。","要約で数値の対応関係が失われるリスクがあります。","顧客体験を損ないます。"]},
{"id":"d5-06","t":"5.2","s":1,"q":"顧客が最初のメッセージで「AIではなく人間の担当者と話したい」と明言しました。エージェントはどう対応すべきですか？","o":["調査を先にせず、すぐに人間の担当者へ引き継ぐ","まず注文状況を調べ、自力で解決できないか試す","AIでも十分に対応できると説明して説得する","顧客の感情スコアを計算してから判断する"],"a":[0],"e":"顧客が明示的に人間の担当者を求めた場合は、調査を先に行わず、すぐにその要求を尊重します。","w":["正解。","明示的な要求の無視になります。","顧客の希望に反します。","明示的な要求に感情分析は不要です。"]},
{"id":"d5-07","t":"5.2","s":1,"q":"顧客が「配送が遅れていて本当にイライラする！」と怒っていますが、人間の担当者を求めてはいません。問題は配送状況の確認と再送手配で、エージェントの対応範囲内です。最も適切な対応はどれですか？","o":["共感を示して解決を申し出て、それでも人を希望されたら引き継ぐ","強い不満が出ているので、すぐに人間の担当者へエスカレーションする","感情には触れず、配送状況の確認と再送手配だけを事務的に進める","感情スコアを計算し、閾値を超えたら自動でエスカレーションする"],"a":[0],"e":"問題がエージェントの対応範囲内なら、不満を受け止めつつ解決を申し出ます。それでも顧客が人間の担当者を希望した場合にエスカレーションします。","w":["正解。","感情は複雑さの指標ではなく、対応可能な案件まで引き継ぐことになります。","解決自体は進められますが、不満に触れないと顧客体験が悪化します。ガイドは、気持ちを受け止めたうえで解決を申し出ることを推奨しています。","感情ベースのエスカレーションはアンチパターンです。"]},
{"id":"d5-08","t":"5.2","s":1,"q":"返金ポリシーは「自社サイト内での価格差の調整」についてだけ定めています。顧客が「他社サイトの方が安かったので差額を返金して」と依頼してきました。エージェントはどう対応すべきですか？","o":["ポリシーに定めがない依頼なので、人間の担当者へ引き継ぐ","自社サイト内の規定を準用して、差額を返金する","ポリシーに定めがないので、きっぱりとお断りする","他社の価格を証明してもらってから、差額を返金する"],"a":[0],"e":"ポリシーがあいまい、または顧客の特定の依頼について何も定めていない場合（競合他社との価格合わせなど）はエスカレーションの対象です。","w":["正解。","ポリシーの解釈をエージェントが勝手に拡大しています。","ポリシーの空白を「禁止」と決めつけています。","ポリシーにない対応を勝手に実行しています。"]},
{"id":"d5-09","t":"5.2","s":1,"q":"get_customer で「田中 一郎」を検索したところ、3件の顧客が該当しました。エージェントはどうすべきですか？","o":["メールアドレスなど追加の識別情報を尋ねる","最近購入した顧客を選んで進める","最初に表示された顧客を選んで進める","3件すべての注文情報を顧客に見せる"],"a":[0],"e":"ツールの結果で複数の候補が見つかった場合は、推測で選ばず、追加の識別子を求めます。","w":["正解。","推測による選択は、別人のアカウント操作につながります。","推測による選択は、別人のアカウント操作につながります。","他の顧客の個人情報を漏らすことになります。"]},
{"id":"d5-10","t":"5.2","s":1,"q":"エスカレーションの判断基準として不適切なものを2つ選んでください。","o":["顧客メッセージの感情分析スコア","エージェントが自己申告する確信度スコア","顧客が人間の担当者を明示的に求めたこと","ポリシーに例外や空白があること","エージェントが意味のある前進をできないこと"],"a":[0,1],"e":"感情分析や自己申告の確信度は、実際のケースの複雑さの代理指標として信頼できません。適切なトリガーは、顧客の要求・ポリシーの例外や空白・前進できないこと、です。","w":["正解（不適切）。感情と複雑さは相関しません。","正解（不適切）。LLMの自己申告の確信度はうまく校正されておらず、当てになりません。","適切なトリガーです。","適切なトリガーです。","適切なトリガーです。"]},
{"id":"d5-11","t":"5.3","s":3,"q":"Web検索サブエージェントが、複雑なテーマの調査中にタイムアウトしました。コーディネーターへの失敗の伝え方として、最も適切なものはどれですか？","o":["失敗の種類・試したクエリ・部分結果・代替案を返す","リトライを尽くしたあと、「検索できませんでした」とだけ返す","タイムアウトを捕捉して、成功扱いの空の結果を返す","例外をトップまで投げて、調査ワークフロー全体を終了する"],"a":[0],"e":"構造化されたエラー情報があれば、コーディネーターはクエリを変えて再試行するか、別の方法を試すか、部分結果で進めるかを判断できます。","w":["正解。","汎用的なステータスは、判断に必要な文脈を隠してしまいます。","失敗を成功として隠すため、回復の機会が失われます。","回復できたはずの作業まで止めてしまいます。"]},
{"id":"d5-12","t":"5.3","s":3,"q":"一部の情報源にアクセスできないまま調査が完了しました。最終レポートの書き方として最も適切なものはどれですか？","o":["根拠が十分な部分と、情報源がなく穴のある部分を注記する","アクセスできなかったことは書かず、得られた情報だけでまとめる","情報源がすべてそろうまで、レポートの提出を待つ","穴のある部分は、一般的な知識で補って書いておく"],"a":[0],"e":"統合結果に、どの知見がよく裏付けられ、どの分野に情報源の欠落による穴があるかを示すカバレッジ注記を付けることが推奨されています。","w":["正解。","読み手が網羅性を誤解します。","部分的な結果でも価値があり、止める必要はありません。","根拠のない内容が混ざります。"]},
{"id":"d5-13","t":"5.3","s":3,"q":"マルチエージェントシステムのエラー処理で、アンチパターンとされているものを2つ選んでください。","o":["エラーを握りつぶして、空の結果を成功として返す","1つのサブエージェントの失敗で、ワークフロー全体を終了する","一時的な失敗はサブエージェント内でローカルに回復を試みる","解決できない失敗を、試したことと部分結果を添えてコーディネーターに伝える","アクセス失敗と、正常だが該当なしの結果を区別して報告する"],"a":[0,1],"e":"エラーの握りつぶしと、単一の失敗でのワークフロー全体の終了は、どちらもアンチパターンです。","w":["正解（アンチパターン）。","正解（アンチパターン）。","推奨される方法です。","推奨される方法です。","推奨される方法です。"]},
{"id":"d5-14","t":"5.3","s":3,"q":"文書分析サブエージェントが「該当する文書は0件でした」と報告しました。コーディネーターがこれを正しく解釈するために、サブエージェント側で必要なことはどれですか？","o":["アクセス失敗か、該当なしの正常な結果かを区別して報告する","混乱を避けるため、0件の場合は何も報告しない","念のため、0件の場合は必ずエラーとして報告する","空にならないよう、0件の場合は似た文書を代わりに返す"],"a":[0],"e":"アクセス失敗（再試行の判断が必要）と有効な空の結果（成功）を区別して報告することで、コーディネーターが適切に判断できます。","w":["正解。","情報が失われます。","正常な0件まで失敗扱いになります。","関係のない情報が混ざります。"]},
{"id":"d5-15","t":"5.4","s":4,"q":"レガシーコードベースの探索セッションが長くなるにつれ、エージェントが以前に見つけた具体的なクラス名ではなく、「一般的にはこういうパターンが多いです」と答えるようになりました。何が起きていて、どう対処すべきですか？","o":["文脈が劣化している。発見をスクラッチパッドに記録して参照させる","モデルの性能が足りていないので、別のモデルに切り替える","質問の仕方が悪いので、より丁寧で詳しい質問に変える","一時的なものなので、探索をさらに続ければ自然に回復する"],"a":[0],"e":"長いセッションでは、一貫しない回答や「典型的なパターン」への言及といったコンテキストの劣化が起きます。スクラッチパッドファイルで重要な発見を永続化するのが対策です。","w":["正解。","根本原因（コンテキストの劣化）に対処していません。","質問の仕方の問題ではありません。","劣化はさらに進みます。"]},
{"id":"d5-16","t":"5.4","s":4,"q":"大規模なコードベースの調査で、メインのエージェントが「すべてのテストファイルを探す」「返金処理の依存関係を追う」といった詳細な調査まで自分で行い、コンテキストが圧迫されています。推奨される構成はどれですか？","o":["個別の調査はサブエージェントに任せ、メインは調整に専念する","一貫性を保つため、すべての調査を1つのエージェントで続ける","コンテキストを守るため、調査を省いて推測で進める","メインのエージェントのコンテキストを、定期的にすべて消去する"],"a":[0],"e":"サブエージェントに具体的な調査を任せることで、冗長な探索出力を隔離し、メインのエージェントは高レベルの調整を保てます。","w":["正解。","コンテキストの劣化が進みます。","品質が下がります。","重要な知見まで失われます。"]},
{"id":"d5-17","t":"5.4","s":4,"q":"複数のエージェントで長時間の分析を行っていたところ、途中でプロセスがクラッシュしました。このような事態に備える設計として最も適切なものはどれですか？","o":["各エージェントが状態を書き出し、再開時にマニフェストを読み込んで注入する","状態は保存せず、クラッシュしたら毎回最初から分析をやり直す","全エージェントの会話履歴を、1つの巨大なテキストファイルにそのまま保存しておく","クラッシュの機会を減らすため、各エージェントの処理時間を短く区切る"],"a":[0],"e":"構造化された状態のエクスポート（マニフェスト）をコーディネーターが再開時に読み込み、エージェントのプロンプトに注入するクラッシュ復旧の設計が推奨されています。","w":["正解。","長時間の分析がムダになります。","構造化されておらず、再開時に扱いにくいです。","根本的な対策になりません。"]},
{"id":"d5-18","t":"5.4","s":2,"q":"探索の途中で冗長な出力が増え、コンテキストがいっぱいになってきました。セッションを続けながらコンテキストの使用量を減らすには、何を使いますか？","o":["/compact","/memory","--resume","-p"],"a":[0],"e":"/compact は、冗長な探索出力でコンテキストが埋まったときに使用量を減らすためのコマンドです。","w":["正解。","/memory は読み込まれたメモリファイルの確認用です。","--resume はセッションの再開用です。","-p は非対話モードのフラグです。"]},
{"id":"d5-19","t":"5.4","s":4,"q":"「構造の把握」フェーズが終わり、次の「影響範囲の詳細分析」フェーズでサブエージェントを起動します。フェーズ間の引き継ぎとして最も適切なものはどれですか？","o":["前のフェーズの要点を要約し、次の初期コンテキストに入れる","前のフェーズの会話履歴を、すべてそのまま渡す","先入観を避けるため、何も渡さずゼロから調べさせる","前のフェーズの最後のメッセージだけを渡す"],"a":[0],"e":"次のフェーズのサブエージェントを起動する前に、前フェーズの主要な発見を要約して初期コンテキストに注入するのが推奨です。","w":["正解。","冗長でコンテキストを浪費します。","同じ調査をやり直すムダが生じます。","重要な発見が漏れる可能性があります。"]},
{"id":"d5-20","t":"5.5","s":6,"q":"抽出システムの全体の正確度が97%に達したので、高確信度の抽出結果については人のレビューを廃止しようという提案が出ました。最初に確認すべきことはどれですか？","o":["文書タイプ別・項目別に正確度を確認する","97%なら十分な水準なので、すぐに廃止する","念のため、全体の正確度をもう一度計算し直す","廃止の前に、レビュアーの人数と配置を確認する"],"a":[0],"e":"全体の正確度（97%など）は、特定の文書タイプや項目の低い性能を隠すことがあります。区分別に検証してから自動化します。","w":["正解。","特定の区分での失敗を見逃す恐れがあります。","同じ集計値では隠れた問題は見えません。","人数は正確度の確認と関係ありません。"]},
{"id":"d5-21","t":"5.5","s":6,"q":"高確信度の抽出結果を自動で処理し始めた後も、誤りの発生率を継続的に測定し、新しい種類のエラーも見つけたいです。最も適切な方法はどれですか？","o":["高確信度の結果も層別ランダムサンプリングで誤り率を測る","高確信度は信頼できるので、低確信度の結果だけを人が継続的に確認する","問題が報告されたときだけ確認する","最初の1か月だけ、全件を確認する"],"a":[0],"e":"層別ランダムサンプリングにより、高確信度の抽出結果の誤り率を継続的に測定し、新しいエラーパターンも検出できます。","w":["正解。","高確信度の結果に潜む誤りを見逃します。","事後対応で、新しいパターンの早期発見ができません。","継続的な監視になりません。"]},
{"id":"d5-22","t":"5.5","s":6,"q":"モデルに項目ごとの確信度スコアを出させ、低いものを人のレビューに回す仕組みを作ります。閾値の決め方として最も適切なものはどれですか？","o":["正解付きの検証セットで校正してから閾値を決める","モデルが出す確信度をそのまま使い、0.8未満を回す","すべての項目で、同じ閾値を経験で決める","確信度は使わず、全件を人がレビューする"],"a":[0],"e":"項目レベルの確信度スコアは、ラベル付きの検証セットで校正してから、レビューの振り分けに使います。","w":["正解。","校正されていない確信度は、実際の正答率と一致しない可能性があります。","根拠がありません。","限られたレビュアーの時間を有効に使えません。"]},
{"id":"d5-23","t":"5.5","s":6,"q":"レビュアーの時間が限られています。人のレビューに優先的に回すべき抽出結果を2つ選んでください。","o":["モデルの確信度が低い抽出結果","元の文書があいまい、または矛盾している抽出結果","すでに何度も正しいと確認された定型フォーマットの抽出結果","ファイル名のアルファベット順で先頭の抽出結果","処理時間が短かった抽出結果"],"a":[0,1],"e":"確信度が低いもの、元文書があいまいまたは矛盾しているものを人のレビューに回し、限られたレビュー能力を優先的に使います。","w":["正解。","正解。","優先度は低いです（ただしサンプリングでの監視は続けます）。","重要度と関係ありません。","重要度と関係ありません。"]},
{"id":"d5-24","t":"5.6","s":3,"q":"2つの信頼できる調査機関が、同じ市場の規模についてそれぞれ「120億ドル」「95億ドル」と異なる数字を出しています。統合レポートでの扱いとして最も適切なものはどれですか？","o":["両方の値を出典付きで示し、食い違いがあることを注記する","より有名な機関の数字だけを採用する","2つの機関の数字の平均（107.5億ドル）を計算し、統合した推計値として1つだけ示す","数字には触れずに「大きな市場」とだけ書く"],"a":[0],"e":"信頼できる情報源同士で統計が食い違う場合は、恣意的にどちらかを選ばず、出典付きで食い違いを注記します。","w":["正解。","恣意的な選択で情報が失われます。","どちらの出典にもない数字を作り出しています。","有用な情報が失われます。"]},
{"id":"d5-25","t":"5.6","s":3,"q":"同じ指標について、ある文書は「普及率30%」、別の文書は「普及率52%」と書いており、統合サブエージェントが「情報源が矛盾している」と報告しました。実は前者は2021年、後者は2025年の調査でした。この誤解を防ぐ設計はどれですか？","o":["出力に公開日やデータ収集日を必ず含めさせる","新しい方の数字だけを使うよう指示する","数字の食い違いは、すべて無視させる","統合サブエージェントに年を推測させる"],"a":[0],"e":"公開日・収集日を構造化出力に含めさせることで、時間的な違いを矛盾と誤解するのを防げます。","w":["正解。","推移という有用な情報が失われます。","本当の矛盾まで見逃します。","根拠のない推測が混ざります。"]},
{"id":"d5-26","t":"5.6","s":3,"q":"複数のサブエージェントの結果を要約・統合する過程で、どの主張がどの出典に基づくのかが分からなくなります。最も適切な対策はどれですか？","o":["サブエージェントに主張と出典の対応表を出力させ、統合で保持・マージさせる","主張は要約に任せ、使った出典はレポートの最後に参考文献の一覧としてまとめて載せる","要約の段階では出典を省いて軽くし、最後に統合サブエージェントが内容から推測して出典を付け直す","正確さを優先し、出典の対応が分からなくなった主張は、レポートからすべて削除する"],"a":[0],"e":"要約の過程で主張と出典の対応が失われないよう、構造化されたクレーム–ソース対応を出力させ、統合時に保持・マージします。","w":["正解。","一覧だけでは主張との対応が分かりません。","誤った出典が付く恐れがあります。","重要な知見まで失われる可能性があります。"]},
{"id":"d5-27","t":"5.6","s":3,"q":"統合レポートの書き方として、公式ガイドの考え方に沿っているものを2つ選んでください。","o":["確立された知見と、議論のある知見を明確に別のセクションに分ける","財務は表、ニュースは文章など、内容に合う形式で示す","見た目をそろえて読みやすくするため、すべての内容を統一された箇条書きに変換する","混乱を避けるため、食い違いのある数字は最も新しい調査のものだけを残す","読み手に伝わりやすいよう、元の出典の表現は全面的に分かりやすく言い換える"],"a":[0,1],"e":"確立された知見と議論のある知見を分けること、内容の種類に応じて適切な形式で示すことが推奨されています。","w":["正解。","正解。","画一的な形式への変換は推奨されていません。","食い違いは出典付きで注記します。","元の出典の特徴や方法論の文脈を保つことが推奨されています。"]}
];

// ===== 問題バンク（オリジナル。公式 Exam Guide v1.0 の出題目標に準拠）=====
const Q_D1B = [
{"id":"d1-33","t":"1.1","s":1,"q":"エージェントが stop_reason \"tool_use\" で lookup_order の呼び出しを要求しました。プログラムがツールを実行したあと、次に行うべきことはどれですか？","o":["tool_use の返答とツールの結果を履歴に追加して、再度リクエストする","ツールの結果をそのまま顧客に表示して、その時点で会話を終える","新しい会話を始め、ツールの結果だけを最初のメッセージとして送り直す","ツールの結果はログに保存し、Claude には「完了しました」とだけ伝える"],"a":[0],"e":"エージェントループでは、ツールの結果を会話履歴に追加して次のリクエストに含めます。これで Claude は新しい情報をもとに次の行動を判断できます。","w":["正解。結果が履歴にあるからこそ、Claude は次の一手を考えられます。","Claude が結果を解釈して応答を組み立てる機会が失われます。","それまでの文脈が失われ、何のための結果か分からなくなります。","Claude は結果の中身を知らないまま進むことになります。"]},
{"id":"d1-34","t":"1.1","s":4,"q":"開発者支援エージェントで「Grep → Read → Write」という順番を固定で実行する実装にしたところ、想定外の構成のリポジトリで役に立たない結果ばかり出るようになりました。最も適切な改善はどれですか？","o":["ツールの順番を固定せず、エージェントループの中で Claude に文脈から次のツールを判断させる","固定の順番に Glob を追加して「Glob → Grep → Read → Write」の4ステップにする","リポジトリの種類ごとに別々の固定手順を用意し、種類を判定して切り替える","取りこぼしがないよう、すべてのツールを毎回1回ずつ必ず実行させる"],"a":[0],"e":"エージェントの強みはモデル主導の意思決定です。事前に決めたツール順序では、状況に応じた判断ができません。","w":["正解。Claude が状況を見て次の行動を選びます。","固定手順である点は変わらず、想定外の状況に弱いままです。","パターンが増えるだけで、未知の構成には対応できません。","不要な呼び出しが増え、判断の柔軟性もありません。"]},
{"id":"d1-35","t":"1.1","s":3,"q":"エージェントループの終了判定として、公式ガイドがアンチパターンとして挙げているものを2つ選んでください。","o":["返答の文章から「調査が終わりました」などの言い回しを検出してループを止める","返答にテキストが含まれているかどうかで完了を判断する","stop_reason が \"end_turn\" になったらループを終了する","stop_reason が \"tool_use\" ならツールを実行して続行する","ツールの結果を会話履歴に追加してから次のリクエストを送る"],"a":[0,1],"e":"自然言語のシグナルを解析する方法、アシスタントのテキストの有無で判断する方法、任意の回数上限を主な停止条件にする方法は、いずれもアンチパターンです。","w":["正解（アンチパターン）。自然言語での判定は不確実です。","正解（アンチパターン）。テキストとツール呼び出しは同時に返ることがあります。","正しい実装です。","正しい実装です。","正しい実装です。"]},
{"id":"d1-36","t":"1.1","s":1,"q":"次のうち、stop_reason の値とループ制御の組み合わせとして正しいものはどれですか？","o":["\"tool_use\" → ツールを実行して続行／\"end_turn\" → 終了","\"tool_use\" → 終了／\"end_turn\" → 続行","\"end_turn\" → ツールを実行／\"tool_use\" → ユーザーに質問","どちらの値でも気にせず、決めた回数上限に達するまで続行"],"a":[0],"e":"\"tool_use\" は Claude がツールを使いたいという合図、\"end_turn\" は応答を終えたという合図です。","w":["正解。","逆になっています。","\"end_turn\" はツールの要求ではありません。","回数上限を主な停止条件にするのはアンチパターンです。"]},
{"id":"d1-37","t":"1.1","s":3,"q":"チームの1人が「ツール結果は長いので会話履歴には入れず、要点だけを次のシステムプロンプトに書き足そう」と提案しました。この提案の一番の問題点はどれですか？","o":["結果が会話の流れから切り離され、Claude が次の行動を推論しにくくなる","システムプロンプトは一度しか読み込まれないため、要点が無視される","システムプロンプトには英語しか書けないため、日本語の要点を書き足すとエラーになる","会話履歴が短くなりすぎると API がエラーを返すため、リクエストが失敗するようになる"],"a":[0],"e":"エージェントループでは、ツール結果を会話履歴に追加することで、モデルがそれを踏まえて次の行動を判断します。長さが問題なら、関係する項目だけに絞る（5.1）のが筋です。","w":["正解。","システムプロンプトはリクエストのたびに送られるので、「一度しか読み込まれない」は誤りです。本当の問題は、結果が会話の流れ（どのツール要求への結果か）から切り離されることです。","システムプロンプトにも日本語は問題なく書けます。","履歴が短いこと自体でエラーになることはありません。"]},
{"id":"d1-38","t":"1.2","s":3,"q":"マルチエージェント調査システムで、コーディネーターが担うべき役割を2つ選んでください。","o":["テーマをサブタスクに分解し、どのサブエージェントに任せるかを決める","サブエージェントの結果を集約し、不足があれば追加で委任する","コーディネーターによる中継をやめ、サブエージェント同士が自由に直接やり取りできるようにする","すべてのWeb検索を自分で直接実行する","サブエージェントの会話履歴を自動で共有させる"],"a":[0,1],"e":"コーディネーターは、タスク分解・委任・結果の集約・不足の評価と再委任、そして通信・エラー処理・情報の流れの管理を担います。","w":["正解。","正解。","すべての通信をコーディネーター経由にするのが推奨です。","専門のサブエージェントに任せるのが本来の構成です。","サブエージェントは隔離されたコンテキストで動きます。"]},
{"id":"d1-39","t":"1.2","s":3,"q":"「電気自動車の普及が社会に与える影響」を調べたところ、レポートが電池技術の話に終始しました。コーディネーターのログでは「電池の容量」「電池の寿命」「充電速度」の3タスクに分けられていました。最も適切な修正はどれですか？","o":["コーディネーターの分解を見直し、テーマ全体をカバーするサブタスクに分ける","検索サブエージェントの検索件数を増やし、電池以外の記事も拾えるようにする","統合サブエージェントに、より長く幅広い観点の文章を書くよう指示する","レポート作成サブエージェントの書式を変え、社会的影響の章を必ず設ける"],"a":[0],"e":"下流のエージェントが正しく動いていても、分解が狭ければ網羅性は確保できません。コーディネーターの分解の狭さが原因です。","w":["正解。","割り当てが狭いままでは、件数を増やしても範囲は広がりません。","材料が偏ったままです。","書式の問題ではありません。"]},
{"id":"d1-40","t":"1.2","s":3,"q":"統合サブエージェントが作ったまとめを見ると、2025年以降のデータが不足していました。コーディネーターの次の行動として最も適切なものはどれですか？","o":["不足部分に絞ったクエリで再委任し、その結果で統合をやり直させる","不足は仕方ないものとして、得られた情報だけでレポートを完成させる","統合サブエージェントに「最新の情報も考慮して」と指示して書き直させる","不足のない結果にするため、最初からすべての調査をやり直させる"],"a":[0],"e":"コーディネーターが統合結果の不足を評価し、ターゲットを絞って再委任し、十分になるまで統合を繰り返す反復改善ループが推奨されています。","w":["正解。","網羅性の目標を満たしません。","新しい材料がなければ、書き直しても情報は増えません。","有効な結果まで捨てるのはムダです。"]},
{"id":"d1-41","t":"1.2","s":1,"q":"サポートエージェントを、請求担当と配送担当の2つのサブエージェントに分けました。エラー処理の方法が担当ごとにバラバラで、障害時の挙動が読めません。担当ごとに分けた構成は維持したいと考えています。推奨される改善はどれですか？","o":["やり取りをすべてコーディネーター経由にし、エラー処理を一本化する","請求担当と配送担当が直接連絡し合えるようにし、エラー時は互いに助け合わせる","エラーが起きたら、各サブエージェントが独自の判断で顧客に謝罪と説明をする","サブエージェントを廃止し、ツールを1つのエージェントに全部持たせる"],"a":[0],"e":"ハブ＆スポーク型でコーディネーターがすべての通信を管理すると、観測性と一貫したエラー処理が得られます。","w":["正解。","流れが複雑になり、エラー処理はさらにバラバラになります。","対応がバラバラなままです。","1つにまとめればエラー処理の経路も1本になりますが、「分けた構成を維持したい」という条件に反し、専門化の利点も失います。コーディネーター経由に統一すれば、分割の利点を残したまま解決できます。"]},
{"id":"d1-42","t":"1.2","s":3,"q":"サブエージェントの性質についての説明として正しいものはどれですか？","o":["サブエージェントは、コーディネーターの会話履歴を自動では引き継がない","サブエージェントは、コーディネーターの会話履歴をすべて自動で参照できる","サブエージェント同士は同じメモリを共有していて、互いの内容が見える","サブエージェントは、前回呼び出されたときの内容を自動で覚えている"],"a":[0],"e":"サブエージェントは隔離されたコンテキストで動作します。必要な情報はプロンプトで明示的に渡します。","w":["正解。","自動では引き継がれません。","メモリは共有されません。","呼び出しをまたいだ記憶の共有はありません。"]},
{"id":"d1-43","t":"1.3","s":3,"q":"コーディネーターが、検索結果と分析結果を「主な発見は3つです」と短くまとめてから統合サブエージェントに渡しています。その結果、レポートから具体的な数字と出典が抜け落ちます。最も適切な改善はどれですか？","o":["前段の発見を要約せず、数字や出典を含む完全な形で統合サブエージェントに渡す","統合サブエージェントのプロンプトに「具体的な数字と出典を必ず入れて」と指示を追加する","統合サブエージェントに検索ツールを与え、必要な数字や出典を自分で調べ直させる","レポート作成サブエージェントに、文脈から考えられる出典を推測して補わせる"],"a":[0],"e":"前段のエージェントの完全な発見を、サブエージェントのプロンプトに直接含めることが推奨されています。","w":["正解。","材料がなければ数字は書けません。","役割外のツール使用になり、重複作業も生じます。","出典の捏造につながります。"]},
{"id":"d1-44","t":"1.3","s":3,"q":"AgentDefinition で、サブエージェントの種類ごとに設定する内容として、公式ガイドに挙げられているものを2つ選んでください。","o":["サブエージェントの説明（description）とシステムプロンプト","そのサブエージェントが使えるツールの制限","コーディネーターの会話履歴を自動で共有する設定","サブエージェント同士のメモリ共有の設定","APIキーのローテーション周期"],"a":[0,1],"e":"AgentDefinition には、説明・システムプロンプト・ツールの制限などをサブエージェントの種類ごとに設定します。","w":["正解。","正解。","サブエージェントは親の履歴を自動では引き継ぎません。","メモリの共有はありません。","認証まわりは出題範囲外です。"]},
{"id":"d1-45","t":"1.3","s":4,"q":"メイン会話で見つけた「対象ファイルの一覧」をもとにサブエージェントに解析を任せたところ、サブエージェントが「どのファイルか分からない」と返しました。原因はどれですか？","o":["親の会話は自動で引き継がれないため、ファイル一覧をプロンプトに含める必要がある","サブエージェントの allowedTools に許可したツールが多すぎる","ファイル一覧が長すぎて、メイン会話のコンテキストが壊れてしまった","サブエージェントは Glob を使えないため、ファイルを特定できない"],"a":[0],"e":"サブエージェントのコンテキストはプロンプトで明示的に与える必要があります。親の文脈は自動で継承されません。","w":["正解。","ツールの数は今回の原因ではありません。","一覧の長さは関係ありません。サブエージェントにはそもそも親の会話が渡っていないことが原因です。","使えるツールは設定しだいですが、今回は「どのファイルか」の情報自体が渡っていないことが原因です。"]},
{"id":"d1-46","t":"1.3","s":3,"q":"共通の分析結果をもとに、「網羅的に広く調べる方針」と「重要な3分野に絞って深く調べる方針」を比べたいです。公式ガイドに沿った方法はどれですか？","o":["共有の分析からフォークしたセッションで、それぞれの方針を探る","1つのセッションの中で、2つの方針を交互に試して比べる","2つの方針のどちらかを、コーディネーターが最初に決め打ちする","分析をやり直して、それぞれ別の分析結果をもとにする"],"a":[0],"e":"フォークによるセッション管理は、共有の分析ベースラインから異なるアプローチを探るための仕組みです。","w":["正解。","文脈が混ざり、公平に比較できません。","比較そのものができません。","共通の分析を使わないため、比較の前提がそろいません。"]},
{"id":"d1-47","t":"1.3","s":3,"q":"サブエージェント間で調査結果を受け渡すときの形式として、最も適切なものはどれですか？","o":["主張・抜粋・出典URL・文書名などを項目に分けた構造化データ","読みやすさを優先して、1つの長い段落にまとめた文章","主張だけを並べた箇条書き（出典は省略して軽くする）","出典は別ファイルにまとめて保存し、どの主張の出典かは記さずに本文と一緒に渡す"],"a":[0],"e":"構造化データで内容とメタデータを分けると、エージェント間で出典を保持できます。","w":["正解。","どの主張がどの出典か分からなくなります。","出典が失われます。","分けること自体ではなく、主張と出典のひも付けが切れることが問題です。構造化データなら項目を分けたまま対応を保てます。"]},
{"id":"d1-48","t":"1.4","s":1,"q":"人間の担当者へ引き継ぐ際の要約に含めるべき項目として、公式ガイドの例に沿ったものを2つ選んでください。","o":["顧客IDと、問題の根本原因の分析結果","返金額と、担当者に勧める次のアクション","エージェント内部の推論過程を、そのまま全部","会話の全文をそのまま貼り付けたもの","エージェントが呼び出したツールの一覧と実行時間"],"a":[0,1],"e":"会話の記録にアクセスできない担当者向けに、顧客ID・根本原因・返金額・推奨アクションなどをまとめた構造化された要約を渡します。","w":["正解。","正解。","担当者がすぐ動ける情報になっていません。","担当者に全部読ませることになり非効率です。","担当者の判断にはほとんど役立ちません。"]},
{"id":"d1-49","t":"1.4","s":1,"q":"登録メールアドレスの変更は、本人確認が完了してからでないと実行してはいけません。プロンプトでの指示に加えて行うべき、最も確実な対策はどれですか？","o":["本人確認が済むまで、変更ツールの呼び出しをプログラムでブロックする","システムプロンプトの冒頭と末尾の両方に、同じ本人確認の指示を書いて強調する","本人確認を先に行ってから変更するFew-shot例を、複数追加する","変更はそのまま実行し、後で本人確認ができなければ元に戻す"],"a":[0],"e":"決定的な遵守が必要なワークフローの順序は、プログラムによる前提条件（ゲート）で強制します。","w":["正解。","プロンプトの指示は確率的で、まれな失敗が残ります。","Few-shot例も確率的な改善にとどまります。","事後の取り消しでは乗っ取りなどの被害を防げません。"]},
{"id":"d1-50","t":"1.4","s":1,"q":"顧客から「返品したい商品があるのと、配送先住所も変えたい」と相談されました。推奨される処理の流れはどれですか？","o":["2つの用件に分けてそれぞれ調べ、1つの回答にまとめる","返品の処理だけを行い、住所変更は別のチャットで依頼してもらう","2つの用件をまとめて1つのツール呼び出しで処理しようとする","住所変更が絡むので、すぐに人へエスカレーションする"],"a":[0],"e":"複数の懸念を含む依頼は、個別の項目に分解して（並列に）調べ、統一された解決策にまとめます。","w":["正解。","初回解決率が下がり、顧客の手間も増えます。","用件ごとに必要な確認が異なり、混乱のもとになります。","対応可能な用件まで引き継ぐ必要はありません。"]},
{"id":"d1-51","t":"1.4","s":1,"q":"本人確認の手順について、プロンプトで指示した場合の失敗率は0.5%でした。本人確認が必要な会話は1日1万件あります。この結果をどう評価し、どう対応すべきですか？","o":["1日約50件の失敗が起こり得るので、プログラムによる強制に切り替える","0.5%は十分に低い水準なので、現状のプロンプトのままで運用を続ける","プロンプトの表現を工夫し、Few-shot例も足して失敗率を0.3%まで下げる","失敗した会話を翌日まとめて人がチェックし、問題があれば取り消す"],"a":[0],"e":"プロンプトによる指示はゼロでない失敗率を持ちます。決定的な遵守が必要な場面では、プログラムによる強制が適切です。","w":["正解。","重大な影響がある手順では、まれな失敗も許容できません。","改善しても失敗率はゼロになりません。","事後の確認では被害を防げません。"]},
{"id":"d1-52","t":"1.4","s":1,"q":"返金処理の途中で、エージェントが人間の担当者にエスカレーションすることになりました。担当者は会話の記録を見られません。引き継ぎとして最も適切なものはどれですか？","o":["顧客ID・原因・返金額・推奨対応をまとめた要約を渡す","「返金の件で引き継ぎます」とだけ伝える","顧客にもう一度最初から説明してもらうよう案内する","エージェントが処理を途中まで進めた状態のまま、何も伝えずに引き継ぐ"],"a":[0],"e":"途中でのエスカレーションには、構造化された引き継ぎプロトコル（顧客情報・根本原因・推奨アクション）を使います。","w":["正解。","担当者が何をすべきか分かりません。","顧客の負担が大きく、体験が悪化します。","担当者が状況を把握できず、二重処理などの事故につながります。"]},
{"id":"d1-53","t":"1.5","s":1,"q":"1,000ドルを超える返金リクエストは、人間の承認フローに回すルールです。この強制に使うべきフックはどれですか？","o":["実行前のツール呼び出しを横取りし、条件に合えばブロックしてエスカレーションに回すフック","ツールの実行後に呼ばれ、返金結果を読みやすい形式に変換する PostToolUse フック","会話の終了時に呼ばれ、やり取り全体の要約を作って担当者に送るフック","システムプロンプトを読み込むタイミングで呼ばれ、返金ルールの文言を追記するフック"],"a":[0],"e":"ポリシー違反のアクションを止めるには、送信されるツール呼び出しを横取りするフックを使います。PostToolUse は結果の変換用です。","w":["正解。","実行後では、返金そのものを止められません。","返金の実行を止める役割ではありません。","ルールの強制にはなりません。"]},
{"id":"d1-54","t":"1.5","s":3,"q":"複数の検索ツールが、日付をそれぞれ「1731024000」「2024-11-08」「Nov 8, 2024」のような異なる形式で返します。エージェントが時系列を取り違える問題を解決する最適な方法はどれですか？","o":["PostToolUse フックで、日付形式をそろえてから渡す","統合サブエージェントのプロンプトに、各ツールの日付形式の読み方を詳しく書く","混乱を避けるため、日付を含む検索結果は統合に使わないようにする","日付形式がそろうよう、検索ツールを1つに減らして運用する"],"a":[0],"e":"PostToolUse フックは、モデルが処理する前にツールの結果を変換でき、異なるデータ形式の正規化に適しています。","w":["正解。","プロンプトでの説明は確率的で、取り違えが残ります。","重要な情報が失われます。","調査の幅が狭まり、根本解決になりません。"]},
{"id":"d1-55","t":"1.5","s":1,"q":"注文システムのツールが、ステータスを「1」「2」「3」のような数値コードで返すため、エージェントが状態を誤って説明してしまいます。最も適切な対策はどれですか？","o":["PostToolUse フックで、数値コードを意味の分かる値に変換してから渡す","システムプロンプトにステータスのコード表を載せ、毎回参照して読み替えさせる","エージェントから顧客に数値コードの意味を説明し、顧客に読み替えてもらう","誤った説明を避けるため、ステータスを返さないようにツールを変更する"],"a":[0],"e":"PostToolUse フックで、数値のステータスコードなどの異なる形式をモデルが処理する前に正規化します。","w":["正解。","確率的な理解に頼ることになります。","顧客体験を損ないます。","必要な情報が失われます。"]},
{"id":"d1-56","t":"1.5","s":4,"q":"開発者支援エージェントが、リポジトリ外のファイルを削除するような危険なコマンドを実行しないよう、確実に防ぎたいです。最も適切な方法はどれですか？","o":["ツール呼び出しを横取りするフックで、危険な操作をブロックする","システムプロンプトに「危険なコマンドは使わないで」と書く","危険なコマンドを使わないFew-shot例を追加する","実行後のログを毎日確認する"],"a":[0],"e":"ルールの遵守を保証したいときは、ツール呼び出しを横取りしてブロックするフックを選びます。プロンプトは確率的な遵守にとどまります。","w":["正解。","確率的で、まれな違反が残ります。","確率的な改善にとどまります。","事後の確認では被害を防げません。"]},
{"id":"d1-57","t":"1.5","s":1,"q":"フックを使うべき場面として適切なものを2つ選んでください。","o":["業務ルール上、例外なく守らせる必要がある制限（金額の上限など）","異なるMCPツールから返るデータ形式を、モデルが読む前にそろえたい","冷たい印象を与えないよう、回答の口調を柔らかくしたい","ブランドの雰囲気に合わせて、回答に絵文字を入れるか決めたい","読みやすさのため、回答の長さをなるべく短くまとめたい"],"a":[0,1],"e":"フックは、確実な遵守が必要なルールの強制と、ツール結果の正規化に使います。口調や体裁などの方針はプロンプトで十分です。","w":["正解。","正解。","プロンプトでの案内で十分です。","プロンプトでの案内で十分です。","プロンプトでの案内で十分です。"]},
{"id":"d1-58","t":"1.5","s":4,"q":"フックとプロンプトの違いの説明として、公式ガイドの考え方に合っているものはどれですか？","o":["フックは決定的で、プロンプトの指示は確率的である","プロンプトの指示もフックも、どちらも決定的に守られる","フックは確率的で、プロンプトの指示の方が確実に守られる","フックは、モデルがその気になったときだけ実行される"],"a":[0],"e":"公式ガイドは、決定的な保証のためのフックと、確率的な遵守にとどまるプロンプト指示を区別しています。","w":["正解。","プロンプトは確率的です。","逆です。","フックはプログラムとして確実に動きます。"]},
{"id":"d1-59","t":"1.6","s":5,"q":"CIで、30ファイルに及ぶ変更のテストを1回のプロンプトでまとめて生成させたところ、一部のファイルのテストが極端に薄くなりました。どう分解するのが適切ですか？","o":["ファイルごとの生成パスと、ファイル間の連携を見る統合パスに分ける","より長い出力が可能な設定にして、30ファイル分を1回で生成させる","30ファイルからランダムに10ファイルだけ選んで、テストを生成する","品質を保つためテスト生成をやめて、人がすべてのテストを書く"],"a":[0],"e":"大量のファイルを一度に扱うと注意が分散します。ファイルごとの局所的なパスと、ファイル横断の統合パスに分けるのが推奨です。","w":["正解。","出力の上限を広げても、一度に多くのファイルを扱うことによる注意の分散は解消しません。ファイルごとに分けて処理する方が、深さのそろったテストになります。","残りのファイルのテストが不足します。","自動化の価値を捨てています。"]},
{"id":"d1-60","t":"1.6","s":4,"q":"「本番環境のレスポンスが先月から遅くなった原因を調べて」という依頼に適した分解方法はどれですか？","o":["調べて分かったことに応じて、次に調べる対象を決めていく動的な分解","事前に決めた10項目のチェックリストを順番に必ず全部実行する","すべてのファイルを1回のプロンプトで同時に解析する","最初に原因を推測し、その仮説だけを確認する"],"a":[0],"e":"原因が分からない調査タスクには、各ステップの発見に基づいてサブタスクを生成する適応的な分解が向いています。","w":["正解。","調査の途中で見つかった手がかりに対応できません。","注意が分散し、深掘りできません。","他の原因を見逃します。"]},
{"id":"d1-61","t":"1.6","s":6,"q":"抽出パイプラインは毎回「文書タイプの判定 → 項目の抽出 → 検証」という決まった流れで処理します。この流れに適した分解パターンはどれですか？","o":["プロンプトチェイニング（決まった順序の段階的処理）","動的分解（途中の発見に応じてサブタスクを生成）","1回のプロンプトですべてを処理","人間が毎回手順を決める"],"a":[0],"e":"手順が予測可能で固定されている処理は、プロンプトチェイニングが適しています。","w":["正解。","動的分解は、ゴールの見えない調査向けです。","各段階の品質が下がりやすくなります。","自動化の意味が薄れます。"]},
{"id":"d1-62","t":"1.6","s":5,"q":"プロンプトチェイニングが向いている作業を2つ選んでください。","o":["毎回同じ観点（セキュリティ・性能・可読性）で行うコードレビュー","各ファイルを個別に分析してから、ファイル横断の統合チェックを行うレビュー","先週から断続的に起きている、原因の分からない障害の調査","新しい市場で、今後伸びそうな有望分野を手探りで探す調査","初めて触るレガシーシステムの、全体像と依存関係の把握"],"a":[0,1],"e":"予測可能な多観点のレビューや、ファイル単位→統合という決まった流れの処理はプロンプトチェイニング向き。原因不明の調査や探索的な作業は動的分解向きです。","w":["正解。","正解。","動的分解向きです。","動的分解向きです。","動的分解向きです。"]},
{"id":"d1-63","t":"1.6","s":4,"q":"「このレガシーコードに包括的なテストを追加して」という依頼で、エージェントが最初に取るべきステップとして最も適切なものはどれですか？","o":["コードベースの構造を把握し、影響の大きい領域を特定する","ファイルの先頭から順に、見つけた関数のテストを書き始める","カバレッジ100%を目標に、全関数のテストを一気に生成する","品質をそろえるため、既存のテストをすべて削除して作り直す"],"a":[0],"e":"オープンエンドな作業は、まず構造を把握し、影響の大きい領域を特定してから、優先順位つきの計画を立てます。","w":["正解。","重要度を考慮していません。","優先順位がなく、質も下がりがちです。","既存の資産を無駄にします。"]},
{"id":"d1-64","t":"1.6","s":3,"q":"調査エージェントが、最初に立てた計画に固執して、途中で見つかった重要な新しい手がかりを無視してしまいます。どう改善しますか？","o":["発見に応じてサブタスクを変える、適応的な調査計画にする","計画のステップ数を増やして、見落としを減らしておく","最初の計画を、もっと細かく時間をかけて作り込む","調査の時間制限を短くして、脱線する余地をなくす"],"a":[0],"e":"オープンエンドな調査では、発見に応じてサブタスクを生成する適応的な計画が価値を持ちます。","w":["正解。","固定計画である点は変わりません。","事前に予測できない手がかりには対応できません。","問題の解決になりません。"]},
{"id":"d1-65","t":"1.7","s":2,"q":"先週から続けている「payment-refactor」という名前のセッションの続きを、今日も行いたいです。コードは先週から変わっていません。どうしますか？","o":["--resume payment-refactor で再開する","新しいセッションを始めて、最初から調べ直す","fork_session で新しい分岐を作ってから続ける","-p フラグを付けて、非対話モードで続きを実行する"],"a":[0],"e":"以前の文脈がほぼ有効なら、--resume で名前付きセッションを再開するのが適切です。","w":["正解。","有効な文脈を捨てるのはムダです。","比較したい案がないなら分岐は不要です。","-p はCIなどの非対話実行用です。"]},
{"id":"d1-66","t":"1.7","s":2,"q":"共通のコード分析をもとに、「Jest で書く」案と「Vitest に移行して書く」案の2つのテスト戦略を試して比べたいです。最も適切な方法はどれですか？","o":["fork_session で共有の分析から2つに分岐して試す","1つのセッションの中で、2つのテスト戦略を交互に試して比べる","2回とも新しいセッションを開き、コード分析からやり直す","--resume で同じセッションに2回つないで、別々に進める"],"a":[0],"e":"fork_session は共有の分析ベースラインから独立した分岐を作り、テスト戦略やリファクタリング手法の比較に使えます。","w":["正解。","文脈が混ざってしまいます。","共通の分析をやり直すのはムダです。","分岐になりません。"]},
{"id":"d1-67","t":"1.7","s":4,"q":"調査セッションを再開する前に、3つのファイルを修正しました。再開後のエージェントへの伝え方として最も適切なものはどれですか？","o":["修正した3ファイルを伝え、その部分の再分析を依頼する","何も伝えずに、そのまま続きの質問をする","念のため、コードベース全体の再探索を依頼する","以前の分析結果をすべて忘れるよう指示してから続ける"],"a":[0],"e":"再開時には、以前に分析したファイルの変更点をエージェントに伝え、対象を絞った再分析を依頼します。","w":["正解。","古い前提のまま回答してしまいます。","不要なコストがかかります。","有効な知見まで失われます。"]},
{"id":"d1-68","t":"1.7","s":2,"q":"1か月前のセッションを再開しようとしています。その間にチームの大規模なリファクタリングがあり、当時のツール結果の多くが古くなっています。最も信頼できる方法はどれですか？","o":["重要な発見の要約を注入して、新しいセッションを始める","文脈を活かすため、そのまま --resume で再開する","fork_session で分岐を作ってから、その分岐で再開する","当時のツール結果をすべて手でコピーして新しいセッションに貼る"],"a":[0],"e":"古くなったツール結果を抱えて再開するより、構造化サマリーを持って新しく始める方が信頼できます。","w":["正解。","古い結果にもとづく誤った判断のリスクがあります。","分岐しても古い結果は残ります。","古い結果をそのまま持ち込むことになります。"]},
{"id":"d1-69","t":"1.7","s":4,"q":"セッション管理について正しい説明を2つ選んでください。","o":["--resume にセッション名を指定して、特定の過去の会話の続きから再開できる","fork_session は、共有の分析ベースラインから独立した分岐を作る","fork_session は元のセッションの内容を上書きして消す","再開は、ツール結果が古くなっていても常に新規開始より信頼できる","--resume はセッション名を指定できず、直前のセッションしか再開できない"],"a":[0,1],"e":"名前付きセッションの再開（--resume）と、共通ベースラインからの分岐（fork_session）が公式ガイドの重要ポイントです。","w":["正解。","正解。","元のセッションは残り、独立した分岐が作られます。","古い結果があるときは新規開始の方が信頼できます。","名前を指定して再開できます。"]},
{"id":"d1-70","t":"1.7","s":2,"q":"「再開」と「要約を持って新規開始」を選ぶ基準として、最も適切なものはどれですか？","o":["文脈がほぼ有効なら再開、ツール結果が古ければ要約を注入して新規開始","以前の文脈を活かせるので、ツール結果が古くなっていても常に再開を選ぶ","古い情報が混ざる危険を避けるため、どんな場合でも常に新規開始を選ぶ","セッションの長さ（やり取りの回数）だけを見て、長ければ新規開始を選ぶ"],"a":[0],"e":"以前の文脈が有効かどうか（ツール結果が古くなっていないか）で判断するのが公式の考え方です。","w":["正解。","古い結果を抱えたままになることがあります。","有効な文脈を捨てることになります。","長さではなく、文脈の有効性が基準です。"]}
];

const Q_D2B = [
{"id":"d2-27","t":"2.1","s":3,"q":"調査システムに search_web と search_docs という2つのツールがあり、説明はどちらも「情報を検索します」です。社内文書を探すべき場面でWeb検索が呼ばれることが多発しています。最初に取るべき対策はどれですか？","o":["それぞれの説明に、対象・入力例・使う場面と使わない場面を書き分ける","search_docs を一覧の先頭に並べ替えて、優先されるようにする","両方を1つの search ツールに統合し、内部で検索先を判定させる","誤選択の原因になっているWeb検索ツールを削除する"],"a":[0],"e":"ツールの説明はLLMがツールを選ぶ主要な手がかりです。重なった説明を書き分けて、目的と境界を明確にします。","w":["正解。","並び順は選択の根拠になりません。","手間が大きく、入出力の約束があいまいになりがちです。","Web検索が必要な場面で困ります。"]},
{"id":"d2-28","t":"2.1","s":4,"q":"開発者支援エージェントに、コードの説明・テストの生成・リファクタリング提案のすべてを行う code_helper ツールがあり、出力の形がばらつきます。推奨される改善はどれですか？","o":["explain_code / generate_tests / suggest_refactoring に分け、入出力を定める","code_helper の説明を1行に短くまとめて、モデルが読みやすいようにする","code_helper に自由記述の mode 引数を追加して呼び出し側が用途を指定できるようにし、説明やツール構成は今のまま変えない","code_helper はそのまま残し、出力の形のばらつきは後処理のスクリプトで判定して整形・吸収する"],"a":[0],"e":"汎用的なツールは、入出力の約束が明確な目的別ツールに分割すると、選択も出力も安定します。","w":["正解。","説明が短いと選択の精度が下がります。","使い分けの境界が伝わりません。","根本原因（汎用すぎるツール）が残ります。"]},
{"id":"d2-29","t":"2.1","s":1,"q":"lookup_order の説明文を改善します。公式ガイドの考え方に最も沿った説明文はどれですか？","o":["「注文番号（例：A-1024）から詳細と配送状況を取得。顧客情報は get_customer を使う」","「注文の情報を取得します。注文や配送に関することなら、まずこのツールを使ってください」","「便利な注文ツールです。注文・顧客・配送など、いろいろな用途に幅広く使えます」","「このツールを最優先で使ってください。迷ったときは、まずこのツールを呼ぶこと」"],"a":[0],"e":"入力形式・例・境界（似たツールとの使い分け）を含む説明が、ツール選択の信頼性を高めます。","w":["正解。","使う場面に少し触れてはいますが、入力形式や例がなく、get_customer との境界も書かれていません。「まずこのツールを」という指示は、顧客情報の質問まで呼び込む原因になります。","用途があいまいで、誤用を招きます。","使い分けの根拠にならず、過剰な使用を招きます。"]},

{"id":"d2-31","t":"2.1","s":3,"q":"analyze_content と analyze_document の役割が重なっていることが分かりました。調べると、前者は実際にはWeb検索結果の処理にしか使われていません。重なりを解消する方法として、公式ガイドの考え方に最も沿ったものはどれですか？","o":["analyze_content を extract_web_results のような名前に変え、説明もWeb専用に更新する","analyze_content はそのままにして、analyze_document の説明だけを詳しく書き直し、文書専用であることを強調する","2つのツールの一覧での順番を入れ替え、analyze_content を後ろに置いて選ばれにくくする","analyze_content を一覧から外し、存在をモデルに説明しないようにする"],"a":[0],"e":"ツールの名前を変え、説明を更新して機能の重なりをなくすのが推奨されています。","w":["正解。","片方だけでは重なりが解消しません。","順番は根拠になりません。","必要なツールが使われなくなります。"]},

{"id":"d2-33","t":"2.2","s":1,"q":"顧客が伝えた注文番号の形式が誤っていたため、lookup_order が失敗しました。エージェントが顧客に正しく聞き直せるようにするには、どのようなエラーを返すべきですか？","o":["入力不正のエラーとして、期待される形式の説明を付けて返す","タイムアウトとして返し、しばらく待って再試行させる","アクセス権限がないことを示す権限エラーとして返す","エラーにはせず、該当する注文が見つからなかった結果として返す"],"a":[0],"e":"入力不正のエラーであることと、人が読める説明を返せば、エージェントは入力を直すよう顧客に依頼できます。","w":["正解。","再試行しても形式の誤りは直りません。","原因が異なり、誤った対応を招きます。","「注文が存在しない」と誤解させてしまいます。"]},

{"id":"d3-29","t":"3.1","s":2,"q":"自分だけの好み（説明はいつも詳しめに、など）を Claude Code に覚えさせたいです。チームメイトには影響させたくありません。どこに書きますか？","o":["ユーザー階層の ~/.claude/CLAUDE.md","プロジェクトルートにある CLAUDE.md","リポジトリの .claude/CLAUDE.md",".claude/rules/ の中のファイル"],"a":[0],"e":"~/.claude/CLAUDE.md はそのユーザーにだけ適用され、バージョン管理でチームに共有されません。","w":["正解。","チーム全員に適用されます。","プロジェクト階層なので、チーム全員に適用されます。","プロジェクトで共有されます。"]},

{"id":"d3-31","t":"3.1","s":2,"q":"各パッケージのメンテナーが、自分のパッケージに関係する規約ファイルだけを選んで読み込ませたいと考えています。公式ガイドに沿った方法はどれですか？","o":["各パッケージの CLAUDE.md で @import を使い、必要な規約を取り込む","すべての規約ファイルを、ルートの CLAUDE.md にコピーしてまとめる","規約をスキルにして、パッケージの作業のたびにメンテナーが呼び出す","メンテナー各自の ~/.claude/CLAUDE.md に書いてもらう"],"a":[0],"e":"@import を使い、メンテナーの判断で関係する規約ファイルだけを各パッケージの CLAUDE.md に取り込むのが推奨です。","w":["正解。","無関係な規約まで読み込まれます。","常に守るべき規約が、呼び出すまで適用されません。","チームに共有されません。"]},
{"id":"d3-32","t":"3.1","s":2,"q":"「CLAUDE.md に書いたはずの指示が効いていない」という報告を受けました。原因を調べる最初の一手として最も適切なものはどれですか？","o":["/memory で読み込まれているファイルを確認する","CLAUDE.md の該当の指示を太字で強調する","Claude Code を再インストールして試す","同じ指示を CLAUDE.md に3回書いておく"],"a":[0],"e":"/memory で読み込まれているメモリファイルを確認すると、階層の問題などを診断できます。","w":["正解。","読み込まれていなければ効果はありません。","原因が分からないままです。","読み込まれていない問題は解決しません。"]},

{"id":"d3-35","t":"3.2","s":2,"q":"設計案をたくさん出す「ブレインストーミング」スキルを使うと、却下された案まで会話に残り、本題の作業が混乱します。最も適切な設定はどれですか？","o":["スキルのフロントマターに context: fork を設定し、隔離された文脈で実行させる","allowed-tools で Write を禁止し、案を書き出せないようにする","argument-hint を設定し、テーマを指定してから実行させる","スキルの代わりに、CLAUDE.md にブレインストーミングの手順を書いておく"],"a":[0],"e":"context: fork は、探索的な内容（代替案のブレインストーミングなど）をメインのセッションから隔離するのに使います。","w":["正解。","ツールの制限では、会話の汚染は防げません。","引数の案内用です。","常に読み込まれ、さらにコンテキストを圧迫します。"]},
{"id":"d3-36","t":"3.2","s":2,"q":"公式ガイドが挙げている、SKILL.md のフロントマターで設定できる項目を2つ選んでください。","o":["context: fork","allowed-tools","paths（ファイルの glob パターン）",".mcp.json","@import"],"a":[0,1],"e":"スキルのフロントマターには context: fork、allowed-tools、argument-hint などがあります。paths は .claude/rules/ のルールファイルで使います。","w":["正解。","正解。","公式ガイドでは、paths は .claude/rules/ のパス指定ルールで使う項目として説明されています。","MCPサーバーの設定ファイル名です。","CLAUDE.md で外部ファイルを取り込む構文です。"]},
{"id":"d3-37","t":"3.2","s":2,"q":"月に1回だけ使う「リリース前チェックリスト」の手順があります。Claude Code に持たせる方法として最も適切なものはどれですか？","o":["必要なときに呼び出すスキルとして用意する","CLAUDE.md に書いて、常に読み込ませる","各開発者のメモ帳に手順を保存しておく","使うたびに、ゼロから口頭で指示する"],"a":[0],"e":"スキルは特定作業のためのオンデマンドな手順、CLAUDE.md は常に読み込まれる普遍的な規約、という使い分けです。","w":["正解。","普段は不要な内容が常にコンテキストを占めます。","Claude Code から使えません。","手順が毎回ばらつきます。"]},
{"id":"d3-38","t":"3.3","s":2,"q":"API ハンドラーの規約は src/api/ 配下のファイルを編集するときだけ読み込ませたいです。.claude/rules/api.md のフロントマターとして正しい書き方はどれですか？","o":["paths: [\"src/api/**/*\"]","context: fork","allowed-tools: [\"src/api\"]","argument-hint: \"src/api\""],"a":[0],"e":".claude/rules/ のファイルでは、YAML フロントマターの paths に glob パターンを書いて条件付きで読み込ませます。","w":["正解。","スキルを隔離実行する設定です。","スキルのツール制限の設定です。","スキルの引数の案内です。"]},

{"id":"d3-40","t":"3.3","s":2,"q":"パス指定ルールを使うと、トークンの節約につながるのはなぜですか？","o":["一致するファイルを編集するときだけ読み込まれるから","ルールの文章が、読み込み時に自動で短く要約されるから","ルールは一度読み込まれると、二度と読み込まれないから","ルールがトークンを使わない特別な形式で保存されるから"],"a":[0],"e":"パス指定ルールは、一致するファイルの編集時だけ読み込まれるので、無関係なコンテキストとトークンの消費を減らせます。","w":["正解。","そのような仕組みはありません。","そのような仕組みはありません。","関係ありません。"]},
{"id":"d3-41","t":"3.3","s":2,"q":"リポジトリ内のすべての .sql ファイルに、同じ SQL のスタイル規約を適用したいです。最も適切な設定はどれですか？","o":[".claude/rules/sql.md に paths: [\"**/*.sql\"] を指定する","sql/ ディレクトリにだけ、SQL 規約の CLAUDE.md を置く","各開発者の ~/.claude/CLAUDE.md に SQL の規約を書く","規約を当てやすいよう、すべての SQL ファイルを1つのディレクトリに移動する"],"a":[0],"e":"ファイルの種類で規約を当てるには、場所に関係なく一致する glob パターンのルールが適しています。","w":["正解。","sql/ 以外の場所にある .sql ファイルに適用されません。","チームに共有されません。","規約のためにリポジトリ構成を変えるのは過剰です。"]},
{"id":"d3-42","t":"3.3","s":2,"q":"パス指定ルール（.claude/rules/ の paths）を選ぶべき場面を2つ選んでください。","o":["テストファイルのように、コードベース全体に散らばった同じ種類のファイルに規約を当てたい","特定のファイルを編集するときだけ規約を読み込んで、トークンを節約したい","すべての作業で常に守るべき普遍的なルールを書きたい","自分個人の好みを設定したい","必要なときだけ手動で呼び出す作業手順を用意したい"],"a":[0,1],"e":"パス指定ルールは、複数ディレクトリにまたがるファイルの種類ごとの規約や、条件付きの読み込みに向いています。","w":["正解。","正解。","CLAUDE.md（プロジェクト階層）向きです。","~/.claude/CLAUDE.md 向きです。","スキルやスラッシュコマンド向きです。"]},
{"id":"d3-43","t":"3.3","s":2,"q":"ディレクトリごとの CLAUDE.md と比べた、glob パターンのルールの利点はどれですか？","o":["ディレクトリに縛られず、ファイルの種類で当てられる","常にすべての規約がまとめて読み込まれる","開発者ごとに、個別の設定に変えられる","スキルのように、必要なとき手動で呼び出せる"],"a":[0],"e":"複数のディレクトリにまたがる規約（散らばったテストファイルなど）には、glob パターンのルールの方が向いています。","w":["正解。","条件付きで読み込まれるのが特徴です。","プロジェクトで共有されます。","自動で適用されます。"]},
{"id":"d3-44","t":"3.3","s":5,"q":"CIで生成されるテストの品質を上げるため、テストファイルを作成・編集するときだけテストの規約を読み込ませたいです。テストファイルは各モジュールの隣に置かれています。最も適切な方法はどれですか？","o":[".claude/rules/testing.md に paths: [\"**/*.test.*\"] を指定する","tests/ ディレクトリを作り、そこにテスト規約の CLAUDE.md を置く","CIのコマンドを実行するたびに、テスト規約の全文をプロンプトに貼り付けて渡す","CIを設定した担当者の ~/.claude/CLAUDE.md に、テスト規約を書いておく"],"a":[0],"e":"散らばったテストファイルに確実に規約を当てるには、glob パターンのパス指定ルールが適しています。","w":["正解。","tests/ 以外にあるテストファイルには適用されません。","テスト以外のファイルを扱うときも常に読み込まれ、「テストファイルのときだけ」という要件を満たしません。CIスクリプトとの二重管理にもなります。","CI環境やチームでは共有されません。"]},
{"id":"d3-45","t":"3.4","s":2,"q":"既存の関数に「開始日が終了日より後ならエラー」という条件を1つ追加します。適切な進め方はどれですか？","o":["直接実行","プランモードで全体の設計から始める","Explore サブエージェントでコードベース全体を調査する","fork_session で2つの案を比較する"],"a":[0],"e":"範囲が明確な小さな変更（日付の検証条件を1つ追加するなど）は、直接実行が適切です。","w":["正解。","単純な変更には過剰です。","過剰です。","比較すべき案がありません。"]},
{"id":"d3-46","t":"3.4","s":2,"q":"既存システムの認証を、自前のセッション方式とクラウドの認証サービスのどちらに移行するか決める必要があります。必要なインフラも異なります。最初に取るべき進め方はどれですか？","o":["プランモードで依存関係を調べ、両案を比較して決める","直接実行で、まず片方の方式から実装し始める","直接実行で、両方の方式を同時に実装して比べる","Claude に任せて、どちらか一方を実装させる"],"a":[0],"e":"複数の妥当なアプローチや設計判断がある作業はプランモードが適しています。","w":["正解。","後で方針を変えると手戻りが大きくなります。","ムダが多く、判断の先送りです。","設計判断なしに進めることになります。"]},
{"id":"d3-47","t":"3.4","s":4,"q":"大きな移行作業の調査フェーズで、ファイルの一覧や検索結果が大量に出て、メイン会話のコンテキストが逼迫しています。公式ガイドに沿った対処はどれですか？","o":["Explore サブエージェントに任せ、要約だけ返してもらう","調査結果を失わないよう、メイン会話に貼り続ける","調査を打ち切って、すぐに実装へ移る","新しいメイン会話を始めて、調査を最初からやり直す"],"a":[0],"e":"Explore サブエージェントは、冗長な調査の出力を隔離して要約を返し、メイン会話のコンテキストを守ります。","w":["正解。","コンテキストが尽きてしまいます。","根拠のない実装は手戻りのもとです。","根本的な解決になりません。"]},
{"id":"d3-48","t":"3.4","s":2,"q":"60ファイルに影響するロギングライブラリの移行を行います。公式ガイドの考え方に沿った進め方はどれですか？","o":["プランモードで計画を立て、直接実行で実装する","最初から直接実行で、思いついた順に修正する","プランモードのまま、実装も含めてすべて行う","移行はせず、新旧のライブラリを併用し続ける"],"a":[0],"e":"調査と設計はプランモード、実装は直接実行、という組み合わせが推奨されています。","w":["正解。","依存関係の見落としで手戻りが起きやすくなります。","プランモードは変更を確定する前の調査・設計向けです。","問題の解決になりません。"]},
{"id":"d3-49","t":"3.4","s":2,"q":"プランモードを選ぶべきサインを2つ選んでください。","o":["複数の妥当な実装方法があり、どれを選ぶか設計判断が必要","多数のファイルにまたがる大規模な変更","スタックトレースで原因が明確な、1ファイル内のバグ修正","変数名の typo の修正","関数に条件を1つ追加するだけの変更"],"a":[0,1],"e":"プランモードは、大規模な変更・複数の妥当なアプローチ・設計判断・複数ファイルの変更を伴う複雑な作業向けです。","w":["正解。","正解。","直接実行向きです。","直接実行向きです。","直接実行向きです。"]},
{"id":"d3-50","t":"3.4","s":2,"q":"「サービスの境界を見直して、モノリスを3つのサービスに分ける」という作業が最初から分かっています。チームメンバーが「とりあえず直接実行で始めて、難しくなったらプランモードに切り替えよう」と提案しました。どう評価しますか？","o":["複雑さは最初から分かっているので、初めからプランモードで設計すべき","提案どおりでよい。必要になってから切り替えれば十分","直接実行で、各サービスへの詳しい指示を最初に全部書く","この規模の作業なら、Claude Code は使わない方がよい"],"a":[0],"e":"複雑さがすでに要件で分かっているなら、最初からプランモードで探索と設計を行い、手戻りを防ぎます。","w":["正解。","分かっている複雑さを無視しています。","コードを調べずに正しい構成を知っている前提になっています。","根拠がありません。"]},
{"id":"d3-51","t":"3.5","s":2,"q":"CSV の行を独自のJSON形式に変換する処理を書かせています。ネストの仕方を文章で説明しても、毎回違う形になります。最も効果的な伝え方はどれですか？","o":["CSV の行と期待する JSON の例を2〜3組示す","「正確に」「仕様どおりに」と強調して伝える","ネストの仕方を、さらに細かい文章で書き直す","変換処理は手で書き、Claude には触らせない"],"a":[0],"e":"文章での説明が一貫して解釈されないときは、具体的な入出力例が最も効果的です。","w":["正解。","あいまいな強調では改善しません。","文章の解釈のブレは残ります。","Claude Code の活用を放棄しています。"]},
{"id":"d3-52","t":"3.5","s":2,"q":"ログメッセージの誤字と、無関係な画面の余白の崩れという、互いに関係しない2つの問題を直したいです。どう依頼するのが適切ですか？","o":["独立した問題なので、1つずつ順番に修正を依頼する","必ず1つのメッセージにまとめて依頼する","目立つ方の問題を1つだけ直してもらう","両方の修正方針を1つの設計書にまとめさせ、プランモードで承認してから直す"],"a":[0],"e":"修正が相互に影響する問題は1つのメッセージでまとめて、独立した問題は順番に直すのが推奨です。","w":["正解。","「必ず」まとめる必要はありません。互いに影響しない問題は、1つずつ順番に直すのが推奨です。","残りの問題が放置されます。","互いに無関係な小さな修正に、まとめた設計や承認は不要で過剰です。独立した問題は1つずつ順番に直します。"]},
{"id":"d3-53","t":"3.5","s":2,"q":"テストを先に書いてから実装させたところ、5つのテストのうち2つが失敗しました。次のステップとして最も適切なものはどれですか？","o":["失敗したテストの出力を共有して改善させる","通らないテストは不要と考え、削除する","テストの期待値を、今の実装の出力に合わせて書き換える","実装を最初から書き直させて、やり直す"],"a":[0],"e":"テスト駆動の反復では、テストの失敗を共有して段階的に改善していきます。","w":["正解。","品質の基準を捨てることになります。","期待する動作の基準を実装に合わせて曲げることになり、テストを先に書いた意味がなくなります。","うまくいっている部分まで捨ててしまいます。"]},
{"id":"d3-54","t":"3.5","s":2,"q":"決済処理の二重実行を防ぐ仕組みを、初めて設計します。考慮漏れを防ぐため、実装前に使うと効果的な手法はどれですか？","o":["インタビューパターンで質問させ、論点を洗い出してから実装する","考えるより試す方が早いので、すぐに実装させて本番で問題が出てから直す","ネット上で見つけた二重実行防止の実装例を、そのまま組み込んで使う","まず実装させ、実装が終わってからレビューの場で論点を洗い出す"],"a":[0],"e":"インタビューパターンは、不慣れな分野で実装前に設計上の考慮点を浮かび上がらせる手法です。","w":["正解。","重大な事故につながりかねません。","要件に合うとは限りません。","手戻りが大きくなります。"]},
{"id":"d3-55","t":"3.5","s":2,"q":"反復改善のテクニックとして、公式ガイドに挙げられているものを2つ選んでください。","o":["期待動作・エッジケース・性能要件をカバーするテストを先に書き、失敗を共有しながら改善する","言葉で伝わらない変換の要件を、具体的な入出力例で示す","同じ指示を何度も繰り返して送る","問題がすべて独立していても、必ず1つのメッセージにまとめる","指示を短くするほど、精度が上がると考える"],"a":[0,1],"e":"テスト駆動の反復と、具体的な入出力例は、公式ガイドが挙げる反復改善の手法です。","w":["正解。","正解。","改善の手がかりが増えません。","独立した問題は順番に扱うのが推奨です。","根拠がありません。"]},
{"id":"d3-56","t":"3.6","s":5,"q":"Claude Code を非対話モードで実行するフラグについて、正しい説明はどれですか？","o":["-p（--print）で、結果を出力して入力を待たずに終了する","-i を付けると、入力を待たない非対話モードで実行される","--quiet を付けると、確認なしの非対話モードで実行される","非対話モードはないため、Claude Code はCIでは使えない"],"a":[0],"e":"-p（--print）フラグが、自動化パイプラインで Claude Code を非対話モードで実行する方法です。","w":["正解。","公式ガイドの非対話モードは -p（--print）です。","公式ガイドの非対話モードは -p（--print）です。","-p でCIに組み込めます。"]},
{"id":"d3-57","t":"3.6","s":5,"q":"CIで実行する Claude Code に、チームのレビュー基準やテストのフィクスチャの規約を伝えたいです。公式ガイドに沿った方法はどれですか？","o":["プロジェクトの CLAUDE.md にレビュー基準や規約を書く","CIの環境変数に、レビュー基準の文章を入れておく","レビュー結果を見てから、人が基準に合わないものを消す","開発者各自の ~/.claude/CLAUDE.md に書いてもらう"],"a":[0],"e":"CLAUDE.md は、CIから呼ばれる Claude Code にプロジェクトの文脈（テスト基準、フィクスチャの規約、レビュー基準）を伝える仕組みです。","w":["正解。","公式ガイドが挙げる方法ではありません。","自動化の意味が薄れます。","CI環境には共有されません。"]},
{"id":"d3-58","t":"3.6","s":5,"q":"CIのレビュー結果を、PRの該当行へのインラインコメントとして自動で投稿したいです。必要な設定として最も適切なものはどれですか？","o":["--output-format json と --json-schema で、ファイル名・行・指摘を構造化して出力させる","人が読みやすい文章で出力させ、投稿スクリプトがファイル名や行番号を推測して解析する","レビュー結果の画面をスクリーンショットにして、PRのコメントとして投稿する","すべての指摘を1つの長いコメントにまとめて、ファイル名ごとに見出しを付けてPRの会話欄に投稿する"],"a":[0],"e":"--output-format json と --json-schema を使うと、機械で解析できる構造化された指摘が得られ、インラインコメントとして投稿できます。","w":["正解。","解析がもろくなります。","機械処理できません。","インラインコメントになりません。"]},
{"id":"d3-59","t":"3.6","s":5,"q":"CIでのテスト生成の品質を上げる方法として、公式ガイドに沿ったものを2つ選んでください。","o":["既存のテストファイルを文脈に含め、すでにカバーされているシナリオの重複提案を防ぐ","CLAUDE.md に、価値のあるテストの条件と利用できるフィクスチャを書いておく","テストの生成数をできるだけ増やす","テスト生成をコードを書いたのと同じセッションで行う","-p を付けずに対話モードで実行する"],"a":[0,1],"e":"既存テストを文脈に含めることと、CLAUDE.md にテスト基準やフィクスチャを記載することが推奨されています。","w":["正解。","正解。","低価値なテストが増えるだけです。","公式ガイドが挙げる方法ではありません。同じセッションでは実装時の前提を引きずりやすく、既存テストとの重複も減りません。","CIで入力待ちのまま止まります。"]},
{"id":"d3-60","t":"3.6","s":5,"q":"PRに新しいコミットが追加されたので、レビューを再実行します。重複コメントを防ぐための指示として最も適切なものはどれですか？","o":["前回の指摘を渡し、新規と未対応の問題だけを報告させる","前回のコメントをすべて削除してから、全指摘を投稿し直す","2回目以降は、差分のあったファイル名だけを投稿する","再レビューはせず、最初のレビュー結果だけを使い続ける"],"a":[0],"e":"前回の指摘を文脈に含めて、新規または未対応の問題だけを報告させると、重複コメントを避けられます。","w":["正解。","対応の経緯が失われ、通知も増えます。","レビューになっていません。","新しいコミットの問題を見逃します。"]}

{"id":"d4-37","t":"4.2","s":3,"q":"コーディネーターが、「検索すべきか、手元の文書の分析で足りるか」の判断に迷う依頼で、選択がぶれます。Few-shot例の使い方として最も適切なものはどれですか？","o":["判断の分かれる依頼の例を、選んだ理由とともに示す","明らかに検索が必要な依頼の例だけを、たくさん並べる","コーディネーターに「よく考えて判断して」とだけ指示する","迷わないよう、すべての依頼で検索と分析の両方を実行させる"],"a":[0],"e":"あいまいなリクエストに対するツール選択の扱いを、理由付きのFew-shot例で示すのが効果的です。","w":["正解。","境界の判断が学べません。","一般的な指示は効きにくいです。","コストと時間がムダになります。"]},

{"id":"d4-42","t":"4.3","s":3,"q":"分析サブエージェントの出力を、後続の統合サブエージェントが確実に読み取れる形にしたいです。最も信頼できる方法はどれですか？","o":["JSONスキーマ付きの出力用ツールを定義し、tool use で返させる","分析サブエージェントに「JSON形式で返して」とプロンプトでお願いする","見やすいよう、分析結果を Markdown の表形式で出力させる","統合サブエージェントに、自由な文章から必要な情報を読み取らせる"],"a":[0],"e":"JSONスキーマ付きの tool use は、スキーマに準拠した構造化出力を得るための最も信頼できる方法です。","w":["正解。","お願いは確率的で、形式が崩れることがあります。","解析がもろくなります。","読み取りのミスが起きやすくなります。"]},
{"id":"d4-43","t":"4.3","s":6,"q":"JSONスキーマ付きの tool use について、正しい説明を2つ選んでください。","o":["JSONの文法エラーをなくし、スキーマに沿った出力を得られる","元の文書にないかもしれない項目は、nullable にすると値の捏造を防ぎやすい","明細の合計と総額が一致することまで保証される","すべての項目を必須にするほど、精度が上がる","tool_choice を \"auto\" にすれば、必ずツールが呼ばれる"],"a":[0,1],"e":"tool use は文法エラーをなくしますが、意味的エラーは防げません。存在しないかもしれない情報は nullable にします。","w":["正解。","正解。","意味的なエラーは防げません。","必須にすると捏造の原因になります。","\"auto\" ではテキストで返すこともあります。"]},
{"id":"d4-44","t":"4.4","s":6,"q":"見積書から「支払期日」を抽出しようとしていますが、何度リトライしても取れません。調べると、支払期日は今回渡していない基本契約書にしか書かれていませんでした。どう判断すべきですか？","o":["文書に情報がないのでリトライは効かない。null とし、必要なら契約書を入手する","いずれ取れるはずなので、リトライ回数を増やして繰り返す","プロンプトに「支払期日を必ず見つけて」と強く書いて再依頼する","よくある支払条件（月末締め翌月末払い）から推定して、期日を埋めておく"],"a":[0],"e":"リトライは、必要な情報が元の文書にない場合には効果がありません。","w":["正解。","情報がなければ何度試しても同じです。","捏造を促します。","捏造データになります。"]},
{"id":"d4-45","t":"4.4","s":6,"q":"請求書の抽出スキーマに conflict_detected という真偽値の項目を追加する目的として、最も適切なものはどれですか？","o":["元の文書内の食い違いを示させ、後で確認できるようにするため","JSONの文法エラーを検出して、自動で修正するため","矛盾の確認を省いて、処理時間を短くするため","矛盾がなければ、すべての抽出結果を自動で承認するため"],"a":[0],"e":"conflict_detected などの項目で、元データの不整合を示させる自己修正型の検証フローが推奨されています。","w":["正解。","文法エラーは tool use でなくなります。","関係ありません。","逆の目的です。"]},
{"id":"d4-46","t":"4.4","s":5,"q":"開発者が却下したレビュー指摘を分析して、誤検知の多いパターンを見つけたいです。指摘のデータに追加すると効果的な項目はどれですか？","o":["きっかけのコードの型を記録する detected_pattern","指摘を書いた時刻と、そのレビュー全体にかかった処理時間","指摘の文字数と、指摘の本文に含まれている単語の数の合計","レビューを実行したCIマシンの名前と、そのハードウェア設定"],"a":[0],"e":"detected_pattern を加えると、どのコードの型が指摘を生んだかを記録でき、却下パターンを体系的に分析できます。","w":["正解。","パターン分析には役立ちません。","関係ありません。","関係ありません。"]},
{"id":"d4-47","t":"4.4","s":6,"q":"次のうち、tool use では防げない「意味的なエラー」の例はどれですか？","o":["住所が「電話番号」の項目に入っている","JSONの閉じカッコが足りない","文字列の引用符が閉じていない","数値の項目に余計なカンマが入って構文が壊れている"],"a":[0],"e":"値が別の項目に入っている、合計が合わないなどは意味的なエラーです。JSONの文法エラーは tool use で防げます。","w":["正解。","JSONの文法エラーで、tool use で防げます。","JSONの文法エラーで、tool use で防げます。","JSONの文法エラーで、tool use で防げます。"]},
{"id":"d4-48","t":"4.4","s":6,"q":"検証に失敗した抽出を自己修正させる再依頼に含めるべきものを2つ選んでください。（元の文書も含めるものとします）","o":["失敗した抽出結果","具体的な検証エラーの内容","モデルの温度設定","前回の処理時間","「次は頑張って」という励ましの言葉"],"a":[0,1],"e":"再依頼には、元の文書・失敗した抽出・具体的な検証エラーを含めます。","w":["正解。","正解。","自己修正の手がかりになりません。","自己修正の手がかりになりません。","自己修正の手がかりになりません。"]},
{"id":"d4-49","t":"4.5","s":5,"q":"次のうち、Message Batches API の利用に向いているワークロードはどれですか？","o":["毎週月曜の朝に読む、全リポジトリのセキュリティ監査レポート","開発者がマージ前に結果を待っている、PRの自動レビュー","顧客がチャット画面で待っている、問い合わせへの返答","ユーザーが検索ボタンを押して結果を待つ、社内文書の検索"],"a":[0],"e":"バッチは待てる（レイテンシを許容できる）処理向けで、待たせる（ブロッキングな）処理には向きません。","w":["正解。","ブロッキングな処理なので同期APIが適切です。","リアルタイム性が必要です。","リアルタイム性が必要です。"]},
{"id":"d4-50","t":"4.5","s":6,"q":"抽出処理の途中で外部ツールを呼び、その結果を見て次の抽出を決める「複数ターンのツール呼び出し」が必要なワークフローがあります。これを Message Batches API で1リクエストとして処理できますか？","o":["できない。1リクエスト内で途中にツールを実行して結果を返すことはできない","できる。バッチでも同期APIと同じく、ツールを実行しながら何ターンでも続けられる","できる。ただし各ターンのリクエストに、同じ custom_id を付けておく必要がある","できる。ただしすべてのターンを、24時間の処理時間内に終わらせる必要がある"],"a":[0],"e":"バッチAPIは、1リクエスト内でツールを実行して結果を返すような複数ターンのやり取りをサポートしていません。","w":["正解。","誤りです。","custom_id は対応付けのためのものです。","誤りです。"]},
{"id":"d4-51","t":"4.5","s":6,"q":"バッチ処理の custom_id の主な役割はどれですか？","o":["各リクエストと結果を対応付けること","そのリクエストの処理の優先順位を上げること","同じIDのリクエストをまとめて、処理時間を短くすること","同じIDの結果を再利用して、コストをさらに下げること"],"a":[0],"e":"custom_id は、バッチのリクエストとレスポンスの組み合わせを対応付けるためのフィールドです。","w":["正解。","優先度の機能ではありません。","関係ありません。","関係ありません。"]},
{"id":"d4-52","t":"4.5","s":6,"q":"「データ受領から26時間以内に結果を返す」というSLAがあり、バッチ処理は最大24時間かかります。SLAを守るためのバッチ送信の間隔として最も適切なものはどれですか？","o":["2時間以内の間隔で送信する","6時間ごとに送信する","12時間ごとに送信する","1日1回送信する"],"a":[0],"e":"送信までの待ち時間＋最大処理時間（24時間）がSLA（26時間）を超えないように間隔を決めます。2時間ごとなら最大26時間でぎりぎり収まります。実運用では、さらに短い間隔にして余裕を持たせると安心です。","w":["正解。","最大30時間かかり、SLAを守れません。","最大36時間かかり、SLAを守れません。","最大48時間かかり、SLAを守れません。"]},
{"id":"d4-53","t":"4.5","s":5,"q":"Message Batches API の特徴として正しいものを2つ選んでください。","o":["同期APIと比べて約50%のコストを削減できる","処理には最大24時間かかることがあり、レイテンシの保証はない","結果の順番が保証されないので、リクエストとの対応付けはできない","1リクエストの中で、何ターンでもツールを呼び出せる","マージ前チェックのような待たせる処理に最適である"],"a":[0,1],"e":"バッチAPIは50%のコスト削減・最大24時間・レイテンシ保証なしが特徴です。custom_id で対応付けできます。","w":["正解。","正解。","custom_id で対応付けできます。","複数ターンのツール呼び出しはできません。","待たせる処理には向きません。"]},
{"id":"d4-54","t":"4.6","s":5,"q":"同じセッションで生成したコードを、そのセッションに自己レビューさせると見落としが多くなる理由として最も適切なものはどれですか？","o":["生成時の推論の文脈が残っているため、自分の判断を疑いにくいから","セッションが長くなると、モデルの性能が自動的に下がる設定になっているから","レビュー用のツールが同じセッションでは使えないから","同じセッションでは JSON が出力できないから"],"a":[0],"e":"モデルは生成時の推論の文脈を保持しているため、同じセッションでは自分の判断を疑いにくくなります。","w":["正解。","そのような設定はありません。","そのような制約はありません。","関係ありません。"]},
{"id":"d4-55","t":"4.6","s":5,"q":"生成したコードの微妙なバグを見つける方法として、公式ガイドが最も効果的としているものはどれですか？","o":["生成時の推論の文脈を持たない、独立したレビュー用インスタンスを使う","同じセッションで拡張思考（extended thinking）を有効にして見直させる","同じセッションで「自分のコードを疑って」と指示する","同じセッションで3回連続でレビューさせる"],"a":[0],"e":"独立したレビューインスタンスは、セルフレビューの指示や拡張思考よりも微妙な問題の検出に効果的です。","w":["正解。","独立インスタンスより効果が低いとされています。","同じ文脈が残る点は変わりません。","同じバイアスが繰り返されます。"]},
{"id":"d4-56","t":"4.6","s":5,"q":"12ファイルのPRを1回でレビューさせると、あるファイルで指摘したパターンを、別のファイルの同じコードでは見逃すなど、矛盾した結果が出ます。どう改善しますか？","o":["ファイルごとのレビューと、ファイル横断の統合レビューに分ける","同じレビューを5回実行し、多数決で残す指摘を決める","開発者に、PRを1ファイルずつに分けて出すよう求める","矛盾が出ないよう、レビューの観点そのものを減らす"],"a":[0],"e":"マルチパスレビューで注意の希釈と矛盾した指摘を防ぎます。","w":["正解。","多数決はときどきしか見つからない本物のバグを消してしまいます。","開発者に負担を移すだけです。","見つけるべき問題を見逃します。"]},
{"id":"d4-57","t":"4.6","s":5,"q":"マルチパスレビューで、「ファイル横断の統合パス」が主に見つけるべき問題はどれですか？","o":["変更したデータの形を、別ファイルが古い前提で使っているなどの不整合","1つのファイルの中で、変数名に typo があること","1つの関数の中で、インデントが崩れていること","1つのファイルの中で、コメントに誤字があること"],"a":[0],"e":"統合パスは、ファイルをまたぐデータの流れの問題を分析するためのものです。局所的な問題はファイル単位のパスで扱います。","w":["正解。","ファイル単位のパスで扱う局所的な問題です。","ファイル単位のパスで扱う局所的な問題です。","ファイル単位のパスで扱う局所的な問題です。"]},
{"id":"d4-58","t":"4.6","s":2,"q":"Claude Code で生成した大きな機能のコードを、マージ前にレビューしたいです。公式ガイドの考え方に沿った進め方はどれですか？","o":["生成に使ったのとは別の、独立したセッション（インスタンス）でレビューさせる","文脈を知っている生成したセッションに、そのまま続けてレビューさせる","レビューは省き、テストがすべて通るかどうかだけで判断する","生成したセッションに「さっきのコードは正しい？」と確認する"],"a":[0],"e":"生成時の推論の文脈を持たない独立したインスタンスでレビューする方が、問題を見つけやすくなります。","w":["正解。","自分の判断を疑いにくいため、見落としが増えます。","レビューで見つかる問題を見逃します。","同じ文脈で確認しても見落としやすいです。"]},
{"id":"d4-59","t":"4.6","s":5,"q":"各指摘についてモデルに確信度を自己申告させる「検証パス」を設ける目的として、公式ガイドに沿ったものはどれですか？","o":["確信度をもとに、人が重点的に見る指摘を振り分けるため","確信度が低い指摘を、自動ですべて削除して出力を絞るため","確信度だけを根拠に、顧客対応のエスカレーションを決めるため","確信度に合わせて、モデルの温度設定を自動で調整するため"],"a":[0],"e":"指摘ごとの確信度を伴う検証パスは、校正されたレビューの振り分けに使います。","w":["正解。","本物の問題まで消える恐れがあります。","自己申告の確信度でのエスカレーション判断はアンチパターンです（5.2）。","関係ありません。"]},
{"id":"d4-60","t":"4.6","s":5,"q":"レビューの設計として、公式ガイドの考え方に沿っているものを2つ選んでください。","o":["大きなレビューを、ファイル単位のパスとファイル横断の統合パスに分ける","コードを生成したのとは別の独立したインスタンスでレビューする","より大きなコンテキストのモデルで、全ファイルを1回で見る","同じレビューを複数回行い、全回で出た指摘だけを残す","生成したセッションで拡張思考を使えば、別インスタンスは不要"],"a":[0,1],"e":"マルチパスレビューと、独立したレビューインスタンスが推奨されています。","w":["正解。","正解。","コンテキストの広さは注意の質の問題を解決しません。","ときどきしか検出されない本物のバグを消してしまいます。","独立インスタンスの方が効果的とされています。"]}
];

const Q_D5B = [
{"id":"d5-28","t":"5.1","s":1,"q":"チャットボットの実装で、毎回のAPIリクエストに直前の顧客メッセージだけを送っています。その結果、エージェントが少し前の会話の内容を忘れたような返答をします。最も基本的な改善はどれですか？","o":["以降のAPIリクエストには、会話の履歴全体を含めて送る","システムプロンプトに「前の会話を覚えておいて」と書く","顧客に毎回、前の内容を繰り返してもらう","返答の長さを短くする"],"a":[0],"e":"会話の一貫性を保つには、以降のAPIリクエストに会話履歴全体を渡すことが重要です。","w":["正解。","渡していない情報は参照できません。","顧客体験を損ないます。","原因に対処していません。"]},
{"id":"d5-29","t":"5.1","s":3,"q":"統合サブエージェントが、古い統計と新しい統計を区別できず、誤ったまとめを作ります。上流のサブエージェントに求めるべきことはどれですか？","o":["出力に日付・出典の場所・調査方法を含める","出力をできるだけ短い文章にまとめさせる","比べやすいよう、数値をすべて丸めて出力させる","出典は省いて、結論だけを返させる"],"a":[0],"e":"サブエージェントの構造化出力に、日付・出典の場所・方法論などのメタデータを含めることで、後段の統合が正確になります。","w":["正解。","区別に必要な情報が失われます。","精度が落ちます。","検証ができなくなります。"]},
{"id":"d5-30","t":"5.1","s":1,"q":"長いサポート会話で、要約とは別に毎回プロンプトへ入れる「ケースファクト」ブロックに含めるべき情報を2つ選んでください。","o":["注文番号と返金額","顧客が希望した対応の期日","エージェントのあいさつ文","会話中の雑談の内容","エージェントが使った言い回しの一覧"],"a":[0,1],"e":"金額・日付・注文番号・ステータスなどの取引上の事実や、顧客の期待を、要約された履歴とは別に保持します。","w":["正解。","正解。","重要な事実ではありません。","重要な事実ではありません。","重要な事実ではありません。"]},
{"id":"d5-31","t":"5.1","s":3,"q":"統合サブエージェントに渡す入力が長く、セクションの区切りもないため、どこに何があるか分かりにくくなっています。中盤の情報の見落としを減らすための工夫として、公式ガイドに沿ったものはどれですか？","o":["要約を先頭に置き、詳細は見出しで整理する","重要な情報を、入力の中盤にまとめて置く","すべての情報を、1つの段落につなげる","入力の順番を、毎回ランダムに入れ替える"],"a":[0],"e":"要約を先頭に置き、明確な見出しで詳細を整理することで、位置による見落とし（lost in the middle）を緩和します。","w":["正解。","中盤は見落とされやすい位置です。","さらに見落としやすくなります。","一貫性がなく、改善になりません。"]},
{"id":"d5-32","t":"5.1","s":1,"q":"get_customer は顧客の情報を60項目以上返しますが、配送の問い合わせで使うのは住所と連絡先程度です。会話が長くなるとコンテキストが埋まります。最も適切な対策はどれですか？","o":["蓄積する前に、関係する項目だけに絞り込む","情報が多すぎるので、get_customer を使わないようにする","一定時間ごとに、会話の履歴をすべて消去する","顧客情報をすべて、システムプロンプトに書き込んでおく"],"a":[0],"e":"ツールの結果は関連性に比べて不釣り合いにトークンを消費します。蓄積する前に関係する項目だけに絞ります。","w":["正解。","本人確認などに必要な情報が得られなくなります。","会話の一貫性が失われます。","さらにコンテキストを圧迫します。"]},
{"id":"d5-33","t":"5.2","s":1,"q":"不満を訴える顧客に、エージェントが気持ちを受け止めつつ解決策を提案しました。しかし顧客は「それより人と話したい」と求めました。どう対応すべきですか？","o":["人と話したいという希望なので、担当者へ引き継ぐ","もう一度、エージェントで解決できると説得する","解決策を先に実行し、後で人から連絡させる","感情スコアを確認してから、引き継ぐか判断する"],"a":[0],"e":"対応範囲内なら解決を提案し、顧客が希望を繰り返した場合にエスカレーションします。","w":["正解。","顧客の明示的な希望に反します。","顧客の希望に反します。","明示的な要求に感情分析は不要です。"]},
{"id":"d5-34","t":"5.2","s":1,"q":"顧客の相談に対応するには、エージェントに権限のない社内システムの操作が必要で、何度試しても前に進めません。どうすべきですか？","o":["前に進めないので、状況をまとめて担当者へ引き継ぐ","いずれ通るかもしれないので、同じ操作を繰り返す","顧客に、自分で社内システムを操作するよう案内する","できない理由は伏せたまま、会話を終える"],"a":[0],"e":"意味のある前進ができない場合は、エスカレーションの適切なトリガーです。","w":["正解。","状況は改善しません。","不可能・不適切な案内です。","顧客の問題が放置されます。"]},
{"id":"d5-35","t":"5.2","s":1,"q":"返品ポリシーは「購入から30日以内」と定めています。顧客は入院していたため31日目の連絡になったと説明し、例外を求めています。エージェントの対応として最も適切なものはどれですか？","o":["ポリシーの例外の判断なので、担当者へ引き継ぐ","規則は規則なので、ポリシーどおりに機械的に断る","気の毒なので、エージェントの判断で返品を受け付ける","診断書の提出を求め、内容を見てエージェントが判断する"],"a":[0],"e":"ポリシーの例外や空白（単に複雑なだけでなく）は、エスカレーションの適切なトリガーです。","w":["正解。","例外の判断が必要なケースを機械的に処理しています。","ポリシーの例外を勝手に判断しています。","例外の判断をエージェントが行っています。"]},
{"id":"d5-36","t":"5.2","s":1,"q":"エージェントに1〜10の確信度を自己申告させ、5未満なら人へエスカレーションする仕組みにしましたが、難しいケースでも高い確信度を出してしまいます。この結果の説明として最も適切なものはどれですか？","o":["自己申告の確信度はうまく校正されておらず、複雑さの指標にならない","閾値を5から7に上げれば、難しいケースも拾えるようになる","確信度を1〜100の細かい範囲にすれば、正確に測れるようになる","確信度を出させる指示が短すぎて、正しく測れていなかったのが原因"],"a":[0],"e":"自己申告の確信度は、ケースの複雑さの信頼できる代理指標ではありません。明確な基準とFew-shot例が推奨されます。","w":["正解。","校正されていない点は変わりません。","尺度を変えても校正の問題は解決しません。","根本的な問題ではありません。"]},
{"id":"d5-37","t":"5.2","s":1,"q":"エスカレーションの適切なトリガーとして、公式ガイドに挙げられているものを2つ選んでください。","o":["顧客が人間の担当者を明示的に求めた","顧客の依頼に対して、ポリシーがあいまい、または何も定めていない","顧客のメッセージに否定的な言葉が多い","エージェントの自己申告の確信度が低い","会話が5往復を超えた"],"a":[0,1],"e":"適切なトリガーは、顧客の要求、ポリシーの例外や空白、前に進めないこと、です。","w":["正解。","正解。","感情は複雑さの指標になりません。","自己申告の確信度は当てになりません。","往復数は複雑さの指標ではありません。"]},
{"id":"d5-38","t":"5.3","s":3,"q":"検索サブエージェントが失敗時に「search unavailable」とだけ返すため、コーディネーターは毎回同じ方法で再試行するしかありません。この設計の問題点はどれですか？","o":["汎用的なステータスが、回復の判断材料を隠している","エラーの文章が英語であること","コーディネーターの再試行回数の上限が少なく、成功するまで十分に繰り返せていないこと","検索サブエージェントのツールが少ないこと"],"a":[0],"e":"汎用的なエラーステータスは、コーディネーターが賢い回復判断をするための文脈を隠してしまいます。","w":["正解。","言語の問題ではありません。","情報がなければ、回数を増やしても判断は良くなりません。","根本原因ではありません。"]},
{"id":"d5-39","t":"5.3","s":3,"q":"5つのサブエージェントのうち1つがタイムアウトしただけで、調査ワークフロー全体が停止する設計になっています。どう改善すべきですか？","o":["失敗を構造化エラーで受け取り、残りの結果で進めて不足を注記する","タイムアウトを防ぐため、すべてのサブエージェントのタイムアウトを無制限にする","失敗したサブエージェントの結果は、空の成功として扱って続ける","障害点を減らすため、すべてのサブエージェントを1つに統合する"],"a":[0],"e":"単一の失敗でワークフロー全体を止めるのはアンチパターンです。部分的な結果で進め、カバレッジの不足を注記します。","w":["正解。","いつまでも終わらない危険があります。","失敗の握りつぶしもアンチパターンです。","専門化の利点を失います。"]},
{"id":"d5-40","t":"5.3","s":3,"q":"一部のトピックで情報源にアクセスできないまま、調査を完了させることになりました。統合結果の書き方として公式ガイドに沿ったものはどれですか？","o":["根拠十分な部分と、情報源がなく不足した部分を区別して注記する","不足している分野には触れず、得られた情報だけでまとめる","不足している分野は、一般論で補って埋めておく","不足がある限り、レポートは出さずに待つ"],"a":[0],"e":"統合結果に、どの知見が十分に裏付けられ、どの分野に情報源の欠落による穴があるかを示します。","w":["正解。","読み手が網羅性を誤解します。","根拠のない内容が混ざります。","部分的な結果にも価値があります。"]},
{"id":"d5-41","t":"5.3","s":4,"q":"開発者支援エージェントで、ファイルを読み込むサブエージェントがまれに一時的なI/Oエラーに遭遇します。エラー処理の設計として最も適切なものはどれですか？","o":["まず内部で回復を試み、解決できないときだけ試行内容と部分結果を添えて伝える","一時的なエラーでも、安全のためすぐにワークフロー全体を停止する","エラーは記録だけして、読み込めなかったファイルは無視して進める","判断を任せるため、すべてのエラーを即座にメインのエージェントへ転送する"],"a":[0],"e":"一時的な失敗はサブエージェントがローカルで回復し、解決できないエラーだけを試行内容と部分結果とともに伝えます。","w":["正解。","回復できるのに止めるのはアンチパターンです。","失敗の握りつぶしになります。","簡単に回復できるものまで上げると、上位の負担が増えます。"]},
{"id":"d5-42","t":"5.3","s":3,"q":"サブエージェントからコーディネーターに伝える構造化されたエラー情報に含めるべきものを2つ選んでください。","o":["失敗の種類と、試したクエリ（何を試したか）","それまでに得られた部分的な結果と、代わりに取れる方法","サブエージェントのシステムプロンプトの全文","サブエージェントのソースコードの全文","「失敗しました」という一言だけ"],"a":[0,1],"e":"失敗の種類・試した内容・部分的な結果・代替アプローチを含めると、コーディネーターが賢く回復を判断できます。","w":["正解。","正解。","回復の判断に役立たず、コンテキストをムダに使います。","回復の判断に役立ちません。","汎用的なステータスは判断材料を隠します。"]},
{"id":"d5-43","t":"5.3","s":3,"q":"文献検索サブエージェントの報告で、コーディネーターが正しい判断をするために区別しておくべき状況の組み合わせはどれですか？","o":["アクセス失敗と、該当がなかった正常な空の結果","日本語で書かれた文献と、英語で書かれた文献","ページ数の多い文献と、ページ数の少ない文献","購読が必要な有料の文献と、無料で読める文献"],"a":[0],"e":"アクセス失敗（再試行などの判断が必要）と有効な空の結果（成功）を区別して報告することが重要です。","w":["正解。","エラー伝達の論点ではありません。","エラー伝達の論点ではありません。","エラー伝達の論点ではありません。"]},
{"id":"d5-44","t":"5.4","s":4,"q":"数時間にわたるコードベース調査で、後半になるほど回答が前半の発見と食い違うようになりました。発見を失わないための仕組みとして、最も適切なものはどれですか？","o":["重要な発見をスクラッチパッドに記録し、参照させる","劣化する前に終わるよう、調査のペースを上げる","同じ質問を何度も繰り返して、答えを確かめる","文脈を軽くするため、前半の会話を削除する"],"a":[0],"e":"スクラッチパッドファイルで重要な発見を永続化し、参照させることで、文脈の劣化に対抗します。","w":["正解。","劣化への対策になりません。","劣化した文脈のままでは改善しません。","重要な発見まで失われます。"]},
{"id":"d5-45","t":"5.4","s":4,"q":"調査を「全体構造の把握」→「依存関係の詳細調査」→「改修計画」の3フェーズで進め、各フェーズは新しいサブエージェントに担当させます。各フェーズの間で行うと効果的なことはどれですか？","o":["前のフェーズの要点を要約し、次の初期コンテキストに入れる","フェーズの間は何もせず、そのまま続けて進める","前のフェーズの会話履歴を、すべて次に渡す","フェーズごとに、前の結果は気にせずゼロから始める"],"a":[0],"e":"次のフェーズのサブエージェントを起動する前に、主要な発見を要約して初期コンテキストに注入します。","w":["正解。","文脈が膨らみ続け、劣化が進みます。","冗長で、コンテキストを浪費します。","重複作業が生じます。"]},
{"id":"d5-46","t":"5.4","s":4,"q":"複数エージェントによる長時間の分析で、途中のクラッシュに備えたいです。公式ガイドに沿った設計はどれですか？","o":["各エージェントが状態を書き出し、再開時にマニフェストを読み込んで注入する","状態は保存せず、クラッシュしたら毎回最初から分析をやり直す","全員の会話履歴を、1つのテキストファイルにそのまままとめて保存する","クラッシュしにくいよう、エージェントを1つだけにして処理する"],"a":[0],"e":"構造化された状態のエクスポート（マニフェスト）を使ったクラッシュ復旧が推奨されています。","w":["正解。","長時間の作業がムダになります。","構造化されておらず、再開時に扱いにくくなります。","根本的な対策ではありません。"]},
{"id":"d5-47","t":"5.4","s":2,"q":"Claude Code での長い探索の途中で、冗長な出力によりコンテキストがいっぱいになってきました。作業を続けながら使用量を減らすためのコマンドはどれですか？","o":["/compact","/memory","/review","--print"],"a":[0],"e":"/compact は、長い探索セッションで冗長な出力によりコンテキストが埋まったときに使用量を減らすために使います。","w":["正解。","読み込まれているメモリファイルの確認用です。","コンテキストの使用量を減らすためのコマンドとして公式ガイドが挙げているのは /compact です。","非対話モードのフラグです。"]},
{"id":"d5-48","t":"5.4","s":4,"q":"大規模なコードベース探索でのコンテキスト管理として、公式ガイドに沿ったものを2つ選んでください。","o":["具体的な調査はサブエージェントに任せ、メインは調整に徹する","重要な発見をスクラッチパッドに記録し、後で参照する","すべてのファイルを最初にメインのエージェントで読み込む","メモを取る手間を省くため、長いセッションでもすべてモデルの記憶に頼る","状態が壊れている恐れがあるので、クラッシュしたら必ず最初からやり直す"],"a":[0,1],"e":"サブエージェントへの委任と、スクラッチパッドファイルでの発見の永続化が推奨されています。","w":["正解。","正解。","コンテキストを大量に消費し、劣化を招きます。","文脈の劣化で回答がぶれます。","マニフェストを使った復旧が推奨されています。"]},
{"id":"d5-49","t":"5.5","s":6,"q":"抽出システムの全体の正確度は96%ですが、文書タイプ別に見ると、手書きの申込書だけ71%でした。この事実から学ぶべきことはどれですか？","o":["全体値は弱い区分を隠すので、区分別に確認する","全体で96%あるので、すべての文書タイプを自動化してよい","手書きの申込書は件数が少ないので、気にしなくてよい","今後は、全体の正確度だけを毎月確認すれば十分である"],"a":[0],"e":"集計された正確度は、特定の文書タイプや項目の低い性能を隠すことがあります。区分別に検証します。","w":["正解。","71%の区分まで自動化されてしまいます。","少数でも重大な誤りにつながる可能性があります。","区分ごとの問題を見逃します。"]},
{"id":"d5-50","t":"5.5","s":6,"q":"高確信度の抽出結果について、層別ランダムサンプリングを行う目的として最も適切なものはどれですか？","o":["高確信度の結果の誤り率を測り、新しいエラーを見つけるため","確認する件数を減らし、パイプライン全体の処理速度を上げるため","十分な精度を示して、人間のレビュアーを完全に不要にするため","確信度の低い結果を見つけ出して、自動で削除するため"],"a":[0],"e":"層別ランダムサンプリングは、高確信度の抽出結果の誤り率を測定し、新しいエラーパターンを検出するために使います。","w":["正解。","速度とは関係ありません。","人によるサンプリングが前提です。","目的が異なります。"]},
{"id":"d5-51","t":"5.5","s":6,"q":"モデルが出す項目ごとの確信度を、人のレビューへの振り分けに使う前にやるべきことはどれですか？","o":["正解付きの検証セットで校正してから閾値を決める","確信度の数値を2倍にして、差を大きくしてから使う","確信度が最も高い項目だけを、人のレビューに回す","確信度は使わず、項目の文字数で振り分ける"],"a":[0],"e":"項目レベルの確信度スコアは、ラベル付きの検証セットで校正してからレビューの振り分けに使います。","w":["正解。","根拠がありません。","逆です。確信度が低いものを優先します。","文字数と正確さは関係ありません。"]},
{"id":"d5-52","t":"5.5","s":6,"q":"元の文書の中で、同じ契約の金額が2か所で異なって書かれていました。この抽出結果の扱いとして最も適切なものはどれですか？","o":["矛盾のあるケースとして、人のレビューに優先して回す","どちらかの金額を選んで、そのまま自動処理する","2つの金額の平均を計算して、その値を採用する","その項目を空欄にして、自動処理を続ける"],"a":[0],"e":"確信度が低い抽出や、元の文書があいまい・矛盾している抽出は、人のレビューに優先して回します。","w":["正解。","誤ったデータが下流に流れる恐れがあります。","どちらにもない値を作り出しています。","情報が失われ、確認もされません。"]},
{"id":"d5-53","t":"5.5","s":6,"q":"人のレビューを減らして自動化の範囲を広げる前に、公式ガイドが重要としていることはどれですか？","o":["文書タイプ別・項目別に正確度を確認する","全体の正確度が95%を超えたことを確認する","十分な処理件数が積み上がったことを確認する","使っているモデルを最新版に更新しておく"],"a":[0],"e":"高確信度の抽出を自動化する前に、文書タイプや項目ごとの正確度を検証することが重要です。","w":["正解。","全体の数値だけでは、区分ごとの問題を見逃します。","件数は正確さの保証になりません。","正確度の検証の代わりにはなりません。"]},
{"id":"d5-54","t":"5.5","s":6,"q":"人のレビュー設計と確信度の扱いについて、公式ガイドに沿ったものを2つ選んでください。","o":["高確信度の結果も層別ランダムサンプリングで測り続ける","低確信度や、元の文書が矛盾する抽出を優先して人に回す","全体の正確度が十分に高ければ、文書タイプ別に分けて確認する必要はない","モデルが出した確信度は、校正せずにそのまま閾値に使ってよい","一度自動化して問題が出なければ、以後のサンプリングは不要になる"],"a":[0,1],"e":"継続的な層別サンプリングと、限られたレビュー能力を確信度の低いもの・あいまいなものに優先して使うことが推奨されています。","w":["正解。","正解。","区分別の確認が重要です。","ラベル付きの検証セットで校正してから使います。","新しいエラーパターンを見つけるため、継続的な測定が必要です。"]},
{"id":"d5-55","t":"5.6","s":3,"q":"統合の過程で要約を重ねるうちに、どの主張がどの論文に基づくのか分からなくなります。最も適切な対策はどれですか？","o":["主張と出典の対応表を出力させ、統合サブエージェントが保持してマージする","主張は要約に任せ、使った論文は最終レポートの末尾に参考文献としてまとめて載せる","読みやすさを優先し、統合の段階では出典の情報を気にせずに要約を進める","統合サブエージェントに、主張の内容から最も関係がありそうな論文を推測して出典を付けさせる"],"a":[0],"e":"構造化されたクレーム–ソース対応を、下流のエージェントが統合を通じて保持することが推奨されています。","w":["正解。","主張と出典の対応が分かりません。","出典が失われます。","誤った出典が付く恐れがあります。"]},
{"id":"d5-56","t":"5.6","s":3,"q":"文書分析サブエージェントが、2つの資料で同じ指標の値が異なることに気づきました。分析サブエージェントの対応として公式ガイドに沿ったものはどれですか？","o":["矛盾する値を両方注記して完了し、扱いはコーディネーターに委ねる","新しい資料の方が正確なはずなので、その値だけを採用して報告する","混乱を避けるため、矛盾には触れず片方の値だけ報告する","矛盾が解消されて値が確定するまで、分析そのものを止めて待つ"],"a":[0],"e":"矛盾する値も含めて注記付きで分析を完了し、統合に進む前の調整はコーディネーターが判断します。","w":["正解。","恣意的な選択で情報が失われます。","情報の握りつぶしです。","分析全体が止まってしまいます。"]},

function kwQuery(k) {
  const hit = q => q && GLOSSARY.some(t => (t.t + t.d).toLowerCase().includes(q.toLowerCase()));
  if (hit(k)) return k;
  const toks = k.split(/\s*(?:\/|／|・|＋|\+|vs|→|、)\s*|\s+/).map(x => x.replace(/[（）()「」"]/g, '').trim()).filter(x => x.length >= 2);
  return toks.find(hit) || null;
}

function buildExam(mode) {
  const cfg = MODES[mode];
  const combos = []; for (let a = 1; a <= 6; a++) for (let b = a + 1; b <= 6; b++) for (let c = b + 1; c <= 6; c++) for (let d = c + 1; d <= 6; d++) combos.push([a, b, c, d]);
  const fits = cb => DOMAINS.every((dm, di) => QS.filter(q => domOf(q.t) === dm.id && cb.includes(q.s)).length >= cfg.counts[di]);
  const valid = combos.filter(fits);
  const chosen = shuffle(valid.length ? valid : combos)[0];
  const pri = arr => shuffle(arr).sort((a, b) => seen(a) - seen(b));
  let picked = [];
  DOMAINS.forEach((d, di) => {
    const need = cfg.counts[di];
    const pool = QS.filter(q => domOf(q.t) === d.id);
    let take = pri(pool.filter(q => chosen.includes(q.s))).slice(0, need);
    if (take.length < need) take = take.concat(pri(pool.filter(q => !chosen.includes(q.s))).slice(0, need - take.length));
    picked.push(...take);
  });
  const order = [...chosen, ...[1, 2, 3, 4, 5, 6].filter(x => !chosen.includes(x))];
  picked = shuffle(picked).sort((a, b) => order.indexOf(a.s) - order.indexOf(b.s));
  const perm = {}; picked.forEach(q => perm[q.id] = shuffle(q.o.map((_, k) => k)));
  const now = Date.now();
  const used = order.filter(x => picked.some(q => q.s === x));
  S.run = { mode, ids: picked.map(q => q.id), perm, ans: {}, flags: {}, i: 0, start: now, end: now + cfg.min * 60000, chosen: used };
  save();
}

}

function vGlossary() {
