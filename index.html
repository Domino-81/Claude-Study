// ================= イベント =================
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  const kw = e.target.closest('.keys a[data-q]');
  if (kw) { G.q = kw.dataset.q; G.cat = 'all'; G.flash = false; return; }
  if (!b) return;
  const a = b.dataset.act;
  const n = S.count;
  switch (a) {
    case 'due': startQuiz(pickCount(shuffle(dueIds())), '今日の復習'); break;
    case 'over': startQuiz(pickCount(shuffle(overconf())).map(q => q.id), '思い込み注意'); break;
    case 'tfstart': startTF(pickCount(shuffle(TF).sort((x, y) => ((S.tf[x.id] && S.tf[x.id].n) || 0) - ((S.tf[y.id] && S.tf[y.id].n) || 0))).map(t => t.id), '○×一問一答'); break;
    case 'tfwrong': startTF(pickCount(shuffle(TF.filter(t => S.tf[t.id] && S.tf[t.id].last === 0))).map(t => t.id), '○× まちがえた問題'); break;
    case 'tfretry': startTF(shuffle(TFZ.ids.filter(id => TFZ.done[id] && !TFZ.done[id].ok)), '○× やり直し'); break;
    case 'tfans': answerTF(b.dataset.v === '1'); break;
    case 'tfnext': if (!TFZ) break; TFZ.i++; saveSession(); route(); break;
    case 'tfquit': TFZ = null; saveSession(); go('#practice'); break;
    case 'report': reportModal(b.dataset.id); break;
    case 'copyrp': { const t = $('#rptext'); try { navigator.clipboard.writeText(t.value).then(() => toast('コピーしました'), () => { t.select(); toast('選択しました。手動でコピーしてください'); }); } catch (er) { t.select(); } break; }
    case 'clearrp': modal('報告メモをすべて消しますか？', '<p>保存した「おかしいかも」のメモがすべて消えます。</p>', [{ label: 'キャンセル', cls: 'ghost' }, { label: '消去する', cls: 'danger', fn: () => { S.reports = {}; save(); rerender(); } }]); break;
    case 'quick': startQuiz(pickCount(shuffle(QS).sort((x, y) => seen(x) - seen(y))).map(q => q.id), 'クイック練習'); break;
    case 'wrong': startQuiz(pickCount(shuffle(QS.filter(q => S.q[q.id] && S.q[q.id].last === 0))).map(q => q.id), '苦手克服'); break;
    case 'bm': startQuiz(pickCount(shuffle(QS.filter(q => S.bm[q.id]))).map(q => q.id), 'ブックマーク'); break;
    case 'unseen': startQuiz(pickCount(shuffle(QS.filter(q => !S.q[q.id]))).map(q => q.id), '未出題の問題'); break;
    case 'dom': case 'weakdom': { const d = +b.dataset.d; startQuiz(pickCount(shuffle(QS.filter(q => domOf(q.t) === d)).sort((x, y) => (+!!(S.q[x.id] && S.q[x.id].last === 1)) - (+!!(S.q[y.id] && S.q[y.id].last === 1)))).map(q => q.id), `D${d} ${dom(d).short}`); break; }
    case 'scn': { const s = +b.dataset.s; startQuiz(pickCount(shuffle(QS.filter(q => q.s === s))).map(q => q.id), scn(s).ja); break; }
    case 'tquiz': { const t = b.dataset.t; startQuiz(shuffle(QS.filter(q => q.t === t)).map(q => q.id), `${t} ${task(t).ja}`); break; }
    case 'hidea2hs': S.hideA2HS = true; save(); rerender(); break;
    case 'count': S.count = +b.dataset.v; save(); rerender(); break;
    case 'read': { const id = b.dataset.id; S.read[id] = !S.read[id]; if (!S.read[id]) delete S.read[id]; save(); if (S.read[id]) toast('読了！おつかれさまです 🎉'); rerender(); break; }
    case 'opt': { if (!QZ) break; const q = QMAP[QZ.ids[QZ.i]]; const o = +b.dataset.o; if (q.a.length === 1) QZ.sel = [o]; else if (QZ.sel.includes(o)) QZ.sel = QZ.sel.filter(x => x !== o); else if (QZ.sel.length < q.a.length) QZ.sel = [...QZ.sel, o]; else { toast(`選べるのは${q.a.length}つまで。外したい選択肢をもう一度押してください`); break; } rerender(); break; }
    case 'answer': answerQuiz(b.dataset.sure !== '0'); break;
    case 'nextq': if (!QZ) break; QZ.i++; QZ.sel = []; saveSession(); route(); break;
    case 'quitquiz': QZ = null; saveSession(); go('#practice'); break;
    case 'retrywrong': { const w = QZ.ids.filter(id => QZ.done[id] && !QZ.done[id].ok); startQuiz(shuffle(w), 'まちがえた問題の復習'); break; }
    case 'bmq': { const id = b.dataset.id; S.bm[id] = !S.bm[id]; if (!S.bm[id]) delete S.bm[id]; save(); toast(S.bm[id] ? 'ブックマークしました' : 'ブックマークを外しました'); rerender(); break; }
    case 'startexam': {
      const m = b.dataset.m;
      const start = () => { buildExam(m); go('#run'); };
      if (S.run) modal('受験中の模試があります', '<p>新しく始めると、受験中の模試は破棄されます。</p>', [{ label: 'キャンセル', cls: 'ghost' }, { label: '破棄して開始', cls: 'danger', fn: start }]);
      else modal(`${MODES[m].label}を始めますか？`, `<p>${MODES[m].n}問・${MODES[m].min}分。開始と同時にタイマーが動きます。</p>`, [{ label: 'キャンセル', cls: 'ghost' }, { label: '開始する', cls: 'primary', fn: start }]);
      break; }
    case 'abandon': modal('模試を破棄しますか？', '<p>回答内容は保存されません。</p>', [{ label: 'キャンセル', cls: 'ghost' }, { label: '破棄する', cls: 'danger', fn: () => { S.run = null; save(); rerender(); } }]); break;
    case 'xopt': { if (!S.run) break; const R = S.run, id = R.ids[R.i], q = QMAP[id], o = +b.dataset.o; let sel = R.ans[id] || []; if (q.a.length === 1) sel = [o]; else if (sel.includes(o)) sel = sel.filter(x => x !== o); else if (sel.length < q.a.length) sel = [...sel, o]; else { toast(`選べるのは${q.a.length}つまで。外したい選択肢をもう一度押してください`); break; } R.ans[id] = sel; save(); rerender(); break; }
    case 'xprev': if (S.run && S.run.i > 0) { S.run.i--; save(); route(); } break;
    case 'xnext': if (S.run && S.run.i < S.run.ids.length - 1) { S.run.i++; save(); route(); } break;
    case 'flag': { if (!S.run) break; const id = S.run.ids[S.run.i]; S.run.flags[id] = !S.run.flags[id]; save(); rerender(); break; }
    case 'navopen': if (S.run) navDrawer(); break;
    case 'finishask': {
      if (!S.run) break;
      const R = S.run, un = R.ids.filter(id => !(R.ans[id] || []).length).length, part = R.ids.filter(id => isPartial(R, id)).length, fl = R.ids.filter(id => R.flags[id]).length;
      modal('解答を終了して採点しますか？', `<p>未回答：<b>${un}問</b>　選択数が足りない：<b>${part}問</b>　見直しフラグ：<b>${fl}問</b></p>${un || part ? '<p class="note">未回答・選択数が足りない問題は不正解として採点されます。</p>' : ''}`, [{ label: '問題に戻る', cls: 'ghost' }, ...(un || part || fl ? [{ label: '一覧を見る', fn: () => { setTimeout(navDrawer, 0); } }] : []), { label: '採点する', cls: 'primary', fn: () => finishExam(false) }]);
      break; }
    case 'rvf': rvFilter = b.dataset.k; rerender(); break;
    case 'examwrong': { const E = S.exams[+b.dataset.x]; startQuiz(shuffle(E.ids.filter(id => !sameSet(E.ans[id] || [], QMAP[id].a))), '模試のまちがい直し'); break; }
    case 'gmode': G.flash = b.dataset.v === '1'; G.i = 0; G.flip = false; G.order = null; rerender(); break;
    case 'gcat': G.cat = b.dataset.k; G.i = 0; G.order = null; rerender(); break;
    case 'flip': flipCard(); break;
    case 'fnext': G.i = (G.i + 1) % Math.max(1, gList().length); G.flip = false; rerender(); break;
    case 'fprev': { const L = Math.max(1, gList().length); G.i = (G.i - 1 + L) % L; G.flip = false; rerender(); break; }
    case 'fshuf': G.order = shuffle(gList().map((_, i) => i)); G.i = 0; G.flip = false; rerender(); toast('シャッフルしました'); break;
    case 'theme': S.theme = b.dataset.k; save(); applyTheme(); rerender(); break;
    case 'copybk': { const t = $('#bk'); const ok = () => toast('コピーしました'); try { navigator.clipboard.writeText(t.value).then(ok, () => { t.select(); toast('選択しました。手動でコピーしてください'); }); } catch (er) { t.select(); toast('選択しました。手動でコピーしてください'); } break; }
    case 'restore': restoreFrom($('#rs').value); break;
    case 'pickfile': { const f = $('#bkfile'); if (f) f.click(); break; }
    case 'reset': modal('すべての記録を消去しますか？', '<p>読了・回答履歴・ブックマーク・模試の記録がすべて消えます。元に戻せません。</p>', [{ label: 'キャンセル', cls: 'ghost' }, { label: '消去する', cls: 'danger', fn: () => { const th = S.theme; S = blank(); S.theme = th; save(); toast('消去しました'); rerender(); } }]); break;
  }
});
function answerQuiz(sure = true) {
  const id = QZ.ids[QZ.i], q = QMAP[id];
  if (QZ.done[id] || QZ.sel.length !== q.a.length) return;
  const ok = sameSet(QZ.sel, q.a);
  QZ.done[id] = { sel: QZ.sel.slice(), ok, sure };
  record(q, ok, sure, true); save(); saveSession(); rerender();
}
function restoreFrom(txt) {
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !d.q) throw 0;
    const c = sanitize(Object.assign({}, d, { theme: S.theme, count: S.count, run: S.run, hideA2HS: S.hideA2HS }));
    S = c;
    save(); toast('復元しました'); rerender();
  } catch (e) { toast('読み込めませんでした。バックアップのテキストを丸ごと貼り付けてください'); }
}
document.addEventListener('change', e => {
  if (e.target.id === 'bkfile' && e.target.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(e.target.files[0]); }
});
function flipCard() { G.flip = !G.flip; const f = $('.flash'); if (!f) return; f.classList.toggle('flip', G.flip); const fs = $$('.face', f); if (fs[0]) fs[0].setAttribute('aria-hidden', G.flip); if (fs[1]) fs[1].setAttribute('aria-hidden', !G.flip); }
function updateGlossary(v) { G.q = v; G.i = 0; G.order = null; const gl = $('#glist'); if (gl) gl.innerHTML = gInner(); }
document.addEventListener('input', e => { if (e.target.id === 'gq' && !e.isComposing) updateGlossary(e.target.value); });
document.addEventListener('compositionend', e => { if (e.target.id === 'gq') updateGlossary(e.target.value); });
document.addEventListener('keydown', e => {
  const ov = $('.overlay');
  if (ov) {
    if (e.key === 'Escape') { e.preventDefault(); closeOverlay(ov); return; }
    if (e.key === 'Tab') { const fs = $$('button, [href], textarea, input:not([tabindex="-1"])', ov).filter(x => !x.disabled); if (fs.length) { const first = fs[0], last = fs[fs.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } else if (!ov.contains(document.activeElement)) { e.preventDefault(); first.focus(); } } }
    return;
  }
  if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('button, a, summary, [role="button"]') && !e.target.closest('.opt, .tf-b, .flash-in')) return;
  const h = location.hash.slice(1);
  const k = e.key.toLowerCase();
  const idx = '12345'.indexOf(k) >= 0 ? '12345'.indexOf(k) : 'abcde'.indexOf(k);
  if (h === 'quiz' && QZ && QZ.i < QZ.ids.length) {
    const id = QZ.ids[QZ.i];
    if (idx >= 0 && !QZ.done[id]) { const btn = $$('.opt')[idx]; if (btn) { btn.click(); e.preventDefault(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (QZ.done[id]) { QZ.i++; QZ.sel = []; saveSession(); route(); } else answerQuiz(!e.shiftKey); }
  } else if (h === 'tf' && TFZ && TFZ.i < TFZ.ids.length) {
    const r = TFZ.done[TFZ.ids[TFZ.i]];
    if (!r && (k === 'o' || e.key === 'ArrowLeft')) { e.preventDefault(); answerTF(true); }
    else if (!r && (k === 'x' || e.key === 'ArrowRight')) { e.preventDefault(); answerTF(false); }
    else if (r && e.key === 'Enter') { e.preventDefault(); TFZ.i++; saveSession(); route(); }
  } else if (h === 'run' && S.run) {
    if (idx >= 0) { const btn = $$('.opt')[idx]; if (btn) { btn.click(); e.preventDefault(); } }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { if (S.run.i < S.run.ids.length - 1) { S.run.i++; save(); route(); e.preventDefault(); } }
    else if (e.key === 'ArrowLeft') { if (S.run.i > 0) { S.run.i--; save(); route(); e.preventDefault(); } }
    else if (k === 'f') { const id = S.run.ids[S.run.i]; S.run.flags[id] = !S.run.flags[id]; save(); rerender(); }
  } else if (h === 'glossary' && G.flash) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
    else if (e.key === 'ArrowRight') { G.i = (G.i + 1) % Math.max(1, gList().length); G.flip = false; rerender(); }
    else if (e.key === 'ArrowLeft') { const L = Math.max(1, gList().length); G.i = (G.i - 1 + L) % L; G.flip = false; rerender(); }
  }
});
window.addEventListener('hashchange', route);
window.addEventListener('online', () => { if (/^#?(home)?$/.test(location.hash.replace('#', '')) || location.hash === '#home') rerender(); });
window.addEventListener('offline', () => { toast('オフラインになりました。そのまま学習を続けられます'); if (location.hash === '' || location.hash === '#home') rerender(); });
applyTheme(); shell(); route();
if (!document.getElementById('toast')) { const t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.hidden = true; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
})();
